<script type="application/json" id="d">[{"n": "Периодизация истории государства и права России.", "h": "<p><em>По видео<\/em><\/p>\n<p>Периодизация на основе эволюции формы государства (формы правления,\nтерриториального устройства и политического режима):<\/p>\n<p><strong>1)Период княжеско-земский (удельно-вечевой)<\/strong><\/p>\n<p>Нет единого политического центра, также нет единого центра\nформулировки правовых норм. Есть княжеская и земская (земская община)\nвласть, есть удельные князья (уделы) и есть вече (представляет\nземство).<\/p>\n<p><strong>2)Царский период<\/strong><\/p>\n<p>Начинается в конце 15 века. Данный период эволюционирует от\nцентрализованной монархии до абсолютной монархии, которая оформляется в\nначале 18 века.<\/p>\n<p><strong>3)Период империи<\/strong><\/p>\n<p>Является продолжением царского монархического периода, но уже в\nдругих территориальных реалиях. В данном периоде особую роль начинает\nиграть территориальное устройство.<\/p>\n<p><strong>4)Период республики <\/strong><\/p>\n<p>С одной стороны, это провозглашенная республика в сентябре 1917 года\nвременным правительством, с другой, это республика советов, в рамках\nкоторой советское государство существовало на протяжении 70 лет 20-го\nвека.<\/p>\n<p><em>Из интернета<\/em><\/p>\n<p>*ИГПР можно **разделить на следующие периоды:*<\/p>\n<p><strong>1)Древняя Русь<\/strong> (IX - XII вв.); Особенности: в основе\nправовой системы юридический обычай и судебный прецедент, !!! — закон\nиграет второстепенную роль (русско-византийские договоры, Русская\nправда, церковные уставы). Форма правления: <strong>раннефеодальная\nмонархия<\/strong>. Относительно единое государство.<\/p>\n<p><strong>2)Период феодальной раздробленности<\/strong> (ХII-ХIV вв.);\nОсобенности: разрушение относительно единого государства. Образование\nсуверенных (удельных) государств/княжеств. Киев перестает играть роль\nполит., эконом. и культ. центра. После монгольских нашествий XIII в.\nрусское население уходит с разоренного юга на север ⇒ усиливаются\nсеверные княжества ⟹ развиваются Новгородская и Псковская республики.\nОсновные правовые источники - местные уставы.<\/p>\n<p><strong>3)Русское (Московское) государство<\/strong> (XV—XVII\nвв.);<\/p>\n<ul>\n<li><p>Образование единого Московского государства. Присоединение\nудельных княжеств к Москве, политическая централизация (XV – сер. XVI\nвв.)<\/p><\/li>\n<li><p>Расцвет Московской государственности. Сословно-представительная\nмонархия (Соборная монархия) (сер. XVI – нач. XVII вв.)<\/p><\/li>\n<\/ul>\n<p>Главный источник права - закон, НО сохраняются обычай и судебный\nпрецедент. Форма правления - <strong>самодержавная монархия<\/strong>. С\n1547 года русский монарх приобретает титул царя. Централизованное единое\nгосударство.<\/p>\n<p><strong>4)Российская Империя периода абсолютизма<\/strong> (XVIII —\nсередина XIX в.); Закон - единственный источник права. Власть русского\nцаря фактически и юридически не ограничена. С 1721 года русский царь\nстановится императором. В отличие от Европы, где абсолютизм\nсформировался при переходе от феодализма к капитализму, в России переход\nк абсолютизму совершается при господстве феодального\nсоциально-экономического уклада.<\/p>\n<p><strong>5)Российская Империя периода перехода к буржуазной\nмонархии<\/strong> (сер XIX — начало XX в.);<\/p>\n<ul>\n<li><p>Буржуазные реформы Александра II, в результате которых\nсовершается переход от феодализма к капитализму 60-70 гг. XIX века, при\nнеизменности формы правления.<\/p><\/li>\n<li><p>Реформы Николая II 1905-1906 гг. ⟹ начинается переход к новой\nформе правления – <strong>конституционной монархии.<\/strong><\/p><\/li>\n<\/ul>\n<p><strong>6)Россия в период буржуазно-демократической\nреспублики<\/strong> (февраль — октябрь 1917 г.)<\/p>\n<p><strong>7)Советский период <\/strong>(1917-1991 гг.):<\/p>\n<ul>\n<li><p>Период социалистической революции и создание Советского\nгосударства (1918—1920 гг.);<\/p><\/li>\n<li><p>Переходный период, или период нэпа** **( е правовые источники - местные уставы. 3)русское (московское) государство (xv—xvii вв.); образование единого московского государства. присоединение удельных княжеств к москве, политическая централизация (xv – сер. xvi вв.) расцвет московской государственности. сословно-представительная монархия (соборная монархия) (сер. xvi – нач. xvii вв.) главный источник права - закон, но сохраняются обычай и судебный прецедент. форма правления - самодержавная монархия . с 1547 года русский монарх приобретает титул царя. централизованное единое государство. 4)российская империя периода абсолютизма (xviii — середина xix в.); закон - единственный источник права. власть русского царя фактически и юридически не ограничена. с 1721 года русский царь становится императором. в отличие от европы, где абсолютизм сформировался при переходе от феодализма к капитализму, в россии переход к абсолютизму совершается при господстве феодального социально-экономического уклада. 5)российская империя периода перехода к буржуазной монархии (сер xix — начало xx в.); буржуазные реформы александра ii, в результате которых совершается переход от феодализма к капитализму 60-70 гг. xix века, при неизменности формы правления. реформы николая ii 1905-1906 гг. ⟹ начинается переход к новой форме правления – конституционной монархии. 6)россия в период буржуазно-демократической республики (февраль — октябрь 1917 г.) 7)советский период (1917-1991 гг.): период социалистической революции и создание советского государства (1918—1920 гг.); переходный период, или период нэпа** **(1921—1930 гг.); период государственно-партийного социализма (1930 — начало 1970-х гг.); период кризиса социализма (1970—1980 гг.); 8)постсоветский период (с 1991 г. по настоящее время). "}, {"n": "Правовое положение населения Киевской Руси.", "h": "<p>В IX в. в Древнерусском государстве установилось феодальное общество\nи сложились классы господствующих феодалов-землевладельцев и зависимого\nнаселения. <em>К господствующему классу относились:<\/em><\/p>\n<ol type=\"1\">\n<li><strong>великий князь;<\/strong><\/li>\n<\/ol>\n<p>2<strong>) местные князья и общинная знать (бояре)<\/strong> — крупные\nфеодалы-землевладельцы, бояре — вотчинники, обладающие значительной\nвластью в пределах собственной вотчины, которая впоследствии послужила\nодной из причин феодальной раздробленности на Руси. Бояре в XI–XII вв.\nучаствовали в боевых походах князя, управлении и судопроизводстве;<\/p>\n<ol start=\"3\" type=\"1\">\n<li><p><strong>верхушка служилых людей<\/strong> (составляли удельные\nкнязья, служилые люди, обеспечивающие работу государственного\nаппарата);<\/p><\/li>\n<li><p><strong>дружины князей<\/strong>, непосредственно подчиняющиеся\nлибо великому князю, либо удельному князю.<\/p><\/li>\n<\/ol>\n<p><em>К зависимому населению относятся:<\/em><\/p>\n<ol type=\"1\">\n<li><p><strong>смерды (крестьяне) <\/strong>— это лично свободные\nкрестьяне, имевшие свой дом, хозяйство, участок земли в пользовании, а\nтакже право участвовать в военных походах в качестве ополченцев. Смерд\nмог передавать свое имущество по наследству. Зависимость смердов от\nкнязей выражалась в обязанности платить князьям дань, подати. Личность и\nимущество смерда защищались законом. Смерд нес имущественную\nответственность за совершенные им проступки и преступления, по\nобязательствам и договорам. В судебном процессе смерд мог выступать\nполноправным участником;<\/p><\/li>\n<li><p><strong>закупы<\/strong> — смерды, которые взяли у хозяина в долг\nкакое-либо имущество под проценты, гарантировав его возвращение своим\nсамозакладом. Закуп отрабатывал свой долг у хозяина и не мог его\nпокинуть, пока не рассчитается, иначе его обращали в холопство. Закон\nохранял личность и имущество закупа, запрещая господину беспричинно\nнаказывать его и отнимать имущество. За правонарушение закупа хозяин\nуплачивал штраф потерпевшему, но закупа могли обратить в холопство. В\nсудебном процессе закуп мог выступать в качестве свидетеля только в\nособых случаях;<\/p><\/li>\n<li><p><strong>рядовичи<\/strong> — это крестьяне, работающие у\nземлевладельцев по договору (ряду);<\/p><\/li>\n<li><p><strong>изгои<\/strong> — это люди, которые вышли из общины и\nнаходятся вне социальных групп;<\/p><\/li>\n<li><p><strong>прощенники<\/strong> — это лица, попавшие под\nпокровительство церкви, монастырей или светских феодалов и обязанные за\nэто отработать в их хозяйствах;<\/p><\/li>\n<li><p><strong>холопы (челядины)<\/strong> — это лица, попавшие в рабство\nв результате самопродажи, рождения от рабыни, купли-продажи, брака с\nрабом (рабыней), поступления в ключничество, совершения преступления, а\nтакже плена. Холоп не защищался законом. За его убийство хозяину\nвыплачивался штраф, как за уничтожение имущества. В судебном процессе\nхолоп не мог выступать в качестве стороны;<\/p><\/li>\n<li><p><strong>докладные холопы<\/strong> — это княжеские или боярские\nслуги, которые ведали отдельными отраслями хозяйства (ключники, тиуны,\nогнищане, конюшие, старосты, пашенные). Со временем такие холопы могли\nполучить свободу;<\/p><\/li>\n<li><p><strong>кабальные холопы<\/strong> — холопы, которые не могли\nотчуждаться, как обычное имущество. Дети кабальных холопов не\nстановились холопами. Отношения хозяина и кабального холопа строились на\nличном соглашении, смерть одной из сторон прекращала\nобязательство.<\/p><\/li>\n<\/ol>\n<p>Помимо господствующего класса и зависимого населения, существовали\nтакже промежуточные и переходные категории, такие как <em>городское\nнаселение, которое делилось на:<\/em><\/p>\n<ol type=\"1\">\n<li><p><strong>боярство<\/strong>;<\/p><\/li>\n<li><p><strong>духовенство<\/strong>;<\/p><\/li>\n<li><p><strong>купечество<\/strong>;<\/p><\/li>\n<li><p><strong>«низы» (ремесленники, мелкие торговцы, рабочие и\nдр.)<\/strong><\/p><\/li>\n<\/ol>\n<p>Особую категорию населения составляли <strong>церковные\nслужители<\/strong>, которые в период раннефеодальной монархии имели\nзначительную власть, т. к. церковь была одним из самых крупных\nфеодалов-землевладельцев.<\/p>\n", "t": " в ix в. в древнерусском государстве установилось феодальное общество и сложились классы господствующих феодалов-землевладельцев и зависимого населения. к господствующему классу относились: великий князь; 2 ) местные князья и общинная знать (бояре) — крупные феодалы-землевладельцы, бояре — вотчинники, обладающие значительной властью в пределах собственной вотчины, которая впоследствии послужила одной из причин феодальной раздробленности на руси. бояре в xi–xii вв. участвовали в боевых походах князя, управлении и судопроизводстве; верхушка служилых людей (составляли удельные князья, служилые люди, обеспечивающие работу государственного аппарата); дружины князей , непосредственно подчиняющиеся либо великому князю, либо удельному князю. к зависимому населению относятся: смерды (крестьяне) — это лично свободные крестьяне, имевшие свой дом, хозяйство, участок земли в пользовании, а также право участвовать в военных походах в качестве ополченцев. смерд мог передавать свое имущество по наследству. зависимость смердов от князей выражалась в обязанности платить князьям дань, подати. личность и имущество смерда защищались законом. смерд нес имущественную ответственность за совершенные им проступки и преступления, по обязательствам и договорам. в судебном процессе смерд мог выступать полноправным участником; закупы — смерды, которые взяли у хозяина в долг какое-либо имущество под проценты, гарантировав его возвращение своим самозакладом. закуп отрабатывал свой долг у хозяина и не мог его покинуть, пока не рассчитается, иначе его обращали в холопство. закон охранял личность и имущество закупа, запрещая господину беспричинно наказывать его и отнимать имущество. за правонарушение закупа хозяин уплачивал штраф потерпевшему, но закупа могли обратить в холопство. в судебном процессе закуп мог выступать в качестве свидетеля только в особых случаях; рядовичи — это крестьяне, работающие у землевладельцев по договору (ряду); изгои — это люди, которые вышли из общины и находятся вне социальных групп; прощенники — это лица, попавшие под покровительство церкви, монастырей или светских феодалов и обязанные за это отработать в их хозяйствах; холопы (челядины) — это лица, попавшие в рабство в результате самопродажи, рождения от рабыни, купли-продажи, брака с рабом (рабыней), поступления в ключничество, совершения преступления, а также плена. холоп не защищался законом. за его убийство хозяину выплачивался штраф, как за уничтожение имущества. в судебном процессе холоп не мог выступать в качестве стороны; докладные холопы — это княжеские или боярские слуги, которые ведали отдельными отраслями хозяйства (ключники, тиуны, огнищане, конюшие, старосты, пашенные). со временем такие холопы могли получить свободу; кабальные холопы — холопы, которые не могли отчуждаться, как обычное имущество. дети кабальных холопов не становились холопами. отношения хозяина и кабального холопа строились на личном соглашении, смерть одной из сторон прекращала обязательство. помимо господствующего класса и зависимого населения, существовали также промежуточные и переходные категории, такие как городское население, которое делилось на: боярство ; духовенство ; купечество ; «низы» (ремесленники, мелкие торговцы, рабочие и др.) особую категорию населения составляли церковные служители , которые в период раннефеодальной монархии имели значительную власть, т. к. церковь была одним из самых крупных феодалов-землевладельцев. "}, {"n": "Государственный строй Киевской Руси.", "h": "<p>Киевская Русь сложилась в форме <strong>раннефеодальной\nмонархии<\/strong>. На вершине государственной власти стоял Великий\nкнязь. К органам власти относились также боярский совет (совет при\nкнязе), вече.<\/p>\n<p><strong>Князь.<\/strong> Им мог быть только член семьи Владимира\nВеликого. Киевская Русь не имела четко определенного\nпрестолонаследственного права. Сначала Великий князь правил с помощью\nсыновей, которые полностью подчинялись ему. После Ярослава\nустанавливается право всех сыновей князя на наследование в Русской\nземле. Компетенция и власть князя были неограниченными и зависели от его\nавторитета и реальной силы, на которую он опирался. Князь был\nвоеначальником, ему принадлежала инициатива военных походов и их\nорганизация. Также князь обладал дипломатической властью. Князь\nвозглавлял администрацию и суд. Он имел право принимать новые законы,\nизменять старые. Так, Ярославичи решили отменить кровную месть, заменив\nее штрафом. Князь собирал налоги с населения, судебные сборы и уголовные\nштрафы. Князь Киевский имел влияние на церковные дела.<\/p>\n<p><strong>Боярский совет<\/strong>, а сначала — <strong>совет дружины\nкнязя<\/strong>, был неотъемлемой частью механизма власти. Советоваться с\nдружиной, а позднее — с боярами, было моральной обязанностью князя. С\nростом власти князя вече утрачивает свое значение и только тогда, когда\nвласть киевских князей приходит в упадок, снова возрастает. Вече имело\nправо избирать князя или отказывать ему в княжении. Избранный населением\nкнязь должен был заключить с вече договор — «ряд» (возможно указывались\nобязанности князя перед населением)<\/p>\n<p><strong>Вече<\/strong> не имело определенной компетенции, порядка\nсозыва. Иногда вече созывал князь, чаще оно собиралось без его воли.\nНеясно, как проходили вечевые собрания, кто на них председательствовал.\nНа вече голосов не подсчитывали, побеждала та идея, которую поддерживало\nявное большинство. Участие в вече принимали главы семей свободных людей.\nСледовательно, можно сделать вывод, что ни боярский совет, ни вече в\nКиевской Руси не обрели парламентской формы и не превратились в\nпостоянные государственные органы. Компетенция веча включала высшее\nуправление (призвание и изгнание князя, договоры с князьями), текущее\nуправление (участие в назначении и смене чиновников), суд, закрепление\nнорм обычного права, вопросы войны, созыв народного ополчения.<\/p>\n<p>Четко определенных органов управления в Киевской Руси не было.\nДлительное время существовала десятинная система (тысяцкие, сотские,\nдесятники), которая сохранилась от военной демократии и выполняла\nадминистративные, финансовые и иные функции. Со временем ее вытесняет\n<strong>дворцово-вотчинная система управления<\/strong>, т.е. такая\nсистема управления, при которой княжеские слуги со временем превратились\nв государственных должностных лиц, осуществлявших различные функции\nуправления государством.<\/p>\n<p>Местное управление осуществлялось <strong>представителями князя (в\nгородах — посадники, в сельской местности — волостели)<\/strong>, которые\nв своей деятельности опирались на военные подразделения. На княжеских\nнаместниках лежали обязанности оперативного управления, сбора налогов,\nосуществления правосудия и пр. За осуществление этих функций они\nполучали от населения плату <strong>(«корм»)<\/strong>, размер которой\nзависел общего размера собранного с населения имущества. Иного жалованья\nу рассматриваемых должностных лиц Древнерусского государства не было.\nЭта система получила название <strong>«система кормлений»<\/strong>.<\/p>\n<p>Органом местного крестьянского самоуправления была\n<strong>вервь<\/strong> — сельская территориальная община. Власть князя и\nего администрации распространялась на города и население земель, которые\nне были собственностью бояр. Боярские вотчины постепенно приобретают\nиммунитет и освобождаются от княжеской юрисдикции. Население этих вотчин\nстановится полностью подвластным боярам-собственникам.<\/p>\n<p>Судебная власть осуществлялась не самостоятельными судебными\nорганами, а <strong>представителями администрации<\/strong>, в том числе\n<strong>великим князем<\/strong>. Также судебную деятельность\nосуществляла церковь — в отношении духовенства, зависимого населения\nсвоих земель, а по отдельным категориям дел, в частности по\nпреступлениям против религии — в отношении всего населения Древней Руси.\nПомимо указанных субъектов судебной властью также наделены были феодалы,\n князя,\nсколько <strong>«обидой»<\/strong>, то есть причинением морального или\nматериального ущерба лицу или группе лиц (форма ответственности:\nвозмещение ущерба, штрафные санкции в пользу князя).<\/p>\n<p>Не было четкой границы между уголовным и гражданско-правовым\nправонарушением. Чертой, какую Русская Правда проводит между уголовным\nпреступлением и гражданским правонарушением, служит денежное взыскание в\nпользу князя за первое. Значит, если Русская Правда и понимала\nответственность за преступление и даже не только перед потерпевшим, но и\nперед обществом в лице князя, то ответственность только внешнюю,\nматериальную, без участия нравственного мотива.<\/p>\n<p>Русская правда разграничивает <strong>покушение на\nпреступление<\/strong> и <strong>оконченное преступление<\/strong>\n(наказывался человек, только обнаживший меч). Говорит о понятии\n<strong>соучастия<\/strong> (нападение «скопом»), но еще не разделяет\nролей соучастников (если преступление совершалось несколькими лицами, то\nответственность для соучастников устанавливалась одинаковой), понятии о\n<strong>превышении пределов необходимой обороны<\/strong> (если вора\nубьют, когда непосредственная опасность в его действиях уже отпала),\nпонятии <strong>смягчающих<\/strong> и <strong>отягчающих\nобстоятельств<\/strong> («на пиру явлено», «на разбое без всякой\nсвады»).<\/p>\n<p>Существовало два вида преступлений – <strong>против личности<\/strong>\nи <strong>имущественные<\/strong>. К первым относились убийство,\nнанесение увечий, а также всяческие оскорбительные действия (чашей,\nрогом, мечом в ножнах, вырывание усов и бороды и пр.). Имущественные\nпреступления по Русской Правде включали: разбой (не отличимый еще от\nграбежа), кражу (\"татьбу\"), уничтожение чужого имущества, угон,\nповреждение межевых знаков, поджог, конокрадство (как особый вид кражи),\nзлостную неуплату долга и пр.<\/p>\n<p>Впервые в ст. 8 было сформулировано понятие\n<strong>\"рецидивист\"<\/strong>, что выразилось в различии наказаний вору,\nсовершившему кражу на посаде один-два раза, и вору профессиональному.\nНаходка украденного была достаточным основанием для признания человека\nвором.<\/p>\n<p>Система наказаний довольно простая. Высшая мера наказания -\n<strong>поток и разграбление<\/strong> - назначалась за убийство в\nразбое, поджог и конокрадство. Заключалось в конфискации имущества и\nобращении преступника вместе с семьёй в рабство. Следующим по тяжести\nнаказания была <strong>вира<\/strong> - штраф, который уплачивался\nубийцей и назначался только за убийство (размер виры зависел от статуса\nубитого, за убийство огнищанина или тиуна-80 гривен, за смерда-5\nгривен). За нанесение увечий, тяжких телесных повреждений назначались\n<strong>полувиры<\/strong>. Все остальные преступления наказывались\n<strong>продажей<\/strong> - штрафом, размер которого зависел от тяжести\nпреступления. Продажа поступала в казну, а потерпевший получал\n<strong>урок<\/strong> - денежное возмещение за причинённый ущерб.\n<strong>Смертная казнь<\/strong> в РП не упоминается, хотя применялась на\nпрактике.<\/p>\n", "t": " преступление являлось не столько нарушением закона или воли князя, сколько «обидой» , то есть причинением морального или материального ущерба лицу или группе лиц (форма ответственности: возмещение ущерба, штрафные санкции в пользу князя). не было четкой границы между уголовным и гражданско-правовым правонарушением. чертой, какую русская правда проводит между уголовным преступлением и гражданским правонарушением, служит денежное взыскание в пользу князя за первое. значит, если русская правда и понимала ответственность за преступление и даже не только перед потерпевшим, но и перед обществом в лице князя, то ответственность только внешнюю, материальную, без участия нравственного мотива. русская правда разграничивает покушение на преступление и оконченное преступление (наказывался человек, только обнаживший меч). говорит о понятии соучастия (нападение «скопом»), но еще не разделяет ролей соучастников (если преступление совершалось несколькими лицами, то ответственность для соучастников устанавливалась одинаковой), понятии о превышении пределов необходимой обороны (если вора убьют, когда непосредственная опасность в его действиях уже отпала), понятии смягчающих и отягчающих обстоятельств («на пиру явлено», «на разбое без всякой свады»). существовало два вида преступлений – против личности и имущественные . к первым относились убийство, нанесение увечий, а также всяческие оскорбительные действия (чашей, рогом, мечом в ножнах, вырывание усов и бороды и пр.). имущественные преступления по русской правде включали: разбой (не отличимый еще от грабежа), кражу (\"татьбу\"), уничтожение чужого имущества, угон, повреждение межевых знаков, поджог, конокрадство (как особый вид кражи), злостную неуплату долга и пр. впервые в ст. 8 было сформулировано понятие \"рецидивист\" , что выразилось в различии наказаний вору, совершившему кражу на посаде один-два раза, и вору профессиональному. находка украденного была достаточным основанием для признания человека вором. система наказаний довольно простая. высшая мера наказания - поток и разграбление - назначалась за убийство в разбое, поджог и конокрадство. заключалось в конфискации имущества и обращении преступника вместе с семьёй в рабство. следующим по тяжести наказания была вира - штраф, который уплачивался убийцей и назначался только за убийство (размер виры зависел от статуса убитого, за убийство огнищанина или тиуна-80 гривен, за смерда-5 гривен). за нанесение увечий, тяжких телесных повреждений назначались полувиры . все остальные преступления наказывались продажей - штрафом, размер которого зависел от тяжести преступления. продажа поступала в казну, а потерпевший получал урок - денежное возмещение за причинённый ущерб. смертная казнь в рп не упоминается, хотя применялась на практике. "}, {"n": "Суд и процесс в Древней Руси.", "h": "<p>Разделения процесса на гражданский или уголовный еще не было, любое\nдело именовалось <strong>тяжбой<\/strong> или\n<strong>«тяжей»<\/strong>.<\/p>\n<p>Судебный процесс носил ярко выраженный <strong>состязательный\nхарактер<\/strong>, и в связи с этим <em>обладал следующими признаками:\n<\/em><\/p>\n<ol type=\"1\">\n<li>начинался только по инициативе истца;<\/li>\n<\/ol>\n<p>2)стороны, то есть истец и ответчик, обладали равными правами;<\/p>\n<ol start=\"3\" type=\"1\">\n<li>судопроизводство было гласным и устным. Значительную роль в системе\nдоказательств играли «ордалии» («суд божий»), присяга и жребий.<\/li>\n<\/ol>\n<p>Авторитет принадлежал сторонам, а не судьям.<\/p>\n<p>Требуемые доказательства определяли не судьи, а стороны, называя\nиспытание железом или жребий; постановления суд не выносил, инициатива\nисходила от сторон.<\/p>\n<p>Суд не производил вызова свидетелей, их явка осуществлялась ими\nдобровольно или по инициативе (вызову) сторон.<\/p>\n<p><em>Процесс делился на три стадии: <\/em><\/p>\n<ol type=\"1\">\n<li><p><strong>«Заклич»<\/strong> – объявление о совершившемся\nпреступлении. Производился он в людном месте, «на торгу». Объявлялось,\nнапример, о пропаже вещи, обладавшей индивидуальными признаками, которую\nможно было опознать. Если пропажа обнаруживалась по истечении 3-х дней с\nмомента заклича, тот, у кого она находилась, считался ответчиком (ст.32\nи ст. 34 Пространной Правды).<\/p><\/li>\n<li><p><strong>«Свод»<\/strong> – своеобразная очная ставка (ст. 35-39\nПространной Правды). Осуществлялся он либо до заклича, либо в\nтрехдневный срок после заклича. Лицо, у которого обнаружили пропавшую\nвещь, должно было указать, у кого эта вещь была приобретена. Свод\nпродолжался до тех пор, пока не доходил до человека, не способного дать\nобъяснения, где он приобрел эту вещь. Таковой и признавался татем. Если\nсвод выходил за пределы населенного пункта, где пропала вещь, он\nпродолжался до третьего лица. На того возлагалась обязанность уплатить\nсобственнику стоимость вещи и право далее самому продолжать\nсвод.<\/p><\/li>\n<li><p><strong>«Гонение следа»<\/strong> – поиск доказательств и\nпреступника (ст. 77 Пространной Правды). Специальных розыскных органов и\nлиц не было, поэтому гонение следа осуществляли потерпевшие, их близкие,\nчлены общины и все добровольцы.<\/p><\/li>\n<\/ol>\n<p>Система доказательств по Русской Правде состояла из:\n<strong>собственного признания<\/strong> (ст. 19 Краткой Редакции),\n<strong>свидетельских показаний<\/strong> (<strong>«видоков»<\/strong>, то\nесть очевидцев преступления, и <strong>«послухов»<\/strong> – свидетелей\nдоброй славы, поручителей; ст. 36, 45 Пространной Редакции), были\nслучаи, когда свидетельских показаний было недостаточно, и должен был\nназначаться ордалий (статья 113); вещественных доказательств\n(<strong>«поличное»<\/strong>); <strong>«ордалий»<\/strong> (испытания\nводой, железом); <strong>присяги <\/strong>(<strong>«рота»<\/strong>):\nдополнительная-для истца, при наличии других доказательств и\nочистительная для ответчика, при отсутствии других доказательств (ст. 62\nПространной Редакции), присягали также послухи и мытники,\n<strong>свод<\/strong>-своеобразная очная ставка (ст. 44,47,48 Троицкого\nсписка)<\/p>\n", "t": " разделения процесса на гражданский или уголовный еще не было, любое дело именовалось тяжбой или «тяжей» . судебный процесс носил ярко выраженный состязательный характер , и в связи с этим обладал следующими признаками: начинался только по инициативе истца; 2)стороны, то есть истец и ответчик, обладали равными правами; судопроизводство было гласным и устным. значительную роль в системе доказательств играли «ордалии» («суд божий»), присяга и жребий. авторитет принадлежал сторонам, а не судьям. требуемые доказательства определяли не судьи, а стороны, называя испытание железом или жребий; постановления суд не выносил, инициатива исходила от сторон. суд не производил вызова свидетелей, их явка осуществлялась ими добровольно или по инициативе (вызову) сторон. процесс делился на три стадии: «заклич» – объявление о совершившемся преступлении. производился он в людном месте, «на торгу». объявлялось, например, о пропаже вещи, обладавшей индивидуальными признаками, которую можно было опознать. если пропажа обнаруживалась по истечении 3-х дней с момента заклича, тот, у кого она находилась, считался ответчиком (ст.32 и ст. 34 пространной правды). «свод» – своеобразная очная ставка (ст. 35-39 пространной правды). осуществлялся он либо до заклича, либо в трехдневный срок после заклича. лицо, у которого обнаружили пропавшую вещь, должно было указать, у кого эта вещь была приобретена. свод продолжался до тех пор, пока не доходил до человека, не способного дать объяснения, где он приобрел эту вещь. таковой и признавался татем. если свод выходил за пределы населенного пункта, где пропала вещь, он продолжался до третьего лица. на того возлагалась обязанность уплатить собственнику стоимость вещи и право далее самому продолжать свод. «гонение следа» – поиск доказательств и преступника (ст. 77 пространной правды). специальных розыскных органов и лиц не было, поэтому гонение следа осуществляли потерпевшие, их близкие, члены общины и все добровольцы. система доказательств по русской правде состояла из: собственного признания (ст. 19 краткой редакции), свидетельских показаний ( «видоков» , то есть очевидцев преступления, и «послухов» – свидетелей доброй славы, поручителей; ст. 36, 45 пространной редакции), были случаи, когда свидетельских показаний было недостаточно, и должен был назначаться ордалий (статья 113); вещественных доказательств ( «поличное» ); «ордалий» (испытания водой, железом); присяги ( «рота» ): дополнительная-для истца, при наличии других доказательств и очистительная для ответчика, при отсутствии других доказательств (ст. 62 пространной редакции), присягали также послухи и мытники, свод -своеобразная очная ставка (ст. 44,47,48 троицкого списка) "}, {"n": "Имущественные и наследственные отношения по Русской Правде.", "h": "<ul>\n<li>Имущественные отношения:<\/li>\n<\/ul>\n<p>Субъектами имущественных отношений являлись все свободные, включая\nиностранцев. <strong>Гражданская правоспособность<\/strong> - с момента\nрождения; <strong>гражданская дееспособность<\/strong> - с момента\nсовершеннолетия (вступление в брак). Вступление в монашество\n<strong>ограничивало дееспособность<\/strong> (монастыри юр. лица).\nОбъектами имущественных отношений являются вещи, недвижимое имущество.\nЗдесь представлено вещное право. Земля передавалась и охранялась по\nнаследству. Сделки заключались в устной форме: наличие свидетелей и\nсимволов; нет исковой давности.<\/p>\n<p>Ст. 37. Добросовестный владелец вещи может требовать у продавца\nкраденной вещи возмещения вреда, независимо от времени. Право владения\nпредшествует праву собственности. Защищается законное и незаконное\nвладение (ст. 14). Субъектами правоспособности на землю являются частные\nлица, феодалы, общины. <em>Способы Возникновения права собственности по\nрусской правде:<\/em><\/p>\n<p>1)договор; 2) по наследству; 3) давность владения; 4) приплод\n(рождение от скота или от рабыни).<\/p>\n<p><em>Прекращение права собственности по русской правде: <\/em><\/p>\n<p>1)в случае передачи вещи; 2) уничтожения; 3) потери; 4) судебного\nрешения.<\/p>\n<p>Обязательственные отношения могли возникать из причинения вреда или\nиз договоров. За невыполнение обязательств должник отвечал своим\nимуществом или своей свободой. Форма заключения договоров была устной,\nони заключались при свидетелях, на торгу или в присутствии мытника.\nДоговор купли-продажи заключался при свидетелях и при мытнике\n(представитель князя). В Уставе Владимира Мономаха говорится о\nсамопродаже свободного человека в холопы. <strong>Нагота<\/strong> -\nденежная единица, передавалась мытнику.<\/p>\n<p><strong>Договор комиссии<\/strong> сообщал о купце, который едет в\nдругие земли с товаром.<\/p>\n<p><strong>Договор займа<\/strong> - объекты: вещи, деньги (до 3х гривен\nбез свидетелей). <strong>Под проценты<\/strong> - наличие свидетелей, на\nкратковременный срок - взимание процентов каждый месяц - третные резы\n(50% суммы). Владимир Мономах в 1113 г. упорядочивает взимание\nпроцентов. Либо уплачивается 150%, либо двукратное уплачивание процентов\n+ сумма долга - «Устав о резах» - ст. 47 «если нечем платить, то должник\nпревращается в холопа». <strong>Несчастное банкротство<\/strong> - в\nслучае стихийного бедствия. Если по вине должника - кредиторы решали его\nсудьбу. В первую очередь - иноземные купцы; местный князь; местные\nкупцы. <strong>Закупничество<\/strong> - разновидность договора займа.\n<strong>Договор личного найма<\/strong> (ст. 110) порождал холопство,\nпоступление в тиуны.<\/p>\n<p><strong>Договор подряда<\/strong> - гос-во нанимает на работу\nмостников.<\/p>\n<p>Четкое фиксирование обязательств (ст.43 КП; ст. 96,97 ПП).<\/p>\n<p><strong>Договор хранения<\/strong> - дружеская услуга. Спор решался\nприсягой. Обязательства, вытекающие из правонарушений (в РП нет\nразграничения между уголовного и гражданского правонарушения, т.к. за\nоба следует штраф, возмещение ущерба). Публичные наказания (штраф в\nпользу князя). Штрафы различные: штраф князю и штраф частному лицу. Все\nустановленные преступления по РП заканчивались штрафом.<\/p>\n<ol type=\"1\">\n<li><p>При убийстве чиновника помимо штрафа (виры) взималось\n<strong>головничество<\/strong> (взыск в пользу семьи убитого);<\/p><\/li>\n<li><p>Защите подлежит честь и достоинство женщины (изнасилование,\nклевета). Сумма штрафа, чтобы обеспечить ее существование.<\/p><\/li>\n<li><p>Убийство чужого раба тоже имело последствия в виде штрафа его\nгосподину.<\/p><\/li>\n<\/ol>\n<ul>\n<li>Наследственные отношения:<\/li>\n<\/ul>\n<p>При наследовании по закону, т.е. без завещания, преимущества имели\nсыновья умершего, к ним же переходили и военные обязанности отца. При\nналичии сыновей дочери не получали ничего (на наследников возлагалась\nлишь обязанность выдать сестер замуж). Наследственная масса делилась,\nочевидно, поровну, но младший сын имел преимущество — он получал двор\nотца. Незаконные дети наследственных прав не имели, но если их матерью\nбыла раба-наложница, то они вместе с ней получали свободу. Право отца\nраспоряжаться имуществом при составлении завещания не ограничивалось.\nИсключение из этого правила состояло в том, что он не мог завещать\nимущество дочерям.<\/p>\n", "t": " имущественные отношения: субъектами имущественных отношений являлись все свободные, включая иностранцев. гражданская правоспособность - с момента рождения; гражданская дееспособность - с момента совершеннолетия (вступление в брак). вступление в монашество ограничивало дееспособность (монастыри юр. лица). объектами имущественных отношений являются вещи, недвижимое имущество. здесь представлено вещное право. земля передавалась и охранялась по наследству. сделки заключались в устной форме: наличие свидетелей и символов; нет исковой давности. ст. 37. добросовестный владелец вещи может требовать у продавца краденной вещи возмещения вреда, независимо от времени. право владения предшествует праву собственности. защищается законное и незаконное владение (ст. 14). субъектами правоспособности на землю являются частные лица, феодалы, общины. способы возникновения права собственности по русской правде: 1)договор; 2) по наследству; 3) давность владения; 4) приплод (рождение от скота или от рабыни). прекращение права собственности по русской правде: 1)в случае передачи вещи; 2) уничтожения; 3) потери; 4) судебного решения. обязательственные отношения могли возникать из причинения вреда или из договоров. за невыполнение обязательств должник отвечал своим имуществом или своей свободой. форма заключения договоров была устной, они заключались при свидетелях, на торгу или в присутствии мытника. договор купли-продажи заключался при свидетелях и при мытнике (представитель князя). в уставе владимира мономаха говорится о самопродаже свободного человека в холопы. нагота - денежная единица, передавалась мытнику. договор комиссии сообщал о купце, который едет в д учали свободу. право отца распоряжаться имуществом при составлении завещания не ограничивалось. исключение из этого правила состояло в том, что он не мог завещать имущество дочерям. "}, {"n": "Сравнительный анализ государственного строя Новгорода, Пскова и других русских земель периода политической раздробленности.", "h": "<p>Новгородская и Псковская земли были расположены на северо-западе\nРуси. До XII в. Новгородская земля входила в состав Киевской Руси. В\nначале XII в., предположительно в 1136г., бояре Новгорода,\nвоспользовавшись восстанием городских низов и крестьянства против князя,\nзахватили власть и установили свое политическое господство. В Новгороде\nсложился республиканский (феодальный) строй.<\/p>\n<p>Псковская земля была частью Новгородской республики до середины XIV\nв. В 1348 г. Псков, выросший в крупный торговый и ремесленный центр,\nотделился от Новгорода и также стал феодальной республикой.<\/p>\n<p>В Новгороде и Пскове сложилась необычная для средне вековой Руси\nформа государственного правления — <strong>феодальная\nреспублика<\/strong>.<\/p>\n<p>Государственное управление Новгородом и Псковом осуществлялось\n<strong>вечем<\/strong> — собранием полноправных жителей мужского пола.\nФормально вече было высшим органом власти, решавшим все важнейшие\nэкономические, политические, военные, судебные и административные\nвопросы В полномочия веча входило избрание князя. Решения на ее\nсобраниях должны были приниматься единогласно. Имелась вечевая\nадминистрация — вечевые дьяки, вечевая изба.<\/p>\n<p>Реальная власть в Новгороде и Пскове принадлежала <strong>боярскому\nсовету<\/strong>, включавшему знатных бояр и представителей городской\nадминистрации. Председательствовал в совете\n<strong>архиепископ<\/strong>. Боярский совет являлся организационным и\nподготовительным органом. <em>К его компетенции относились:<\/em>\nподготовка законопроектов, вечевых решений, контрольная деятельность,\nсозыв вече, подготовка повестки дня, подбор натур избираемых на вече\nдолжностных лиц и др. Вооруженные силы включали княжескую дружину,\nвладыческий полк и городское ополчение.<\/p>\n<p><em>Высшими должностными лицами Великого Новгорода были:<\/em>\nтысяцкий, архиепископ и князь. <strong>Посадник<\/strong> избирался вечем\nна один-два года из знатных бояр. Он председательствовал на вече,\nруководил боярским советом, ведал администрацией, внешнеполитическими\nделами; вместе с князем осуществлял вопросы управления, суда и\nкомандования вооруженными силами. <strong>Тысяцкий<\/strong> избирался на\nвече из знатных представителей аристократии. Он занимался вопросами\nторговли и торгового суда, возглавлял народное ополчение и решал другие\nвопросы управления, помогая посаднику.<\/p>\n<p><strong>Архиепископ<\/strong> избирался из монахов, выходцев из\nбоярской. Он был хранителем государственной казны, контролером торговых\nмер и весов. Основная же роль архиепископа сводилась к главенству в\nцерковной иерархии. Князь приглашался на княжение гражданами.\nПредварительно его кандидатура обсуждалась на боярском совете и затем\nвносилась на утверждение в вече. Главной целью князя была организация\nзащиты республики от внешних врагов. Во единую судебную и\nадминистративную деятельность князь осуществлял вместе с посадником.<\/p>\n<p><strong>Ростово-Суздалъское княжество<\/strong> вышло из состава\nКиевского государства в 30-е гг. XII в. Во второй половине XII в.\nстолицей княжества стал Владимир, куда впоследствии переместилась и\nрезиденция великого князя. Власть Владимирского князя распространялась\nна большую часть территории Северо-Восточной Руси. Характерными\nособенностями этого княжества являлись сильная власть князя и большое\nколичество объединенных княжеством городов.<\/p>\n<p>Переезд во <strong>Владимиро-Суздальское княжество<\/strong> из Киева\nвеликокняжеского престола, а также киевского митрополита Максима\nспособствовал, созданию крупного и сильного государства в\nСеверо-Восточной Руси. Владимиро-Суздальское княжество представляло\nсобой сильное политическое образование, которое могло претендовать не\nтолько на самостоятельность, но и на центральное положение во всей Руси.\nВладимиро-Суздальское княжество поддерживало и международные отношения\nсо странами как Запада, так и Востока. Во взаимоотношениях с русскими\nкняжествами следует отметить тесные экономические и политические связи с\nНовгородом. Наибольшего расцвета Ростово-Суздальское\n(Владимиро-Суздальское) княжество достигло в XII — первой половине XIII\nв.<\/p>\n<p>Господствующим классом являлся класс <strong>феодалов<\/strong>, в\nкоторый включались бояре, дети боярские и слуги вольные. Большую роль\nиграло духовенство, имевшее крупные земельные владения. В документах XII\nв. упоминаются и дворяне, которыми назывались княжеские слуги,\nполучавшие за свою службу вознаграждение в виде денежного или земельного\nпожалования. Так как на территории Владимиро-Суздальского княжества\nнаходилось много крупных городов, городское население имело значительное\nполитическое влияние.<\/p>\n<p>Феодально-зависимое население состояло из крестьян, живших на землях,\nпринадлежавших князьям, боярам и другими феодалам.<\/p>\n<p>Возглавлял Владимиро-Суздальское княжество великий\n<strong>князь<\/strong>, обладавший большим политическим влиянием. В\nсвоей деятельности он опирался на совет, состоявший из бояр и\nдуховенства, княжескую дружину и феодальные съезды. Для решения важных\nвопросов могло созываться народное собрание — <strong>вече<\/strong>.<\/p>\n<p>Во Владимиро-Суздальском княжестве существовала\n<strong>дворцово-вотчинная система управления<\/strong>. <em>Она\nхарактеризуется следующими чертами:<\/em> во главе системы стоял\nдворецкий; на местах представителями княжеской власти были посадники\n(<strong>наместники<\/strong>) и волостели, осуществлявшие функции\nуправления и суда; вместо жалованья за службу они получали\n<strong>«корм»<\/strong> — часть собранного с населения.<\/p>\n<p><strong>Галицко-Волынская Русь<\/strong> - важный политический центр\nзападных русских земель, объединивший земли таких племен, как дулены,\nтиверцы, хорваты, бужане, и вошедший в состав Киевской Руси в конце Х в.\nРасцвет его приходится на вторую половину ХП в. Особенностью Галиции\nбыло раннее и интенсивное развитие феодальных отношений, приведшее к\nсозданию сильной боярской верхушки, сумевшей захватить основные земли и\nкрестьян. Большого княжеского домена там не образовалось. Бояре имели,\nкроме земель, свои торгово-ремесленные центры, замки.<\/p>\n<p>Иное положение занимал <strong>Волынский князь<\/strong> - обладатель\nкрупного домена, сплотивший вокруг себя бояр земельными пожалованиями. В\n1199 г., опираясь главным образом на феодалов Волыни, княжеская власть\nсумела объединить оба княжества. Центром его бы Галич, затем - Холм, а в\nконце ХШ в. - Львов. Но это политическое единство не было ни долгим, ни\nдостаточно прочным. Боярство, имевшее большие политические права,\nпротивопоставляло княжеской власти свои интересы, а зачастую вело\nоткрытую борьбу против князя, опираясь на соседние государства -\nВенгрию, Польшу. В 1214 г. венгерский король и польский князь заключили\nдоговор о разделе Галицко-Волынской Руси. В ХШ в. Западная Русь попала\nпод власть монголо-татарских завоевателей. Позднее ее земли оказались\nподеленными между Венгрией, Польшей и Литвой.<\/p>\n<p>Общественный строй Галицко-Волынской Руси характерен сильным влиянием\nкрупных феодалов - <strong>бояр<\/strong> (\"мужи галицкие\"), местных\nземлевладельцев, выросших в недрах разлагавшихся общин. Они были мало\nсвязаны с князьями, что и обусловило слабость княжеской власти на\nГалицкой земле.<\/p>\n<p>Другую группу феодалов составляли <strong>служилые феодалы<\/strong>,\nчаще всего получавшие земли за службу и на время службы- Земельные\nвладения имели церковная знать, монастыри. Крестьяне, жившие на землях\nсветских в духовных феодалов, находились в различных формах\nзависимости.<\/p>\n<p>Для Галицко-Волынского княжества характерно сохранение системы\n<strong>дворцововотчинной организации управления и системы\nкормления<\/strong>. В города князья посылали\n<strong>посадников<\/strong>, на места - <strong>воевод<\/strong> и\n<strong>волостелей<\/strong>, выполнявших административные и судебные\nфункции.<\/p>\n", "t": " новгородская и псковская земли были расположены на северо-западе руси. до xii в. новгородская земля входила в состав киевской руси. в начале xii в., предположительно в 1136г., бояре новгорода, воспользовавшись восстанием городских низов и крестьянства против князя, захватили власть и установили свое политическое господство. в новгороде сложился республиканский (феодальный) строй. псковская земля была частью новгородской республики до середины xiv в. в 1348 г. псков, выросший в крупный торговый и ремесленный центр, отделился от новгорода и также стал феодальной республикой. в новгороде и пскове сложилась необычная для средне вековой руси форма государственного правления — феодальная республика . государственное управление новгородом и псковом осуществлялось вечем — собранием полноправных жителей мужского пола. формально вече было высшим органом власти, решавшим все важнейшие экономические, политические, военные, судебные и административные вопросы в полномочия веча входило избрание князя. решения на ее собраниях должны были приниматься единогласно. имелась вечевая администрация — вечевые дьяки, вечевая изба. реальная власть в новгороде и пскове принадлежала боярскому совету , включавшему знатных бояр и представителей городской администрации. председательствовал в совете архиепископ . боярский совет являлся организационным и подготовительным органом. к его компетенции относились: подготовка законопроектов, вечевых решений, контрольная деятельность, созыв вече, подготовка повестки дня, подбор натур избираемых на вече должностных лиц и др. вооруженные силы включали княжескую дружину, владыческий полк и городское ополчение. высшими должностными лицами великого новгорода были: тысяцкий, архиепископ и князь. посадник избирался вечем на один-два года из знатных бояр. он председательствовал на вече, руководил боярским советом, ведал администрацией, внешнеполитическими делами; вместе с князем осуществлял вопросы управления, суда и командования вооруженными силами. тысяцкий избирался на вече из знатных представителей аристократии. он занимался вопросами торговли и торгового суда, возглавлял народное ополчение и решал другие вопросы управления, помогая посаднику. архиепископ избирался из монахов, выходцев из боярской. он был хранителем государственной казны, контролером торговых мер и весов. основная же роль архиепископа сводилась к главенству в церковной иерархии. князь приглашался на княжение гражданами. предварительно его кандидатура обсуждалась на боярском совете и затем вносилась на утверждение в вече. главной целью князя была организация защиты республики от внешних врагов. во единую судебную и административную деятельность князь осуществлял вместе с посадником. ростово-суздалъское княжество вышло из состава киевского государства в 30-е гг. xii в. во второй половине xii в. столицей княжества стал владимир, куда впоследствии переместилась и резиденция великого князя. власть владимирского князя распространялась на большую часть территории северо-восточной руси. характерными особенностями этого княжества являлись сильная власть князя и большое количество объединенных княжеством городов. переезд во владимиро-суздальское княжество из киева великокняжеского престола, а также киевского митрополита максима способствовал, созданию крупного и сильного государства в северо-восточной руси. владимиро-суздальское княжество представляло собой сильное политическое образование, которое могло претендовать не только на самостоятельность, но и на центральное положение во всей руси. владимиро-суздальское княжество поддерживало и международные отношения со странами как запада, так и востока. во взаимоотношениях с русскими княжествами следует отметить тесные экономические и политичес 7\nг.) - автор их точно не известен (грамота Александра была дополнена\nархиепископом Дионисием (1382 г.));<\/li>\n<\/ol>\n<p>3)** псковские пошлины, обычаи, постановления Псковского вече**,\nкоторые обязательно принимались в виде письменного документа (правом\nпредложения принять постановление в Пскове обладал посадник; законы\nпринимались и отменялись на вече вместе с князем).<\/p>\n<ul>\n<li>Правовые институты ПСГ:<\/li>\n<\/ul>\n<p>1)<strong>Вещное право.<\/strong><\/p>\n<p><em>Псковская Судная Грамота выделяла право собственности:<\/em><\/p>\n<ul>\n<li><p>на недвижимость: земли, лес, двор, рыболовный участок;<\/p><\/li>\n<li><p>на движимое имущество.<\/p><\/li>\n<\/ul>\n<p>Способами приобретения права собственности являлись: купля-продажа;\nнаследование; получение приплода (от скота); истечение срока давности\nвладения и т. д.<\/p>\n<p>«Кормля» является одним из видов вещного права.\n<strong>Кормля<\/strong> - это временное пользование чужой\nсобственностью. Кормля устанавливалась в качестве права пользования\nимуществом умершего супруга для пережившего супруга на срок его жизни\nили до заключения нового брака.<\/p>\n<p><em>Псковская Судная Грамота выделяла среди вещных прав - залог,\nкоторый в свою очередь подразделялся на:<\/em><\/p>\n<p>1)залог движимого имущества (в этом случае заложенная вещь хранилась\nу заимодавца до уплаты долга); 2) залог недвижимости (сама заложенная\nнедвижимость не переходила во владение залогодержателя, но документы на\nэту собственность должны были быть переданы заимодавцу).<\/p>\n<ol start=\"2\" type=\"1\">\n<li><strong>Обязательственное право.<\/strong><\/li>\n<\/ol>\n<p><em>Способы заключения договоров:<\/em><\/p>\n<ol type=\"1\">\n<li>заключение договора в устном порядке (устный договор заключался при\nсвидетелях, которые могли подтвердить условия договора в случае спора);\n2) «запись» (посредством составления письменного документа, который\nдолжен быть передан на хранение в Троицкий собор в Пскове либо иной\nсобор города); 3) «доска» (т. е. путем составления простого письменного\nдокумента без особых требований, такой документ хранился у составителя\nбез передачи в архив собора). Наиболее важные сделки заключались путем\nсоставления <strong>«записи»<\/strong>, так как она имела наибольшую\nдоказательственную силу.<\/li>\n<\/ol>\n<p><em>Псковская Судная Грамота выделяет договоры:<\/em><\/p>\n<ol type=\"1\">\n<li><p>купли-продажи (договоры купли-продажи недвижимости оформлялись\nтолько письменно либо при свидетелях, при этом сделка, совершенная в\nпьяном виде, могла быть опротестована и признана недействительной); 2)\nмены; 3) дарения; 4) займа (договор займа должен был быть заключен в\nписьменном виде на <strong>«доске»<\/strong> (доска без имени не\nпринималась) или <strong>«записью»<\/strong>, если сумма долга превышала\n1 рубль; возвращение долга оформлялось распиской, копия которой\nсдавалась в государственный архив); 5) ссуды; 6) поклажи (договор\nпоклажи, хранения имущества составлялся в форме «записи»;\nустанавливалась ограниченная ответственность хранителя за потерю товара\nв результате пожара, грабежа, восстания, в пути или в чужой земле); 7)\nнайма имущественного и личного (<strong>договор личного найма<\/strong> -\nэто обязательство наемного работника выполнять работу для хозяина в\nтечение определенного срока за указанную в договоре плату; работник мог\nпрекратить работу до истечения срока и обратиться в суд с иском о\nвзыскании заработной платы в случае отказа в оплате).<\/p><\/li>\n<li><p><strong>Наследственное право.<\/strong><\/p><\/li>\n<\/ol>\n<p>По Псковской Судной Грамоте выделялось: наследование по закону;\nнаследование по завещанию. По закону могли наследовать пережившие дети,\nродители, братья и сестры, т. е. ближайшие родственники (супруг не\nявлялся наследователем, он получал корм). Допускалось лишение наследства\nза виновное поведение наследника, например, сына, который отказывался\nсодержать родителей или уходил из дома.<\/p>\n<p>Личные вещи умершего должны были быть переданы его родственникам.\nЧеловек не мог завещать имущество чужому человеку (только через\nдарение).<\/p>\n<p>Форма завещания - письменная, с составлением «записи» и передачей его\nна хранение в архив.<\/p>\n<p>4)<strong>Уголовное право.<\/strong><\/p>\n<p>Уголовное право по Псковской Судной Грамоте впервые рассматривало\nпреступление как уголовно наказуемое деяние, совершенное не только в\nотношении частного лица, но и государства. Термин, обозначающий понятие\n«преступление» отсутствовал.<\/p>\n<p><strong>Субъектами преступления<\/strong> по Судной Грамоте могли быть\nвсе, кроме холопов. Ответственность за совершение преступления\nсоучастниками устанавливалась для всех соучастников одинаковая. Не были\nзакреплены формы вины, смягчающие и отягчающие вину обстоятельства,\nпокушение.<\/p>\n<p>Штрафы по Псковской Судной Грамоте назначались за: воровство; разбой;\nдраку; убийство; грабеж.<\/p>\n<p><em>Система штрафов:<\/em> продажа (этот штраф поступал в казну\nкнязя); возмещение ущерба потерпевшему или его родственникам (в случае\nубийства); судебные пошлины в пользу владык, посадников, тысяцкого и\nиного судьи. Штрафы были достаточно большими, разоряли бедноту и\nгородские низы, тем самым вынуждая их обращаться к ростовщикам, боярам,\nкупцам и в последующем попадать к ним в кабалу.<\/p>\n<p>ПСГ упоминает только о денежных наказаниях, т. е. уголовное право\nэтого периода имеет компенсационный, а не карательный характер, но в\nдругих источниках права имеются сведения о смертной казни.<\/p>\n<p>В самой Судной Грамоте впервые упоминаются <em>государственные\nпреступления и преступления против государственной власти<\/em>\n<strong>перевет<\/strong>- государственная измена; <strong>кромская\nтатьба<\/strong>- кража из кремля, т. е. кража государственного\nимущества. Наказание-смертная казнь.<\/p>\n<p>Телесные виды наказаний Псковская Судная Грамота не предусматривала,\nно на практике они широко применялись.<\/p>\n<p><em>Преступления против личности:<\/em> убийство (среди них выделялись\nотцеубийство и братоубийство); нанесение побоев; оскорбление действием\n(например, вырывание бороды, толкание и т. п.).<\/p>\n<p><em>Виды имуще<strong>ственных преступлений<\/strong>:<\/em> татьба\n(воровство) - простая и квалифицированная: конокрадство или кража,\nсовершенная в третий раз; разбой; грабеж; поджог; наход (разбой в\nсоставе шайки).<\/p>\n<p>5)<strong>Суд<\/strong><\/p>\n<p>Судебный процесс по Псковской Судной Грамоте носил\n<strong>обвинительно-состязательный характер<\/strong>, для уголовного\nразбирательства - обвинительный.<\/p>\n<p>Дело возбуждалось по исковому заявлению. Далее суд проводил\nрасследование <strong>(«обыск»)<\/strong>. Устанавливались\nоперативно-розыскные меры, например, обыск в современном понятии или\nвыемка, т. е. изъятие вещей, которые сдавались на хранение в суд до\nразрешения дела. Эти действия исполнялись судебными приставами. Они же\nвызывали на суд ответчика и осуществляли привод в случае сопротивления.\nОтветчику давалось 5 дней на явку в суд. Свидетелей мог вызывать и истец\n(мог вызывать послуха), и ответчик.<\/p>\n<p>По Псковской Судной Грамоте стороны являлись в суд одни, без\n«пособников». <em>Доказате<strong>льства по ПСГ<\/strong>:<\/em> показания\nсвидетелей, старожилов, соседей; грамоты; межевые знаки; крестное\nцелование; судебный поединок.<\/p>\n<p>Было понятие судебного представительства, но только для защиты\nинтересов женщин, монахов, увечных, стариков и малолетних. Псковская\nСудная Грамота устанавливала формальное судопроизводство. Судебные\nдокументы: <strong>«правая» грамота <\/strong>(она выдавалась стороне,\nвыигравшей судебный спор)<strong>; судная<\/strong>\n<strong>грамота<\/strong> (решение суда).<\/p>\n", "t": " источники псковской судной грамоты названы в ее преамбуле: 1)** княжеские уставы** (эти уставы охватывают значительную массу правоотношений, которые в последующем систематизировала грамота); грамоты александра невского (около 1242 г.) или александра тверского (1327-1337 г.) - автор их точно не известен (грамота александра была дополнена архиепископом дионисием (1382 г.)); 3)** псковские пошлины, обычаи, постановления псковского вече**, которые обязательно принимались в виде письменного документа (правом предложения принять постановление в пскове обладал посадник; законы принимались и отменялись на вече вместе с князем). правовые институты псг: 1) вещное право. псковская судная грамота выделяла право собственности: на недвижимость: земли, лес, двор, рыболовный участок; на движимое имущество. способами приобретения права собственности являлись: купля-продажа; наследование; получение приплода (от скота); истечение срока давности владения и т. д. «кормля» является одним из видов вещного права. кормля - это временное пользование чужой собственностью. кормля устанавливалась в качестве права пользования имуществом умершего супруга для пережившего супруга на срок его жизни или до заключения нового брака. псковская судная грамота выделяла среди вещных прав - залог, который в свою очередь подразделялся на: 1)залог движимого имущества (в этом случае заложенная вещь хранилась у заимодавца до уплаты долга); 2) залог недвижимости (сама заложенная недвижимость не переходила во владение залогодержателя, но документы на эту собственность должны были быть переданы заимодавцу). обязательственное право. способы заключения договоров: заключение договора в устном порядке (устный договор заключался при свидетелях, которые могли подтвердить условия договора в случае спора); 2) «запись» (посредством составления письменного документа, который должен быть передан на хранение в троицкий собор в пскове либо иной собор города); 3) «доска» (т. е. путем составления простого письменного документа без особых требований, такой документ хранился у составителя без передачи в архив собора). наиболее важные сделки заключались путем составления «записи» , так как она имела наибольшую доказательственную силу. псковская судная грамота выделяет договоры: купли-продажи (договоры купли-продажи недвижимости оформлялись только письменно либо при свидетелях, при этом сделка, совершенная в пьяном виде, могла быть опротестована и признана недействительной); 2) мены; 3) дарения; 4) займа (договор займа должен был быть заключен в письменном виде на «доске» (доска без имени не принималась) или «записью» , если сумма долга превышала 1 рубль; возвращение долга оформлялось распиской, копия которой сдавалась в государственный архив); 5) ссуды; 6) поклажи (договор поклажи, хранения имущества составлялся в форме «записи»; устанавливалась ограниченная ответственность хранителя за потерю товара в результате пожара, грабежа, восстания, в пути или в чужой земле); 7) найма имущественного и личного ( договор личного найма - это обязательство наемного работника выполнять работу для хозяина в течение определенного срока за указанную в договоре плату; работник мог прекратить работу до истечения срока и обратиться в суд с иском о взыскании заработной платы в случае отказа в оплате). наследственное право. по псковской судной грамоте выделялось: наследование по закону; наследование по завещанию. по закону могли наследовать пережившие дети, родители, братья и сестры, т. е. ближайшие родственники (супруг не являлся наследователем, он получал корм). допускалось лишение наследства за виновное поведение наследника, например, сына, который отказывался содержать родителей или уходил из дома. личные вещи умершего должны были быть переданы его родственникам. человек не мог завещать имущество чужому человеку (только через дарение). форма завещания - письменная, с составлением «записи» и передачей его на хранение в архив. 4) уголовное право. уголовное право по псковской судной грамоте впервые рассматривало преступление как уголовно наказуемое деяние, совершенное не только в отношении частного лица, но и государства. термин, обозначающий понятие «преступление» отсутствовал. субъектами преступления по судной грамоте могли быть все, кроме холопов. ответственность за совершение преступления соучастниками устанавливалась для всех соучастников одинаковая. не были закреплены формы вины, смягчающие и отягчающие вину обстоятельства, покушение. штрафы по псковской судной грамоте назначались за: воровство; разбой; драку; убийство; грабеж. система штрафов: продажа (этот штраф поступал в казну князя); возмещение ущерба потерпевшему или его родственникам (в случае убийства); судебные пошлины в пользу владык, посадников, тысяцкого и иного судьи. штрафы были достаточно большими, разоряли бедноту и городские низы, тем самым вынуждая их обращаться к ростовщикам, боярам, купцам и в последующем попадать к ним в кабалу. псг упоминает только о денежных наказаниях, т. е. уголовное право этого периода имеет компенсационный, а не карательный характер, но в других источниках права имеются сведения о смертной казни. в самой судной грамоте впервые упоминаются государственные преступления и преступления против государственной власти перевет - государственная измена; кромская татьба - кража из кремля, т. е. кража государственного имущества. наказание-смертная казнь. телесные виды наказаний псковская судная грамота не предусматривала, но на практике они широко применялись. преступления против личности: убийство (среди них выделялись отцеубийство и братоубийство); нанесение побоев; оскорбление действием (например, вырывание бороды, толкание и т. п.). виды имуще ственных преступлений : татьба (воровство) - простая и квалифицированная: конокрадство или кража, совершенная в третий раз; разбой; грабеж; поджог; наход (разбой в составе шайки). 5) суд судебный процесс по псковской судной грамоте носил обвинительно-состязательный характер , для уголовного разбирательства - обвинительный. дело возбуждалось по исковому заявлению. далее суд проводил расследование («обыск») . устанавливались оперативно-розыскные меры, например, обыск в современном понятии или выемка, т. е. изъятие вещей, которые сдавались на хранение в суд до разрешения дела. эти действия исполнялись судебными приставами. они же вызывали на суд ответчика и осуществляли привод в случае сопротивления. ответчику давалось 5 дней на явку в суд. свидетелей мог вызывать и истец (мог вызывать послуха), и ответчик. по псковской судной грамоте стороны являлись в суд одни, без «пособников». доказате льства по псг : показания свидетелей, старожилов, соседей; грамоты; межевые знаки; крестное целование; судебный поединок. было понятие судебного представительства, но только для защиты интересов женщин, монахов, увечных, стариков и малолетних. псковская судная грамота устанавливала формальное судопроизводство. судебные документы: «правая» грамота (она выдавалась стороне, выигравшей судебный спор) ; судная грамота (решение суда). "}, {"n": "Вещное и обязательственное право в Псковской судной грамоте.", "h": "<ul>\n<li>Вещное право:<\/li>\n<\/ul>\n<p>Возникает деление объектов вещных прав на <strong>движимое<\/strong>\n(<strong>живот<\/strong>) и <strong>недвижимое<\/strong>\n(<strong>отчина<\/strong>) имущество, право условного владения и\nпользования имуществом (<strong>кормля<\/strong>), регулируются\nотношения, связанные с залогом (ст. 28). Давность владения со времени\nПСГ становится законным способом приобретения вещных прав (ст. 9).<\/p>\n<p><strong>Субъектами вещных прав<\/strong> могли быть государство,\nцерковь, князь, бояре и своеземцы, другие частные лица, а также\nколлективные субъекты в лице семьи, рода, общины.<\/p>\n<p><em>К видам вещных прав ПСГ относила владение и право собственности.\nПсковская Судная Грамота выделяла право собственности: <\/em><\/p>\n<ol type=\"1\">\n<li><p>на недвижимость: земли, лес, двор, рыболовный участок;<\/p><\/li>\n<li><p>на движимое имущество.<\/p><\/li>\n<\/ol>\n<p><em>Способами приобретения права собственности являлись: <\/em><\/p>\n<ol type=\"1\">\n<li><p>купля-продажа;<\/p><\/li>\n<li><p>наследование;<\/p><\/li>\n<li><p>получение приплода (от скота);<\/p><\/li>\n<li><p>истечение срока давности владения и т. д.<\/p><\/li>\n<\/ol>\n<p>«<strong>Кормля<\/strong>» является одним из видов вещного права.\nКормля – это временное пользование чужой собственностью. Кормля\nустанавливалась в качестве права пользования имуществом умершего супруга\nдля пережившего супруга на срок его жизни или до заключения нового\nбрака.<\/p>\n<p><em>Псковская Судная Грамота выделяла среди вещных прав – залог,\nкоторый в свою очередь подразделялся на: <\/em><\/p>\n<ol type=\"1\">\n<li><p>залог движимого имущества (в этом случае заложенная вещь\nхранилась у заимодавца до уплаты долга);<\/p><\/li>\n<li><p>залог недвижимости (сама заложенная недвижимость не переходила во\nвладение залогодержателя, но документы на эту собственность должны были\nбыть переданы заимодавцу).<\/p><\/li>\n<\/ol>\n<ul>\n<li>Обязательственное право:<\/li>\n<\/ul>\n<p>Обязательственное право по Псковской судной грамоте приравнивалось к\nдоговорному.<\/p>\n<p><em>Способы заключения договоров: <\/em><\/p>\n<ol type=\"1\">\n<li><p><strong>заключение договора в устном порядке<\/strong> (устный\nдоговор заключался при свидетелях, которые могли подтвердить условия\nдоговора в случае спора);<\/p><\/li>\n<li><p><strong>«запись»<\/strong> (посредством составления письменного\nдокумента, который должен быть передан на хранение в Троицкий собор в\nПскове либо иной собор города);<\/p><\/li>\n<li><p><strong>«доска»<\/strong> (т. е. путем составления простого\nписьменного документа без особых требований, такой документ хранился у\nсоставителя без передачи в архив собора). Без имени доска не\nпринималась.<\/p><\/li>\n<\/ol>\n<p>Наиболее важные сделки заключались путем составления «записи», так\nкак она имела наибольшую доказательственную силу.<\/p>\n<p><em>Псковская Судная Грамота выделяет договоры: <\/em><\/p>\n<ol type=\"1\">\n<li><p><strong>купли-продажи<\/strong> (договоры купли-продажи\nнедвижимости оформлялись только письменно либо при свидетелях, при этом\nсделка, совершенная в пьяном виде, могла быть опротестована и признана\nнедействительной);<\/p><\/li>\n<li><p><strong>мены<\/strong>;<\/p><\/li>\n<li><p><strong>дарения<\/strong>;<\/p><\/li>\n<li><p><strong>займа<\/strong> (договор займа должен был быть заключен в\nписьменном виде на «доске» или <strong>«записью»,<\/strong> если сумма\nдолга превышала 1 рубль; возвращение долга оформлялось распиской, копия\nкоторой сдавалась в государственный архив);<\/p><\/li>\n<li><p><strong>ссуды<\/strong>;<\/p><\/li>\n<li><p><strong>поклажи<\/strong> (договор поклажи, хранения имущества\nсоставлялся в форме «записи»; устанавливалась ограниченная\nответственность хранителя за потерю товара в результате пожара, грабежа,\nвосстания, в пути или в чужой земле);<\/p><\/li>\n<li><p><strong>найма имущественного и личного<\/strong> (<strong>договор\nличного найма<\/strong> – это обязательство наемного работника выполнять\nработу для хозяина в течение определенного срока за указанную в договоре\nплату; работник мог прекратить работу до истечения срока и обратиться в\nсуд с иском о взыскании заработной платы в случае отказа в\nоплате).<\/p><\/li>\n<\/ol>\n", "t": " вещное право: возникает деление объектов вещных прав на движимое ( живот ) и недвижимое ( отчина ) имущество, право условного владения и пользования имуществом ( кормля ), регулируются отношения, связанные с залогом (ст. 28). давность владения со времени псг становится законным способом приобретения вещных прав (ст. 9). субъектами вещных прав могли быть государство, церковь, князь, бояре и своеземцы, другие частные лица, а также коллективные субъекты в лице семьи, рода, общины. к видам вещных прав псг относила владение и право собственности. псковская судная грамота выделяла право собственности: на недвижимость: земли, лес, двор, рыболовный участок; на движимое имущество. способами приобретения права собственности являлись: купля-продажа; наследование; получение приплода (от скота); истечение срока давности владения и т. д. « кормля » является одним из видов вещного права. кормля – это временное пользование чужой собственностью. кормля устанавливалась в качестве права пользования имуществом умершего супруга для пережившего супруга на срок его жизни или до заключения нового брака. псковская судная грамота выделяла среди вещных прав – залог, который в свою очередь подразделялся на: залог движимого имущества (в этом случае заложенная вещь хранилась у заимодавца до уплаты долга); залог недвижимости (сама заложенная недвижимость не переходила во владение залогодержателя, но документы на эту собственность должны были быть переданы заимодавцу). обязательственное право: обязательственное право по псковской судной грамоте приравнивалось к договорному. способы заключения договоров: заключение договора в устном порядке (устный договор заключался при свидетелях, которые могли подтвердить условия договора в случае спора); «запись» (посредством составления письменного документа, который должен быть передан на хранение в троицкий собор в пскове либо иной собор города); «доска» (т. е. путем составления простого письменного документа без особых требований, такой документ хранился у составителя без передачи в архив собора). без имени доска не принималась. наиболее важные сделки заключались путем составления «записи», так как она имела наибольшую доказательственную силу. псковская судная грамота выделяет договоры: купли-продажи (договоры купли-продажи недвижимости оформлялись только письменно либо при свидетелях, при этом сделка, совершенная в пьяном виде, могла быть опротестована и признана недействительной); мены ; дарения ; займа (договор займа должен был быть заключен в письменном виде на «доске» или «записью», если сумма долга превышала 1 рубль; возвращение долга оформлялось распиской, копия которой сдавалась в государственный архив); ссуды ; поклажи (договор поклажи, хранения имущества составлялся в форме «записи»; устанавливалась ограниченная ответственность хранителя за потерю товара в результате пожара, грабежа, восстания, в пути или в чужой земле); найма имущественного и личного ( договор личного найма – это обязательство наемного работника выполнять работу для хозяина в течение определенного срока за указанную в договоре плату; работник мог прекратить работу до истечения срока и обратиться в суд с иском о взыскании заработной платы в случае отказа в оплате). "}, {"n": "Судебный процесс в Псковской республике.", "h": "<p>В Пскове продолжал существовать <strong>состязательный\nпроцесс<\/strong>, стороны назывались <strong>сутяжниками<\/strong>,\nиногда истцами. Не было разделений процесса на гражданский и уголовный.\nПроцесс был <strong>устным<\/strong>, но решение выносилось в письменном\nвиде, при выдаче его взимались судебные пошлины. Решение по делу\nисполняли специальные служащие князя или города. Вместе с тем\nразвивается и следственная, розыскная форма процесса. Существовал\nинститут досудебной подготовки дела - <strong>свод<\/strong>.<\/p>\n<p>На процессе допускалось представительство сторон. Женщины, дети,\nстарики, монахи, монахини и глухие могли иметь пособников, которые\nдолжны были представлять в суде их интересы. Должностным лицам\nзапрещалось выступать в качестве представителя стороны в процессе, чтобы\nне оказывать давления на суд. В случае спора о церковной земле интересы\nцеркви представлял староста, то есть выборный представитель верующих\nприхода этой церкви.<\/p>\n<p><em>Процессуальные действия:<\/em><\/p>\n<p>Процесс начинался подачи искового заявления, жалобы. Половник и его\nгосподин начинали разрешение своих споров с заклича, публичного\nоповещения на торгу о своих претензиях. Это объявление должно было\nпривлечь к делу в качестве свидетеля членов общины.<\/p>\n<p>Далее, в случае совершения кражи, происходим обыск - подозреваемый\nдолжен был допустить в свой двор приставов для обыска, если не опускал -\nон обвинялся в краже. Приставам достаточно было 2-3 свидетелей для\nдоказательства того, что их не пустили во двор на обыск. Если приставы\nсами не явились на обыск, то они отстранялись от выполнения\nобязанностей, а истец проигрывал дело.<\/p>\n<p>После начинается <strong>свод<\/strong> - человек, у которого нашли\nукраденную вещь мог присягнуть, что купил вещь на торгу.<\/p>\n<p>Важным этапом был вызов ответчика в суд (ему давалось 5 дней на явку\nв суд), осуществляемый публично на церковной площади в присутствии\nсвященника. В случае пятидневной неявки в суд ответчика его могли\nдоставить на суд принудительно.<\/p>\n<p>Свидетелей мог вызывать и истец (также мог вызвать послуха), и\nответчик.<\/p>\n<p>Последний этап - <strong>выемка<\/strong> - изъятие вещественных\nдоказательств - осуществлял пристав, имущество следовало отдать\nсторонним людям.<\/p>\n<p>Дела между гражданином Пскова и иностранцем решались по упрощенной\nпроцедуре. Гражданин мог присягнуть в том, что не бил или не грабил\nиностранца и тем самым отводил от себя обвинение.<\/p>\n<p><strong>Правая грамота<\/strong>- решение суда.<\/p>\n<p>*По**рядок рассмотрения дела в суде:*<\/p>\n<p>В судебное помещение (<strong>судебницу<\/strong>) допускались только\nтяжущиеся стороны. Предусматривалась ответственность з самовольное и\nнасильственное вторжение в судебное помещение, за нанесение ударов\n<strong>подвернику<\/strong>.<\/p>\n<p>*Органы и л**ица, осуществляющие правосудие:*<\/p>\n<ol type=\"1\">\n<li>Государственный светский суд:<\/li>\n<\/ol>\n<p>а) <strong>вече<\/strong> - рассматривало государственные\nпреступления.<\/p>\n<p>б) <strong>господа<\/strong> - коллегиальный судебный орган. Состав\nгосподи - князь, посадник, сотский.<\/p>\n<p>в) <strong>местный суд<\/strong> - осуществлялся наместниками\n(представителями князя на местах) и пригородскими старостами<\/p>\n<ol start=\"2\" type=\"1\">\n<li>Церковный суд:<\/li>\n<\/ol>\n<p><strong>Суд наместников архиепископа<\/strong> - суд по церковным\nделам (против церковных лиц, совершенные церковными людьми) над\nцерковными людьми (попы, дьяконы, просвирня, монахи).<\/p>\n<ol start=\"3\" type=\"1\">\n<li><p><strong>Общий суд<\/strong> - соединение светского суда и\nцерковного. Применялся, когда одна из сторон - мирянин, а другая -\nцерковный человек. Составлялся наместников владыки, князем и\nпосадником.<\/p><\/li>\n<li><p><strong>Суд братчины<\/strong> - группа соседей, объединившихся\nмежду собой с целью организации разбирательства дел об оскорблениях и\nдраках на пирах. Участники братчины избирали «пирового старосту»,\nкоторому были подсудны оскорбления и драки на пирах.<\/p><\/li>\n<\/ol>\n<p><em>Вспомогательный персонал:<\/em><\/p>\n<ol type=\"1\">\n<li><strong>Писец<\/strong> - составлял документы:<\/li>\n<\/ol>\n<ul>\n<li><p><strong>позовница<\/strong> - повестка в суд<\/p><\/li>\n<li><p><strong>бессудные грамоты<\/strong> - судебные решения, вынесенные\nбез разбирательства в связи с неявкой стороны в суд<\/p><\/li>\n<li><p><strong>приставные<\/strong> - документы, доставлявшиеся судебными\nприставами<\/p><\/li>\n<li><p><strong>судница<\/strong> - решение суда<\/p><\/li>\n<li><p><strong>правовая грамота<\/strong> - судебное решение,\nвыдававшееся выигравшей стороне<\/p><\/li>\n<\/ul>\n<ol start=\"2\" type=\"1\">\n<li><p><strong>Пристав<\/strong> - обыскивает двор с целью поиска\nдоказательств. Назначается князем или посадником. Вызывает ответчика в\nсуд, а в случае неявки в течении 5 дней доставляет его насильно. За\nисполнение этой обязанности получал с истца деньги.<\/p><\/li>\n<li><p><strong>Наймит<\/strong> - наемный боец, который мог заменить\nсобой в судебном поединке женщину, малолетнего, престарелого, больного,\nинвалида, монаха.<\/p><\/li>\n<li><p><strong>Подворник<\/strong> - следил за порядком в зале\nсуда.<\/p><\/li>\n<\/ol>\n<p>*Сист**ема доказательств:*<\/p>\n<ol type=\"1\">\n<li><p>Собственное признание<\/p><\/li>\n<li><p><strong>Поличное<\/strong> - краденая вещь, найденная у\nзаподозренного в краже, обнаруживалось во время обыска, при котором мог\nприсутствовать и истец<\/p><\/li>\n<li><p>Письменные документы - играли большую роль в имущественных\nспорах:<\/p><\/li>\n<\/ol>\n<p>а) <strong>грамота<\/strong> - решались споры о праве собственности на\nлесные участки. При возникновении земельных споров лицо, владеющей\nземлей, на основании сделок, удостоверенных грамотой, имело право\nизбирать для разрешения споров поединок или присягу истца.<\/p>\n<p>б) <strong>запись<\/strong> - обеспечивала защиту в случае\nвозникновения споров о нарушении условий договора, споры о размере\nпроцентов на суде<\/p>\n<p>в) <strong>рядница<\/strong> - платежная расписка<\/p>\n<p>г) <strong>доска<\/strong> - не имели большого значения, ее можно было\nоспорить.<\/p>\n<ol start=\"4\" type=\"1\">\n<li>Показания свидетелей:<\/li>\n<\/ol>\n<p>а) <strong>сторонние люди<\/strong> - старосты, соседи<\/p>\n<p>Б) <strong>послухи<\/strong> - должны были защищать свои показания\nпротив ответчика в судебном поединке. Неявка послуха автоматически вела\nк проигрышу дела стороной, опиравшейся в доказательство своей правоты на\nего показания. Несовпадение показаний истца и послуха вело к проигрышу\nдела.<\/p>\n<ol start=\"5\" type=\"1\">\n<li>Ордалии - применялись, когда не было других доказательств:<\/li>\n<\/ol>\n<p>а) <strong>поле<\/strong> - судебный поединок. Заменять себя на\nпоединке нельзя было послухам, а также если обе стороны были\nженщины.<\/p>\n<ol start=\"6\" type=\"1\">\n<li><strong>Рота<\/strong> - присяга. Использовалась по незначительным\nделам. Отказ от роты вел к проигрышу дела.<\/li>\n<\/ol>\n<ul>\n<li><p>Принципы судопроизводства:*<\/p><\/li>\n<li><p>непрерывность процесса<\/p><\/li>\n<li><p>запрет пересуда чужих дел<\/p><\/li>\n<li><p>принцип подсудности<\/p><\/li>\n<li><p>принцип беспристрастности<\/p><\/li>\n<li><p>Дело должен бы рассматривать и вносить по нему решение тот\nпосадник, который начинал его слушать<\/p><\/li>\n<li><p>Активная роль судей в судебном процессе: судья ведет следствие,\nпосылает своих людей на место для выяснения обстоятельств дела<\/p><\/li>\n<li><p>Объективность: присягу приносили и стороны, и судьи<\/p><\/li>\n<li><p>Устанавливались сроки рассмотрения дела в зависимости от\nсложности дела<\/p><\/li>\n<li><p>Предусматривалось судебное представительство<\/p><\/li>\n<li><p>исполнение судебного решения возлагалось на победившую стороны,\nпроигравшая стороны оплачивала судебные издержки<\/p><\/li>\n<\/ul>\n", "t": " в пскове продолжал существовать состязательный процесс , стороны назывались сутяжниками , иногда истцами. не было разделений процесса на гражданский и уголовный. процесс был устным , но решение выносилось в письменном виде, при выдаче его взимались судебные пошлины. решение по делу исполняли специальные служащие князя или города. вместе с тем развивается и следственная, розыскная форма процесса. существовал институт досудебной подготовки дела - свод . на процессе допускалось представительство сторон. женщины, дети, старики, монахи, монахини и глухие могли иметь пособников, которые должны были представлять в суде их интересы. должностным лицам запрещалось выступать в качестве представителя стороны в процессе, чтобы не оказывать давления на суд. в случае спора о церковной земле интересы церкви представлял староста, то есть выборный представитель верующих прихода этой церкви. процессуальные действия: процесс начинался подачи искового заявления, жалобы. половник и его господин начинали разрешение своих споров с заклича, публичного оповещения на торгу о своих претензиях. это объявление должно было привлечь к делу в качестве свидетеля членов общины. далее, в случае совершения кражи, происходим обыск - подозреваемый должен был допустить в свой двор приставов для обыска, если не опускал - он обвинялся в краже. приставам достаточно было 2-3 свидетелей для доказательства того, что их не пустили во двор на обыск. если приставы сами не явились на обыск, то они отстранялись от выполнения обязанностей, а истец проигрывал дело. после начинается свод - человек, у которого нашли украденную вещь мог присягнуть, что купил вещь на торгу. важным этапом был вызов ответчика в суд (ему давалось 5 дней на явку в суд), осуществляемый публично на церковн

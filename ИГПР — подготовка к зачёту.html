ебном процессе: судья ведет следствие, посылает своих людей на место для выяснения обстоятельств дела объективность: присягу приносили и стороны, и судьи устанавливались сроки рассмотрения дела в зависимости от сложности дела предусматривалось судебное представительство исполнение судебного решения возлагалось на победившую стороны, проигравшая стороны оплачивала судебные издержки "}, {"n": "Государство и право Золотой Орды.", "h": "<p><strong>Золотая Орда<\/strong> — государство, возникновение которого\nсвязано с завоевательными походами монгольского хана Темучина, или\nЧингисхана (ок. 1155—1227), и его потомков. Внук Чингисхана Батый\n(1208—1255) образовал огромное государство, которое в восточных\nисточниках называлось Синей Ордой, а в русских летописях — Золотой\nОрдой. Батый построил город Сарай, который сделал столицей своего\nгосударства.<\/p>\n<p>Основная масса кочевого населения в Золотой Орде состояла из\nкипчаков-половцев (тюрков). С течением времени монголы растворились в\nмассе тюрков. Общепринятым языком стал тюркский.<\/p>\n<p>Огромная Золотоордынская империя подчинила себе раздробленную Русь. В\n1243 г. русские князья поехали в Орду и признали власть хана Батыя над\nсобой. Власть Золотой Орды признал и русский митрополит.<\/p>\n<p>Русские княжества стали вассальными государствами Золотой Орды. Они\nбыли обязаны нести золотоордынским ханам военную службу и платить дань —\n<strong>«выход»<\/strong>. В русских землях находились представители\nханской администрации — <strong>баскаки<\/strong>, которые нередко чинили\nпроизвол в отношении русского населения.<\/p>\n<p>Закономерным явлением стал процесс постепенного дробления и распада\nЗолотой Орды. В середине XV в. из ее состава выделились Казанское и\nКрымское ханства, затем образовались Астраханское и Сибирское\nханства.<\/p>\n<ul>\n<li>Государственный строй:<\/li>\n<\/ul>\n<p>Золотая Орда являлась феодальной монархией. Ее политическое\nустройство повторяло устройство великой империи Чингисхана. Верховная\nвласть принадлежала хану. Хотя его власть носила деспотический характер,\nон был окружен феодальной верхушкой, которая направляла и контролировала\nего деятельность. Хан был верховным собственником и распорядителем всех\nземель в государстве (мог раздавать землю родичам и должностным лицам),\nвозглавлял вооруженные силы, назначал и смещал всех высших должностных\nлиц, объявлял войну и заключал мир, являлся верховным судьей.<\/p>\n<p>Для решения основных политических вопросов в Золотой Орле созывались\nсъезды наиболее крупных феодалов — <strong>курултаи<\/strong>. Членами\nкурултаев были <strong>царевичи<\/strong> и <strong>нойоны<\/strong>,\nзанимавшие высшие военные должности. На курултаях выбирали нового хана,\nрешались вопросы войны и мира, пересматривались границы улусов,\nрассматривались споры между крупными феодалами. Воля хана, его решение\nна курултае были окончательными.<\/p>\n<p>Важным звеном центрального управления были <strong>диваны<\/strong>\n(канцелярии). В их ведении находились различные отрасли государственного\nуправления. Диваны состояли из секретарей, называвшихся\n<strong>битакчи<\/strong>. Наиболее важным был диван, ведавший доходами и\nрасходами. В этом диване находился особый документ с перечнем\nпоступлений с отдельных областей и городов, называвшийся\n<strong>дедотаром<\/strong>.<\/p>\n<p>Высшим должностным лицом в Золотой Орде был <strong>визирь<\/strong>.\nВ его ведении находилась ханская казна и общее управление делами\nгосударства, которое он осуществлял от имени и по поручению хана.<\/p>\n<p>Военное ведомство возглавлял <strong>бекляри-бек<\/strong>, который\nнаправлял деятельность эмиров, темников, тысячников. Он был старшим из\nэмиров, которых всего было четыре.<\/p>\n<p>Еще одно влиятельное должностное лицо — <strong>букаул<\/strong>,\nведавший снабжением, вооружением, довольствием войска, учетом и\nдоставкой военной добычи.<\/p>\n<p>В центральном аппарате государства несли службу\n<strong>даруги<\/strong> и <strong>баскаки<\/strong>. Они занимались\nучетом населения, сбором податей, организацией военных походов. Войско в\nЗолотой Орде строилось по десятичной системе. Оно делилось на десятки\nтысяч во главе с темниками и на тысячи, делившиеся на сотни и десятки.\nВысший командный состав — темники и тысячники — состоял из царевичей и\nзнатных нойонов.<\/p>\n<ul>\n<li>Сословная иерархия:<\/li>\n<\/ul>\n<p>Статус подданного Золотой Орды зависел от происхождения, заслуг перед\nханом и его родом, от должности в военно-административном аппарате.\nГосподствующее положение в феодальном обществе Золотой Орды занимал\nаристократический род потомков Чингисхана — так называемые\n<strong>царевичи<\/strong>. Это был довольно многочисленный род,\nвладевший всей землей в стране. Подобно ханам, члены этого рода давали\nсвоим подвластным людям ярлыки. Царевичи имели преимущественное право\nзанятия высших государственных постов. Они, по существу, определяли\nвнутреннюю и внешнюю политику государства.<\/p>\n<p>На следующей ступени военно-феодальной иерархии Золотой Орды стояли\n<strong>нойоны<\/strong>, или <strong>беки<\/strong>. Они вели свое\nпроисхождение от сподвижников Чингисхана и их сыновей. Нойоны имели\nогромные стада, множество слуг и зависимых людей. От своих владений они\nполучали огромные доходы — до 100—200 тыс. динаров в год. Нойоны\nназначались на ответственные государственные и военные должности —\nтемников, тысячников, баскаков. Им давались <strong>тарханные\nграмоты<\/strong>, освобождавшие от различных повинностей. Знаками их\nвласти были ярлыки и <strong>найцзы<\/strong> (знак повеления, приказа,\nверительной грамоты в виде тонкой пластины).<\/p>\n<p>Дальше шли <strong>нукеры<\/strong> — дружинники крупных феодалов. Они\nзанимали средние и низшие должности в военно-административном аппарате —\nсотников, десятников. Это позволяло им извлекать значительные доходы с\nнаселения тех территорий, на которых они были размещены.<\/p>\n<p>К средним феодалам относились и тарханы, получившие от хана тарханные\nграмоты, в которых им устанавливались привилегии. Они были свободны от\nподатей и предавались суду после совершения девяти проступков.<\/p>\n<p>К привилегированной части общества относилось духовенство.\nнаибольшими привилегиями обладало мусульманское духовенство. Его\nпредставители были не только богатейшими людьми, но и занимали важные\nдолжности в административном и судебном аппарате.<\/p>\n<p>Основная масса феодально-зависимого населения состояла из\nкочевников-скотоводов — <strong>карачу<\/strong> — «черная кость», а\nтакже из земледельцев и городского населения. Карачу вели хозяйство на\nземлях, принадлежавших феодалам-землевладельцам. Занимаясь\nскотоводством, они несли повинности кобыльим молоком и другими\nпродуктами скотоводства. Карачу служили в войске, обеспечивали его\nтранспортом.<\/p>\n<p>Кроме кочевников, в земледельческих районах Золотой Орды жили\nфеодально-зависимые крестьяне — <strong>сабанчи<\/strong> и\n<strong>уртакчи<\/strong>. Сабанчи жили сельскими общинами, несли\nнатуральные и другие повинности на феодалов, а также обрабатывали\nвыделенные им участки. <strong>Уртакчи<\/strong> (издольщики) — кабальные\nлюди — обрабатывали землю феодалов за половину урожая, несли другие\nповинности.<\/p>\n<p>В городах жили ремесленники и торговцы, которые платили городским\nвластям подати, несли другие повинности.<\/p>\n<p>В Золотой Орде существовало рабство. Основным источником рабства был\nплен. Труд рабов применялся во всех отраслях хозяйства. Однако рабы\nзачастую превращались в крепостных крестьян. Их сажали на землю,\nнаделяли средствами производства и постепенно рабы становились\nсабанчи.<\/p>\n<ul>\n<li>Право:<\/li>\n<\/ul>\n<p>Основным источником права в Золотой Орде был составленный Чингисханом\nсборник правовых норм, получивший название <strong>Великой Ясы<\/strong>.\nЕе дошедшие до нас нормы в большей степени относятся к уголовному праву.\nОни свидетельствуют о крайней жестокости в отношении правонарушителей.\nЧаще всего упоминается смертная казнь и наказание палками.<\/p>\n<p>За измену Яса Чингисхана предусматривала смертную казнь. К\nимущественным преступлениям относилось присвоение бежавшего раба,\nубежавшего пленника. Это каралось смертной казнью.<\/p>\n<p>Кража лошадей предполагала возвращение не только украденной лошади,\nно добавление еще десяти лошадей. Если лошадей не было, виновный\nрасплачивался своими детьми. Если детей не было, виновного могли\n«зарезать, как барана».<\/p>\n<p>Смертная казнь предусматривалась за супружескую неверность,\nскотоложство и некоторые другие преступления и производилась, как\nправило, публично путем улавливания на веревке, подвешенной на шее\nверблюда или лошади, а также волочения лошадьми.<\/p>\n<p>Наследование имущества происходило таким образом, что старший сын\nполучал больше младших, меньший сын наследовал хозяйство отца.<\/p>\n<p>Суд в Золотой Орде до принятия мусульманства действовал на основе\nмонгольского обычного права — <strong>ясы<\/strong>. После введения\nислама суд основывался на <strong>шариате<\/strong>. Судьями были\n<strong>кады<\/strong> (кадии), которые судили по шариату, а также\n<strong>яргучи<\/strong>, выносившие решения на основе Великий Ясы\nЧингисхана.<\/p>\n", "t": " золотая орда — государство, возникновение которого связано с завоевательными походами монгольского хана темучина, или чингисхана (ок. 1155—1227), и его потомков. внук чингисхана батый (1208—1255) образовал огромное государство, которое в восточных источниках называлось синей ордой, а в русских летописях — золотой ордой. батый построил город сарай, который сделал столицей своего государства. основная масса кочевого населения в золотой орде состояла из кипчаков-половцев (тюрков). с течением времени монголы растворились в массе тюрков. общепринятым языком стал тюркский. огромная золотоордынская империя подчинила себе раздробленную русь. в 1243 г. русские князья поехали в орду и признали власть хана батыя над собой. власть золотой орды признал и русский митрополит. русские княжества стали вассальными государствами золотой орды. они были обязаны нести золотоордынским ханам военную службу и платить дань — «выход» . в русских землях находились представители ханской администрации — баскаки , которые нередко чинили произвол в отношении русского населения. закономерным явлением стал процесс постепенного дробления и распада золотой орды. в середине xv в. из ее состава выделились казанское и крымское ханства, затем образовались астраханское и сибирское ханства. государственный строй: золотая орда являлась феодальной монархией. ее политическое устройство повторяло устройство великой империи чингисхана. верховная власть принадлежала хану. хотя его власть носила деспотический характер, он был окружен феодальной верхушкой, которая направляла и контролировала его деятельность. хан был верховным собственником и распорядителем всех земель в государстве (мог раздавать землю родичам и должностным лицам), возглавлял вооруженные силы, назначал и смещал всех высших должностных лиц, объявлял войну и заключал мир, являлся верховным судьей. для решения основных политических вопросов в золотой орле созывались съезды наиболее крупных феодалов — курултаи . членами курултаев были царевичи и нойоны , занимавшие высшие военные должности. на курултаях выбирали нового хана, решались вопросы войны и мира, пересматривались границы улусов, рассматривались споры между крупными феодалами. воля хана, его решение на курултае были окончательными. важным звеном центрального управления были диваны (канцелярии). в их ведении находились различные отрасли государственного управления. диваны состояли из секретарей, называвшихся битакчи . наиболее важным был диван, ведавший доходами и расходами. в этом диване находился особый документ с перечнем поступлений с отдельных областей и городов, называвшийся дедотаром . высшим должностным лицом в золотой орде был визирь . в его ведении находилась ханская казна и общее управление делами государства, которое он осуществлял от имени и по поручению хана. военное ведомство возглавлял бекляри-бек , который направлял деятельность эмиров, темников, тысячников. он был старшим из эмиров, которых всего было четыре. еще одно влиятельное должностное лицо — букаул , ведавший снабжением, вооружением, довольствием войска, учетом и доставкой военной добычи. в центральном аппарате государства несли службу даруги и баскаки . они занимались учетом населения, сбором податей, организацией военных походов. войско в золотой орде строилось по десятичной системе. оно делилось на десятки тысяч во главе с темниками и на тысячи, делившиеся на сотни и десятки. высший командный состав — темники и тысячники — состоял из царевичей и знатных нойонов. сословная иерархия: статус подданного золотой орды зависел от происхождения, заслуг перед ханом и его родом, от должности в военно-административном аппарате. господствующее положение в феодальном обществе золотой орды занимал аристократический род потомков чингисхана — так называемые царевичи . это был довольно многочисленный род, владевший всей землей в стране. подобно ханам, члены этого рода давали своим подвластным людям ярлыки. царевичи имели преимущественное право занятия высших государственных постов. они, по существу, определяли внутреннюю и внешнюю политику государства. на следующей ступени военно-феодальной иерархии золотой орды стояли нойоны , или беки . они вели свое происхождение от сподвижников чингисхана и их сыновей. нойоны имели огромные стада, множество слуг и зависимых людей. от своих владений они получали огромные доходы — до 100—200 тыс. динаров в год. нойоны назначались на ответственные государственные и военные должности — темников, тысячников, баскаков. им давались тарханные грамоты , освобождавшие от различных повинностей. знаками их власти были ярлыки и найцзы (знак повеления, приказа, верительной грамоты в виде тонкой пластины). дальше шли нукеры — дружинники крупных феодалов. они занимали средние и низшие должности в военно-административном аппарате — сотников, десятников. это позволяло им извлекать значительные доходы с населения тех территорий, на которых они были размещены. к средним феодалам относились и тарханы, получившие от хана тарханные грамоты, в которых им устанавливались привилегии. они были свободны от податей и предавались суду после совершения девяти проступков. к привилегированной части общества относилось духовенство. наибольшими привилегиями обладало мусульманское духовенство. его представители были не только богатейшими людьми, но и занимали важные должности в административном и судебном аппарате. основная масса феодально-зависимого населения состояла из кочевников-скотоводов — карачу — «черная кость», а также из земледельцев и городского населения. карачу вели хозяйство на землях, принадлежавших феодалам-землевладельцам. занимаясь скотоводством, они несли повинности кобыльим молоком и другими продуктами скотоводства. карачу служили в войске, обеспечивали его транспортом. кроме кочевников, в земледельческих районах золотой орды жили феодально-зависимые крестьяне — сабанчи и уртакчи . сабанчи жили сельскими общинами, несли натуральные и другие повинности на феодалов, а также обрабатывали выделенные им участки. уртакчи (издольщики) — кабальные люди — обрабатывали землю феодалов за половину урожая, несли другие повинности. в городах жили ремесленники и торговцы, которые платили городским властям подати, несли другие повинности. в золотой орде существовало рабство. основным источником рабства был плен. труд рабов применялся во всех отраслях хозяйства. однако рабы зачастую превращались в крепостных крестьян. их сажали на землю, наделяли средствами производства и постепенно рабы становились сабанчи. право: основным источником права в золотой орде был составленный чингисханом сборник правовых норм, получивший название великой ясы . ее дошедшие до нас нормы в большей степени относятся к уголовному праву. они свидетельствуют о крайней жестокости в отношении правонарушителей. чаще всего упоминается смер олной его отмены в 1840 году. В преамбуле последней конституции\nЛитовской Республики Статуты названы правовыми фундаментами литовского\nгосударства.<\/p>\n<p>Содержание Статутов 1566 и 1588 годов свидетельствует о расцвете\nфеодальной демократии, зарождении новой формы правосознания.\nЗакрепленные в них прогрессивные положения и принципы дают основания\nполагать, что в период начиная с XVI века стала последовательно\nпроводиться в жизнь идея установления в ВКЛ правового государства.<\/p>\n<p>Для Статутов 1566 и 1588 годов в более выраженной форме были\nсвойственны гуманистические тенденции по сравнению с тем, как они были\nобозначены в Статуте 1529 года. Так, по Статуту 1566 года возраст\nуголовной ответственности устанавливался уже не с семи, а с 14 лет. На\nпростых людей распространялось право избирать великого князя. По Статуту\n1588 года возраст наступления уголовной ответственности повышался до 16\nлет. Здесь же невольное состояние ограничивался лишь одним источником -\nпопаданием в плен. Более того, Статут 1588 года предписывал впредь\nназывать челядь невольную <strong>«дворовой челядью»<\/strong>, а лиц,\nранее именовавшихся <strong>челядью невольной<\/strong>, наделить землей\nи перевести в разряд крестьян <strong>«отчиев»<\/strong>.<\/p>\n<p>Составители Статута не придерживались системы кодификации, принятой в\nримском праве, а разработали свою. В ее основу были положены новые\nпринципы: суверенность державы (наперекор средневековому\nкосмополитизму), единство права, приоритет писаного права.<\/p>\n", "t": " статут великого княжества литовского — верховный закон великого княжества литовского, составлявший его правовую основу. 1)первый статут, состоящий из 13 разделов (282 статей) был издан в 1529 году. статут регламентировал вопросы гражданского, уголовного и процессуального права. документу свойственен подход к проблемам в духе гуманизма. так, в статье 7 раздела i провозглашалось положение о том, что никто не должен отвечать за чужую вину, а уголовное наказание должно назначаться только лицам, вина которых установлена законом. при этом свободного человека за допущенную провинность никто не имел права отдавать в вечное рабство. 2)второй статут был издан в 1566 году и отражал социально-экономические и политические изменения. 3)третий статут был издан в 1588 году и действовал на территории вкл до полной его отмены в 1840 году. в преамбуле последней конституции литовской республики статуты названы правовыми фундаментами литовского государства. содержание статутов 1566 и 1588 годов свидетельствует о расцвете феодальной демократии, зарождении новой формы правосознания. закрепленные в них прогрессивные положения и принципы дают основания полагать, что в период начиная с xvi века стала последовательно проводиться в жизнь идея установления в вкл правового государства. для статутов 1566 и 1588 годов в более выраженной форме были свойственны гуманистические тенденции по сравнению с тем, как они были обозначены в статуте 1529 года. так, по статуту 1566 года возраст уголовной ответственности устанавливался уже не с семи, а с 14 лет. на простых людей распространялось право избирать великого князя. по статуту 1588 года возраст наступления уголовной ответственности повышался до 16 лет. здесь же невольное состояние ограничивался лишь одним источником - попаданием в плен. более того, статут 1588 года предписывал впредь называть челядь невольную «дворовой челядью» , а лиц, ранее именовавшихся челядью невольной , наделить землей и перевести в разряд крестьян «отчиев» . составители статута не придерживались системы кодификации, принятой в римском праве, а разработали свою. в ее основу были положены новые принципы: суверенность державы (наперекор средневековому космополитизму), единство права, приоритет писаного права. "}, {"n": "Причины и этапы образования Русского централизованного государства.", "h": "<p>Русское централизованное государство сложилось в XIV–XVI вв.<\/p>\n<ul>\n<li>Группы предпосылок образования русского централизованного\nгосударства:<\/li>\n<\/ul>\n<ol type=\"1\">\n<li><p><strong>Экономические предпосылки<\/strong>: к началу XIV в. на\nРуси постепенно после татаро-монгольского нашествия возрождалась и\nразвивалась хозяйственная жизнь, что явилось экономической базой борьбы\nза объединение и независимость. Также восстанавливались города, жители\nвозвращались в родные места, возделывали землю, занимались ремеслом,\nналаживались торговые связи. Этому немало способствовал\nНовгород.<\/p><\/li>\n<li><p><strong>Социальные предпосылки<\/strong>: к концу XIV в. полностью\nстабилизировалась экономическая обстановка на Руси. На фоне развиваются\nпоздние феодальные признаки, все более возрастает зависимость крестьян\nот крупных землевладельцев. Одновременно сопротивление крестьян также\nвозрастает, что обнаруживает необходимость в сильной централизованной\nвласти.<\/p><\/li>\n<li><p><strong>Политические предпосылки<\/strong>, которые в свою очередь\nподразделяются на внутренние и внешнеполитические:<\/p><\/li>\n<\/ol>\n<p>1<strong>) внутренние<\/strong>: в XIV–XVI вв. значительно возрастает\nи расширяется власть Московского княжества. Его князья строят\nгосударственный аппарат для укрепления своей власти;<\/p>\n<ol start=\"2\" type=\"1\">\n<li><strong>внешнеполитические<\/strong>: главная внешнеполитическая\nзадача Руси заключалась в необходимости свергнуть татаро-монгольское\nиго, которое тормозило развитие Русского государства. Восстановление\nнезависимости Руси требовало всеобщего объединения против единого врага:\nмонгол – с юга, Литвы и Шведов – с запада.<\/li>\n<\/ol>\n<p>Одной из политических предпосылок образования единого Русского\nгосударства стала уния православной церкви и католической западной\nцеркви, подписанная византийско-константинопольским патриархом. Россия\nстало единственным православным государством, объединяющим одновременно\nвсе княжества Руси.<\/p>\n<ul>\n<li>Образование Русского централизованного государства проходило в\nнесколько этапов:<\/li>\n<\/ul>\n<p><strong>XIII – XIV века<\/strong>: происходит становление Московского\nкняжества. С 1263 года это был небольшой удел в составе Владимирского\nкняжества, управляемый Даниилом Александровичем (младший сын Невского).\nБолее ранние попытки выделения оказывались временными. Постепенно\nвладения расширялись. Особое значение имела победа над Тверским\nкняжеством за права на великокняжеский престол во Владимире. С 1363 года\nназванию добавилось «великое». В 1389 произошло поглощение Владимирского\nкняжества;<\/p>\n<p><strong>XIV – XV века<\/strong>: Московское княжество возглавило\nборьбу с монголо-татарами. Отношения Москвы с Золотой Ордой были\nнеоднозначными. Иван Ι Калита (московский князь с 1325 года) собирал для\nмонголо-татар дань с покоренных российских княжеств. Московские князья\nвступали с захватчиками в союз, заключали династические браки, покупали\n«ярлык» (ханская грамота – разрешение) на княжение. Дмитрий Ι Донской\n(московский князь с 1359 г.) в 1373 оказал серьезное сопротивление\nмонголо-татарам, напавшим на Рязань. Затем русские войска одержали\nпобеду в сражении на реке Воже (1378 г.) и на Куликовом поле (1380\nг.);<\/p>\n<p><strong>XV – начало XVI века<\/strong>: окончательное формирование\nцентрализованного государства. Его основателем считается Иван ΙΙΙ,\nзавершивший присоединение к Московскому княжеству северо-восточных\nземель (к 1500 году) и свергший монголо-татарскую власть (в 1480 году\nпосле Стояния на реке Угре).<\/p>\n", "t": " русское централизованное государство сложилось в xiv–xvi вв. группы предпосылок образования русского централизованного государства: экономические предпосылки : к началу xiv в. на руси постепенно после татаро-монгольского нашествия возрождалась и развивалась хозяйственная жизнь, что явилось экономической базой борьбы за объединение и независимость. также восстанавливались города, жители возвращались в родные места, возделывали землю, занимались ремеслом, налаживались торговые связи. этому немало способствовал новгород. социальные предпосылки : к концу xiv в. полностью стабилизировалась экономическая обстановка на руси. на фоне развиваются поздние феодальные признаки, все более возрастает зависимость крестьян от крупных землевладельцев. одновременно сопротивление крестьян также возрастает, что обнаруживает необходимость в сильной централизованной власти. политические предпосылки , которые в свою очередь подразделяются на внутренние и внешнеполитические: 1 ) внутренние : в xiv–xvi вв. значительно возрастает и расширяется власть московского княжества. его князья строят государственный аппарат для укрепления своей власти; внешнеполитические : главная внешнеполитическая задача руси заключалась в необходимости свергнуть татаро-монгольское иго, которое тормозило развитие русского государства. восстановление независимости руси требовало всеобщего объединения против единого врага: монгол – с юга, литвы и шведов – с запада. одной из политических предпосылок образования единого русского государства стала уния православной церкви и католической западной церкви, подписанная византийско-константинопольским патриархом. россия стало единственным православным государством, объединяющим одновременно все княжества руси. образование русского централизованного государства проходило в несколько этапов: xiii – xiv века : происходит становление московского княжества. с 1263 года это был небольшой удел в составе владимирского княжества, управляемый даниилом александровичем (младший сын невского). более ранние попытки выделения оказывались временными. постепенно владения расширялись. особое значение имела победа над тверским княжеством за права на великокняжеский престол во владимире. с 1363 года названию добавилось «великое». в 1389 произошло поглощение владимирского княжества; xiv – xv века : московское княжество возглавило борьбу с монголо-татарами. отношения москвы с золотой ордой были неоднозначными. иван ι калита (московский князь с 1325 года) собирал для монголо-татар дань с покоренных российских княжеств. московские князья вступали с захватчиками в союз, заключали династические браки, покупали «ярлык» (ханская грамота – разрешение) на княжение. дмитрий ι донской (московский князь с 1359 г.) в 1373 оказал серьезное сопротивление монголо-татарам, напавшим на рязань. затем русские войска одержали победу в сражении на реке воже (1378 г.) и на куликовом поле (1380 г.); xv – начало xvi века : окончательное формирование централизованного государства. его основателем считается иван ιιι, завершивший присоединение к московскому княжеству северо-восточных земель (к 1500 году) и свергший монголо-татарскую власть (в 1480 году после стояния на реке угре). "}, {"n": "Эволюция системы управления в Русском государстве в X-XVII вв.", "h": "<ol type=\"1\">\n<li><strong>В Древнерусском государстве существовала десятичная,\nчисленная система управления<\/strong>. Она выросла из военной\nорганизации, когда начальники воинских подразделений – десятские,\nсотские, тысяцкие – стали руководителями более или менее крупных звеньев\nгосударства. Так <strong>тысяцкий<\/strong> сохранил функции\nвоеначальника, <strong>сотский<\/strong> же стал городским\nсудебно-административным должностным лицом. Десятичная система еще не\nотделяла центрального управления от местного. Однако позже такая\nдифференциация возникает. В центральном управлении складывается\n<strong>дворцово-вотчинная система управления<\/strong>. Она возникает из\nидеи соединения управления великокняжеским дворцом с государственным\nуправлением. В великокняжеском хозяйстве имелись разного рода слуги,\nведавшие удовлетворением тех или иных жизненных потребностей: дворецкие,\nконюшние и др. Со временем князья поручают этим лицам какие-либо сферы\nуправления, так или иначе связанные с их первоначальной деятельностью,\nпредоставляют им для этого необходимые средства. Так личный слуга\nстановился государственным деятелем, администратором.<\/li>\n<\/ol>\n<p>Система местного самоуправления была проста. Кроме местных князей,\nсидевших в своих уделах, на места посылались представители центральной\nвласти – наместники и волостели. Они за свою службу получали от\nнаселения «корм». Так сложилась система кормления.<\/p>\n<ol start=\"2\" type=\"1\">\n<li><p><strong>Раздробленность<\/strong>. Старая десятичная система\nуправления вписалась в новое административно-территориальное устройство;\nСотни имели свои сходы и избирали светских. В военное время они\nсоставляли базу новгородского ополчения. Концы делились на улицы,\nуправляемые <strong>уличанским вече<\/strong> и избираемым на нем\nстаростой.<\/p><\/li>\n<li><p><strong>Централизованное государство<\/strong>. Продолжая\nоставаться раннефеодальной монархией, Московское государство\nунаследовало от предыдущего периода и органы центрального управления,\nпостроенные по дворцово-вотчинной системе. Однако расширение территории\nгосударства и усложнение его деятельности приводили к отмиранию\nдворцово-вотчинной системы и зарождению приказного управления.<\/p><\/li>\n<\/ol>\n<p><em>Система начинает подразделяться на 2 части:<\/em><\/p>\n<ol type=\"1\">\n<li><p>управление дворца, во главе которой <strong>дворский<\/strong>,\nимеющих в своем расположении много слуг. Ведал и пашенными княжескими\nкрестьянами.<\/p><\/li>\n<li><p>Пути, обеспечивающие специальные нужды князя и его окружения.\nНазначение путей: сокольничий, конюшенный, ловчий и др. Для выполнения\nих задач в ведение путей выделялись определенные княжеские села и целые\nместности. Также они выступали как административные и судебные органы.\nРуководили их именовались путными боярами. Из органов, обслуживающих\nличные нужды князя они превращались в государственные учреждения,\nвыполняющих важные задачи по управлению государством. Усложнение функций\nдворцовых органов потребовало создания большого и разветвленного\nаппарата. Была создана большая дворцовая канцелярия с архивными и иными\nподразделениями.<\/p><\/li>\n<\/ol>\n<p>Местные органы. Во главе административных единиц стали должностные\nлица – <strong>представители центра<\/strong>. Уезды возглавлялись\n<strong>наместниками<\/strong>, волостели – <strong>волостелями<\/strong>.\nЭти должностные лица содержались за счет местного населения – получали\nот него <strong>«корм»<\/strong>.<\/p>\n<p>Кормленщики были обязаны управлять соответствующими уездами и\nволостелями собственными силами, т.е. содержать свой аппарат управления\n(тиунов, доводчиков) и иметь свои собственные военные отряды для\nобеспечения внутренних и внешних функций феодального государства.<\/p>\n<p>Княжата и бояре сохранили в своих вотчинах права на собственность.\nОни были не просто землевладельцами, но и администраторами, а судьями в\nсвоих деревнях и селах.<\/p>\n", "t": " в древнерусском государстве существовала десятичная, численная система управления . она выросла из военной организации, когда начальники воинских подразделений – десятские, сотские, тысяцкие – стали руководителями более или менее крупных звеньев государства. так тысяцкий сохранил функции военачальника, сотский же стал городским судебно-административным должностным лицом. десятичная система еще не отделяла центрального управления от местного. однако позже такая дифференциация возникает. в центральном управлении складывается дворцово-вотчинная система управления . она возникает из идеи соединения управления великокняжеским дворцом с государственным управлением. в великокняжеском хозяйстве имелись разного рода слуги, ведавшие удовлетворением тех или иных жизненных потребностей: дворецкие, конюшние и др. со временем князья поручают этим лицам какие-либо сферы управления, так или иначе связанные с их первоначальной деятельностью, предоставляют им для этого необходимые средства. так личный слуга становился государственным деятелем, администратором. система местного самоуправления была проста. кроме местных князей, сидевших в своих уделах, на места посылались представители центральной власти – наместники и волостели. они за свою службу получали от населения «корм». так сложилась систе  государства. княжата и бояре сохранили в своих вотчинах права на собственность. они были не просто землевладельцами, но и администраторами, а судьями в своих деревнях и селах. "}, {"n": "Воеводско-приказная система управления: возникновение и развитие.", "h": "<p>С увеличением территорий Московского государства усложняются задачи\nуправления, решение административных вопросов. В связи с этим из старых\nструктур (путей, дворца) выделяются новые-приказы.<\/p>\n<p>Если насчёт причин появления приказов мнение ученых единодушно, то о\nмеханизме возникновения приказов историк спорят по сей день.<\/p>\n<p><em>Подходы к формированию приказной системы: <\/em><\/p>\n<ul>\n<li><p><strong>Трансформация из четвертей.<\/strong> При Иване Калите для\nфинансового управления Москвой, город был разделен на трети, во главе\nкоторых стояли дьяки и боярами (они обеспечивали полицейско-финансовые\nфункции). С расширением столицы трети трансформировались в\nчетверти.<\/p><\/li>\n<li><p><strong>Трансформация из поручения<\/strong> (приказа ведать\nкаким-либо вопросом управления). Организация управления с помощью\nприкладывания отбельным должностным лицам ведать широкими и узкими\nвопросами управления. Эти люди обладали не только административной, но и\nсудебной властью. Такого рода поручения постепенно трансформируются в\nпостоянное осуществление функций и лица, которые выполняли эти функции\nформируют небольшой аппарат управления.<\/p><\/li>\n<\/ul>\n<p>Каждый приказ имел свой состав, отсутствовало единство. Это породило\nнечеткость компетенции приказов. Одни и те же вопросы управления могли\nпопадать в сферу деятельности 2,3,4 приказов.<\/p>\n<p>Приказное управление формируется в первой половине 16 века.\nОкончательный переход к приказной системе происходит во второй половине\n16 века.<\/p>\n<p><em>Отсутствие штатного расписания приказов обусловили неодинаковость\nсостава присутствия и руководства:<\/em><\/p>\n<ul>\n<li><p>Количество судей (люди, которые были в составе приказа)\nварьировалось, во главе мог быть боярин, окольничий, думный\nдьяк<\/p><\/li>\n<li><p>Делопроизводство осуществляли дьяки и подьячие-\n<strong>«канцелярия»<\/strong>, которая могла подразделяться на столы и\nповытья.<\/p><\/li>\n<\/ul>\n<p><em>Классификация приказов:<\/em><\/p>\n<ul>\n<li><p><strong>Отраслевые<\/strong>- осуществляли деятельность на большой\nтерритории или территории страны (Посольский приказ, Приказ большой\nказны, Приказ Большого прихода)<\/p><\/li>\n<li><p><strong>Территориальные<\/strong>- осуществляли деятельность на\nотдельной территории (Сибириский приказ, Казанский приказ)<\/p><\/li>\n<li><p><strong>Смешанные<\/strong>- приказ с узко направленной\nспециализацией, который действовал на ограниченной территории\n(Владимирский судный приказ)<\/p><\/li>\n<\/ul>\n<p>Количество приказов в 17 веке достигало 80.<\/p>\n<p>Число приказов менялось (за чёт соединения, разделения одного приказа\nна несколько)<\/p>\n<p>Приказы являлись и судебной инстанцией (она находилась между Боярской\nдумой и царем), обладали правом суда по вопросам своей компетенции.\nПриказ мог осуществлять законодательную деятельность, путём формирования\nтех или иных предложений, вопросов в Боярскую думу.<\/p>\n<p>С 30-х годов 16 века для борьбы с разбоями вводится практика\nпредоставления населению права учреждения <strong>губных\nорганов<\/strong> (закреплялось выдачей губной грамоты) в составе\nвыборных губного старосты (из числа дворян и детей боярских (служилых по\nотечеству)) и 5-6 целовальников<\/p>\n<p><em>Компетенция:<\/em><\/p>\n<ul>\n<li><p>Установление<\/p><\/li>\n<li><p>Задержание<\/p><\/li>\n<li><p>Осуждение разбойников<\/p><\/li>\n<\/ul>\n<p>Для организации раскладки и сбора налогов с 1555 г. за населением\nзакрепляется обязанность формирования земских органов в составе выборных\nизлюбленных голов (повсеместно называются старостами), земского дьяка\n(делопроизводителя), 8-10 целовальников (избрались из числа черносошных\nкрестьян).<\/p>\n<p>В компетенцию включались вопросы правоохранительной деятельности,\nэкономики.<\/p>\n<p>Земские органы подслушали свою резиденцию-<strong>земскую\nизбу<\/strong>, в которой вёл делопроизводство земский дьяк (вёл\nдокументацию, переписку, нёс ответственность за правильность\nсоставленных документов).<\/p>\n<p>Происходит замена кормленщиков воеводами и введение нового\nадминистративно-территориального деления- уездов (это связано с\nдеятельностью Ивана 4). Процесс затянулся на длинный срок.<\/p>\n<p>В отличии от кормленщиков, воевода назначался в уезд с весьма\nширокими полномочиями и содержался за счёт казны.<\/p>\n<p>Если Земские органы занимались раскладкой налогов и расследованием\nкриминальных дел, то воевода отвечал на все. И хотя, он контролировал\nземские и губные органы, со второй половины 17 века воевода фактически\nстановится хозяином в уездах.<\/p>\n<p>Конкуренция между губными, земскими органами и воеводами\nзаканчивается упразднением института воеводства на несколько лет, однако\nпотом его возвращают.<\/p>\n<p>Воеводское управление охватывало всю страну. Первоначально функция\nвоевод заключалась в организации военного отпора в приграничных уездах\nнеприятелю, то, со временем, на воевод возлагается фактически вся\nполнота ответственности за местное управление.<\/p>\n", "t": " с увеличением территорий московского государства усложняются задачи управления, решение административных вопросов. в связи с этим из старых структур (путей, дворца) выделяются новые-приказы. если насчёт причин появления приказов мнение ученых единодушно, то о механизме возникновения приказов историк спорят по сей день. подходы к формированию приказной системы: трансформация из четвертей. при иване калите для финансового управления москвой, город был разделен на трети, во главе которых стояли дьяки и боярами (они обеспечивали полицейско-финансовые функции). с расширением столицы трети трансформировались в четверти. трансформация из поручения (приказа ведать каким-либо вопросом управления). организация управления с помо рно.<\/p>\n<p>В XV веке в условиях самодержавия возникла\n<strong>сословно-представительная монархия<\/strong>. Началом, условно,\nэтого периода считается созыв первого русского собора 1549 года. На этот\nже период приходится принятие 2-х важнейших законодательных актов:<\/p>\n<p>1)судебника 1550 года<\/p>\n<p>2)сборник церковного законодательства 1551 года<\/p>\n<p>Концом сословно-представительной монархии считается время правления\nАлексея Михайловича, когда он перестает собирать земский собор (вторая\nполовина XVII века). Последний собор был созван в 1653 году по поводу\nизменения границ России. Особенность периода сословно-представительной\nмонархии - сочетание самой сословного представительства с яркой\nдеспотией азиатского типа характерной для Ивана-4.\n<strong>Опричнина<\/strong> - особый период его правления - террор против\nбояр и большинства простого населения, то есть период, когда все\nучреждения, мешавшие монарху, либо распускались, либо уничтожались\n(например, избранная рада). Деспотизм характерен не чуть не меньше, чем\nорганы сословного представительства.<\/p>\n<p><strong>Царь<\/strong> - сохранил функции высшего органа власти.\n<strong>Боярская дума<\/strong> - была очень основательно придушена и не\nмогла ограничивать царя. Даже в период <strong>\"семибоярщины\"<\/strong>,\nкогда бояре, опираясь на польское государство концентрировали власть в\nсвоих руках, не изменил соотношение сил. И при династии Романовых этот\nорган оставался при царе, а не над царем. Этот орган имел постоянную\nтенденцию к росту количественного состава.<\/p>\n<p><strong>Земский собор<\/strong> - в разные годы выполняли разные\nфункции. В период с 1549 до 80-х одна, до 1613 года чуть другая\n(появилась возможность избирать царя) и последний период (до 1622 года)\nхарактеризуется, как самый активный в деятельности собора. Далее до 50-х\nгодов происходит затухание их деятельности.<\/p>\n<p><em>Земские соборы на протяжении всего периода\nхарактеризовались:<\/em><\/p>\n<ul>\n<li><p>состояли из различных сословий: боярство, духовенство, дворяне,\nгородское население<\/p><\/li>\n<li><p>регламента не существовало, количество вызванных на собор\nзависело от указа царя, который писался перед каждым созывом<\/p><\/li>\n<li><p>участие в нем не считалось почетной обязанностью, а было скорее\nнеобходимостью, которая многих тяготила, так как материальных стимулов\nне было<\/p><\/li>\n<\/ul>\n<p>Функции Земского собора: внешняя политика, налоги. после 80-х XV века\nизбирали царя (так избранными были Борис Годунов, Василий Шуйский,\nМихаил Романов избранный в 1613 году), принятие законов, также их\nобсуждение. Например, Соборное Уложение 1649 года фактически было\nпринято на соборе. Но Земский собор не был законодательным органом.<\/p>\n<p>Взаимоотношение царей и собора было различено. В 1566 году многих из\nЗемского собора, выступивших против опричнины Иван-4 казнил. В XVII\nвеке, в период смуты, роль соборов сильно выросла, так как нужно было\nукреплять государство, но позднее с возрождением монархии, они сходят не\nнет.<\/p>\n<p>Сословные органы самоуправления: <strong>губные избы<\/strong>. Начали\nсоздаваться в 30-е годы правления Ивана Грозного. Возникли в противовес\nсращиванию аппарата государства с разбойниками, то есть функции борьбы с\nразбойниками передали самому населению<\/p>\n<p><strong>Земские избы<\/strong> - первоначально собирали налоги, а\nпозднее стали решать и судебные задачи<\/p>\n<p><strong>Судебник 1550 года<\/strong> - царский судебник, который был\nиздан Иваном-4. Он в значительной мере повторяет судебник 1497 года, но\nболее расширен и точен. Это первый сборник законов, разбитый на статьи\n(количеством около 100).<\/p>\n<p>После принятия судебника право продолжало развиваться. Стала вестись\nопределенная кодификационная работа, которая заключалась в том, что\nначались вести приказные книги. В этих книгах каждый приказ записывал\nвсе распоряжения и приказы царя относящееся к сфере их деятельности.<\/p>\n<p><strong>Уложение 1649 года<\/strong>. В 1648 - городское восстание в\nМоскве, создавшее угрозу жизни царя. Тогда многое зависело от\nдворянства, которое поддержало восстание. Они выдвинули ему свои\nпретензии царю, в которых говорилось, что причина восстания - отсутствие\nнормального законодательства. В результате была создана комиссия,\nкоторая и создала уложение. Потом оно обсуждалось на Земском соборе, где\nбыло единогласно принять в январе 1649 года. Это было первое уложение,\nизданное типографским способом, и оно впервые поступило в продажу.\nУложение делилось на 25 глав и содержало уже около 1000 статей. Это\nуложение будет оставаться действующим до второй четверти XIX века (с\nпоправками).<\/p>\n", "t": " сословно-представительная монархия — форма правления, предусматривающая участие сословных представителей в управлении государством, составлении законов. она складывается в условиях политической централизации. различные сословия были представлены в органах власти неравномерно. в xv веке в условиях самодержавия возникла сословно-представительная монархия . началом, условно, этого периода считается созыв первого русского собора 1549 года. на этот же период приходится принятие 2-х важнейших законодательных актов: 1)судебника 1550 года 2)сборник церковного законодательства 1551 года концом сословно-представительной монархии считается время правления алексея михайловича, когда он перестает собирать земский собор (вторая половина xvii века). последний собор был созван в 1653 году по поводу изменения границ россии. особенность периода сословно-представительной монархии - сочетание самой сословного представительства с яркой деспотией азиатского типа характерной для ивана-4. опричнина - особый период его правления - террор против бояр и большинства простого населения, то есть период, когда все учреждения, мешавшие монарху, либо распускались, либо уничтожались (например, избранная рада). деспотизм характерен не чуть не меньше, чем органы сословного представительства. царь - сохранил функ ы:<\/li>\n<\/ul>\n<p><strong>Процессуальное право <\/strong>регулировалось Судебником\nподробно. Процесс – состязательный с элементами инквизиционного.\nПоявляются в качестве средств доказывания пытки (например, по делам о\nтатьбе) и письменное ведение протокола судебного заседания.<\/p>\n<p>Суд осуществлялся с участием «лучших людей», которые входили в состав\nсуда вместе с великокняжеским (царским) наместником (аналог современного\nсуда присяжных).<\/p>\n<p>Процесс и процессуальные действия платные, за счет истца.<\/p>\n<p>Процесс в целом Судебник перенял из Псковской Судной Грамоты.<\/p>\n<p>Появилась вышестоящая (вторая) судебная инстанция – Боярская дума и\nВеликий князь (царь).<\/p>\n<p><strong>Материальное право<\/strong> по Судебнику касалось вещных,\nнаследственных прав, договоров, перехода крестьян, холопства. Судебник\nдопускал применение норм обычного права.<\/p>\n<p><strong>Гражданское право. <\/strong>Судебник 1497 г. устанавливает\nпорядок перехода крестьян в Юрьев день и в течение недели до и после\nэтого дня, переход возможен после оплаты пожилого.<\/p>\n<p>По Судебнику 1497 г. появляется <strong>городское<\/strong>\n<strong>ключничество<\/strong> – новый источник холопства.<\/p>\n<p>Холоп получал освобождение в случае побега из татарского плена.<\/p>\n<p>Судебник дублирует <strong>договорное право<\/strong> Псковской Судной\nГрамоты, но расширяет применение договора личного найма, а купля-продажа\nдолжна совершаться теперь только при свидетелях.<\/p>\n<p>В Судебнике 1497 г. регулировалось банкротство.<\/p>\n<p><em>По Судебнику выделялись следующие виды наследования:<\/em><\/p>\n<ol type=\"1\">\n<li><p>по закону;<\/p><\/li>\n<li><p>по завещанию («рукописанию»).<\/p><\/li>\n<\/ol>\n<p><strong>Уголовное право<\/strong>. Преступление стало пониматься как\n«лихо дело» (это тяжкие преступления, отнесенные к ведению Великого\nкнязя).<\/p>\n<p>Судебник 1497 г. расширил число преступлений новыми составами:<\/p>\n<ol type=\"1\">\n<li><p><strong>крамола<\/strong> (государственное преступление);<\/p><\/li>\n<li><p><strong>подым<\/strong> (антиправительственная агитация);<\/p><\/li>\n<li><p><strong>поджог с целью причинения большого ущерба<\/strong>\n(террористический акт);<\/p><\/li>\n<li><p><strong>головная татьба<\/strong> (кража холопов, кража людей\nвообще или кража, приведшая к убийству).<\/p><\/li>\n<\/ol>\n<p>Судебник вводит новые наказания, теперь <strong>уголовное\nзаконодательство<\/strong> стало карательным. Применяются смертная казнь,\nторговая казнь (битье палками на торговой площади), штраф уходит в\nпрошлое.<\/p>\n", "t": " судебник 1497 г. издан в период правления великого князя московского ивана iii. его проект подготовлен дьяком владимиром гусевым (по ошибке считается автором судебника). автор- князь иван патрикеев. источники судебника: уставные грамоты местного управления- нормативные документы, издаваемые по вопросам местного самоуправления псковская судная грамота; обычаи, единичные случаи (прецеденты), судебная практика; русская правда. основные правовые институты: процессуальное право регулировалось судебником подробно. процесс – состязательный с элементами инквизиционного. появляются в качестве средств доказывания пытки (например, по делам о татьбе) и письменное ведение протокола судебного заседания. суд осуществлялся с участием «лучших людей», которые входили в состав суда вместе с великокняжеским (царским) наместником (аналог современного суда присяжных). процесс и процессуальные действия платные, за счет истца. процесс в целом судебник перенял из псковской судной грамоты. появилась вышестоящая (вторая) судебная инстанция – боярская дума и великий князь (царь). материальное право по судебнику касалось вещных, наследственных прав, договоров, перехода крестьян, холопства. судебник допускал применение норм обычного права. гражданское право. судебник 1497 г. устанавливает порядок перехода крестьян в юрьев день и в течение недели до и после этого дня, переход возможен после оплаты пожилого. по судебн нал три вида приговоров: <\/em>обвинительный, оправдательный, оставление\nв подозрении при недостаточности улик для осуждения (не действовало\nправило о толковании сомнений в пользу обвиняемого).<\/p>\n<p><strong>Состязательный процесс<\/strong> – строится на началах\nравенства сторон в суде и разделения функций между обвинением, защитой и\nсудом. <strong>Уголовный процесс<\/strong> – это происходящий в суде спор\nмежду государством и гражданином по вопросу вины последнего. Суду в\nданном случае отводится роль арбитра, наблюдающего за тем, как\nсоблюдаются правила ведения спора, и кто его выиграл.<\/p>\n<p>Состязательная форма применялась по делам о мелких преступлениях и\nгражданским делам. В качестве <em>доказательств выступали<\/em>:\nсобственное признание, присяга, свидетельские показания, письменные\nдокументы.<\/p>\n<p>Состязательный процесс строится на началах процессуального разделения\nфункций обвинения, защиты и разрешения дела. Обвиняемый является\nневиновным до тех пор, пока вина его не будет установлена вступившим в\nзаконную силу приговором суда. При этом обвиняемый не доказывает свою\nневиновность (он имеет право на молчание), а обязанность доказывания\nвины обвиняемого лежит на обвинителе, который несет «бремя» доказывания,\nпоэтому, если представленные им доказательства не приведут суд к\nубеждению в виновности, обвиняемый должен быть оправдан. Отказ\nобвинителя от обвинения обязывает суд оправдать подсудимого.<\/p>\n<p><strong>Розыск <\/strong>применялся по государственным и другим тяжким\nпреступлениям. Дело начиналось по инициативе государственного органа или\nдолжностного лица. Главными доказательствами были поимка с поличным,\nобыск и собственное признание. Судоговорение не велось, основными\nформами розыскного процесса были допросы, очные ставки и пытки.<\/p>\n<p>Состязательный процесс начинался обычно по жалобе истца, розыскной –\nпо инициативе государства.<\/p>\n<p>Во второй половине XVI в. при Иване IV судебные поединки полностью\nисчезают из судебной практики. Власть в любых случаях сама стремилась\nвынести приговор.<\/p>\n", "t": " розыскной (инквизиционный) процесс характеризовался активной ролью государства. признаки: слияние функций следователя, обвинителя и судьи, отсутствие гласности и состязательности, отсутствие прав у обвиняемого, применение пыток как метода получения доказательств, использование формальных доказательств (признание вины – «царица доказательств»). этот процесс распадался на: а) розыск, следствие б) суд. права личности не были защищены. обвиняемый был бесправным объектом в руках следователя и не всегда знал, в чем именно его обвиняют. действовала теория формальных доказательств. решающее значение для осуждения имело признание подсудимым своей вины, полученное в результате пыток, что означало установление истины по делу. розыскной процесс знал три вида приговоров: обвинительный, оправдательный, оставление в подозрении при недостаточности улик для осуждения (не действовало правило о толковании сомнений в пользу обвиняемого). состязательный процесс – строится на началах равенства сторон в суде и разделения функций между обвинением, защитой и судом. уголовный процесс – это происходящий в суде спор между государством и гражданином по вопросу вины последнего. суду в данном случае отводится роль арбитра, наблюдающего за тем, как соблюдаются правила ведения спора, и кто его выиграл. состязательная форма применялась по делам о мелких преступлениях и гражданским делам. в качестве доказательств выступали : собственное признание, присяга, свидетельские показания, письменные документы. состязательный процесс строится на началах процессуального разделения функций обвинения, защиты и разрешения дела. обвиняемый является невиновным до тех пор, пока вина его не будет установлена вступившим в законную силу приговором суда. при этом обвиняемый не доказывает свою невиновность (он имеет право на молчание), а обязанность доказывания вины обвиняемого лежит на обвинителе, который несет «бремя» доказывания, поэтому, если представленные им доказательства не приведут суд к убеждению в виновности, обвиняемый должен быть оправдан. отказ обвинителя от обвинения обязывает суд оправдать подсудимого. розыск применялся по государственным и другим тяжким преступлениям. дело начиналось по инициативе государственного органа или должностного лица. главными доказательствами были поимка с поличным, обыск и собственное признание. судоговорение не велось, основными формами розыскного процесса были допросы, очные ставки и пытки. состязательный процесс начинался обычно по жалобе истца, розыскной – по инициативе государства. во второй половине xvi в. при иване iv судебные поединки полностью исчезают из судебной практики. власть в любых случаях сама стремилась вынести приговор. "}, {"n": "Соборное Уложение 1649 г.: источники, структура, основные институты права.", "h": "<p><strong>Соборное уложение 1649 года<\/strong> - первый в русской\nистории нормативно-правовой акт, охвативший все действующие правовые\nнормы.<\/p>\n<p>Соборное уложение было принято на Земском соборе 1649 года.<\/p>\n<p>Источники:<\/p>\n<p>1)<strong>Указные книги приказов<\/strong> — в них с момента\nвозникновения того или иного приказа фиксировалось текущее\nзаконодательство по конкретным вопросам.<\/p>\n<p>2)<strong>Кормчая книга <\/strong>(византийские акты)<\/p>\n<p>3)<strong>Челобитные-письменные прошения, жалобы<\/strong><\/p>\n<p>4)<strong>Судебник 1497 г., Судебник 1550г. <\/strong><\/p>\n<p>5)<strong>Литовский статут 1588г<\/strong>. - был использован в\nкачестве образца юридической техники.<\/p>\n<p>6)<strong>ПСГ<\/strong><\/p>\n<p>Структура (СУ на главы и статьи разделили авторы) состоит из 25 глав\nи 967 статей:<\/p>\n<p><em>Возможно разбить все главы «Уложения» на пять групп по отделам\nправа: <\/em><\/p>\n<p>1)<strong>главы I-IX<\/strong> - государственное право;<\/p>\n<p>2)<strong>X (полностью сделана на основе уставной/указной\nкниги)-XIV<\/strong>- устав судоустройства и судопроизводства;<\/p>\n<p>3)<strong>главы XV-XX<\/strong> -- вещное право;<\/p>\n<p>4)<strong>главы XXI-XXII<\/strong> -- уголовное уложение;<\/p>\n<p>5)<strong>главы XXIII-XXV<\/strong> -- добавочная часть: о стрельцах,\nо казаках, о корчмах.<\/p>\n<p>Отрасли:<\/p>\n<p>Закреплялся статус главы государства — царя как самодержавного и\nнаследного монарха.<\/p>\n<ol type=\"1\">\n<li><strong>Уголовное право<\/strong> - появились новые виды\nпреступлений: преступление против церкви, преступление против\nгосударства, преступление против порядка управления (самовольный выезд\nиз страны), преступление против благочиния (содержание притонов),\nдолжностные преступления, преступления против личности, имущественные\nпреступления, преступления против нравственности. Новые виды наказаний:\nсмертная казнь, ссылка, тюремное заключение, конфискация имущества,\nштраф, бесчестящее наказание.<\/li>\n<\/ol>\n<p><strong>Субъектами преступления<\/strong> могли быть отдельные лица\nили группа лиц независимо от их сословной принадлежности. В случае\nсовершения преступления группой лиц закон разделял их на главных и\nвторостепенных (соучастников).<\/p>\n<p><strong>Субъективная сторона преступления<\/strong> определялась\nстепенью вины. По Уложению преступления разделялись на Умышленные,\nнеосторожные и случайные.<\/p>\n<p>При характеристике <strong>объективной стороны преступления<\/strong>\nзакон устанавливал смягчающие и отягчающие обстоятельства. К первым\nпринадлежали следующие: состояние опьянения, неконтролируемость\nдействий, вызванная оскорблением или угрозой (аффект). Ко второй группе\nотносились: повторность преступления, совокупность нескольких\nпреступлений, размеры вреда, особый статус объекта и предмета\nпреступления.<\/p>\n<p><strong>Объектами преступления<\/strong> в соответствии с Соборным\nуложением являлись: церковь, государство, семья, личность, имущество и\nнравственность.<\/p>\n<p>*Наказания**:* смертная казнь, телесные наказания, тюремное\nзаключение, ссылка, бесчестящие наказания, конфискация имущества,\nотстранение от должности, штрафы. Целями наказания были устрашение,\nвозмездие и изоляция преступника от общества.<\/p>\n<ol start=\"2\" type=\"1\">\n<li><p><strong>Гражданское право<\/strong> - Субъектами гражданского\nправа являлись как физические (частные) лица, так и коллективы\n(например, крестьянская община). По сравнению с предыдущим периодом\nвозросла правоспособность женщины. Так, вдова наделялась комплексом\nправомочий в области заключения сделок. Обязательственное право в XVII\nвеке продолжало развиваться по линии постепенной замены личной\nответственности (переход за долги в холопы и т. д.) по договорам\nимущественной ответственностью.<\/p><\/li>\n<li><p><strong>Семейное право<\/strong>. Законную силу имел только\n<strong>церковный брак<\/strong>. Допускалось заключение одним лицом не\nболее трех брачных союзов в течение всей жизни. Брачный возраст\nустанавливался для мужчин в 15 лет, для женщин — в 12 лет. Для\nзаключения брака требовалось согласие родителей.<\/p><\/li>\n<\/ol>\n<p>В соответствии с принципами домостроя устанавливалась власть мужа над\nженой, отца над детьми. Юридический статус мужа определял статус жены:\nвышедшая замуж за дворянина становилась дворянкой, вышедшая за холопа —\nхолопкой. Жена была обязана следовать за мужем на поселение, в изгнание,\nпри переезде.<\/p>\n<p>Закон определял статус незаконнорожденных детей. Лица этой категории\nне могли усыновляться, а также принимать участие в наследовании\nнедвижимого имущества.<\/p>\n<p><em>Расторжение брака допускалось в следующих случаях:<\/em> уход\nодного из супругов в монастырь, обвинение супруга в антигосударственной\nдеятельности, неспособность жены к деторождению.<\/p>\n<ol start=\"4\" type=\"1\">\n<li><strong>Обязательственное право<\/strong>. Известны договоры\nкупли-продажи, мены, дарения, хранения, поклажи, найма имущества и др. В\nУложении нашли отражение и формы заключения договоров.\nРегламентировались случаи заключения договоров в письменной форме, для\nнекоторых видов сделок (например, отчуждение недвижимости)\nустанавливалась крепостная форма, требовавшая «рукоположительства»\nсвидетелей и регистрации в Приказной избе.<\/li>\n<\/ol>\n<p>СУ устанавливало порядок признания договора недействительным.\nДоговоры признавались недействительными в случае их заключения в\nсостоянии опьянения, с применением насилия или путем обмана.<\/p>\n<ol start=\"5\" type=\"1\">\n<li><strong>Наследственное право<\/strong>. Известно наследование по\nзакону и по завещанию. Завещание оформлялось в письменной форме,\nподтверждалось свидетелями и представителем церкви. Воля завещателя\nограничивалась сословными принципами: завещательные распоряжения могли\nкасаться только купленных вотчин; родовые и выслуженные вотчины\nпереходили к наследникам по закону. В круг наследников по закону входили\nдети, переживший супруг, в некоторых случаях и другие родственники.<\/li>\n<\/ol>\n<p><em>Значение: <\/em><\/p>\n<p>1)Соборное Уложение обобщило и подытожило основные тенденции в\nразвитии русского права ХV - XVII веков.<\/p>\n<p>2)Оно закрепило новые черты и институты, свойственные новой эпохе,\nэпохе наступающего российского абсолютизма.<\/p>\n<p>3)В Уложении впервые была осуществлена систематизация отечественного\nзаконодательства; была сделана попытка разграничения норм права по\nотраслям.<\/p>\n", "t": " соборное уложение 1649 года - первый в русской истории нормативно-правовой акт, охвативший все действующие правовые нормы. соборное уложение было принято на земском соборе 1649 года. источники: 1) указные книги приказов — в них с момента возникновения того или иного приказа фиксировалось текущее законодательство по конкретным вопросам. 2) кормчая книга (византийские акты) 3) челобитные-письменные прошения, жалобы 4) судебник 1497 г., судебник 1550г. 5) литовский статут 1588г . - был использован в качестве образца юридической техники. 6) псг структура (су на главы и статьи разделили авторы) состоит из 25 глав и 967 статей: возможно разбить все главы « тем обмана. наследственное право . известно наследование по закону и по завещанию. завещание оформлялось в письменной форме, подтверждалось свидетелями и представителем церкви. воля завещателя ограничивалась сословными принципами: завещательные распоряжения могли касаться только купленных вотчин; родовые и выслуженные вотчины переходили к наследникам по закону. в круг наследников по закону входили дети, переживший супруг, в некоторых случаях и другие родственники. значение: 1)соборное уложение обобщило и подытожило основные тенденции в развитии русского права хv - xvii веков. 2)оно закрепило новые черты и институты, свойственные новой эпохе, эпохе наступающего российского абсолютизма. 3)в уложении впервые была осуществлена систематизация отечественного законодательства; была сделана попытка разграничения норм права по отраслям. "}, {"n": "Правовой режим вотчин и поместий в русском законодательстве XV-XVIII вв.", "h": "<p>Основными видами феодального землевладения в России в XVII в. были\n<strong>вотчина<\/strong> и <strong>поместье<\/strong>.<\/p>\n<p><strong>Вотчина<\/strong> – безусловное наследственное землевладение\n(княжеское, боярское, монастырское). Вотчины фактически были в свободном\nгражданском обороте земли. Вотчины по субъектам делились на дворцовые,\nгосударственные, церковные и частновладельческие, а по способу\nприобретения – на родовые, выслуженные (жалованные) и купленные (здесь\nсубъектом собственности выступала семья – муж и жена).<\/p>\n<p>Чаще всего круг правомочий жалованного вотчинника определялся в\nжалованной грамоте, которая являлась и формальным подтверждением его\nзаконных прав на имущество. По сути, купленная вотчина по правовому\nстатусу приравнивалась к выслуженной.<\/p>\n<p>С XV в. широко распространяются <strong>поместья<\/strong> т. е.\nусловные (даваемые за гос. службу) землевладения.<\/p>\n<p>Особым образом рассчитывался поместный оклад, определявшийся прежде\nвсего объемом возложенных на помещика гос. обязанностей. Объектом\nпоместного землевладения являлись не только пахотные земли, но и рыбные,\nохотничьи угодья, городские дворы и т. п.<\/p>\n<p>Первоначально обязательным условием пользования поместьем была\nреальная служба, начинавшаяся для дворян с 15-летнего возраста.\nПоступивший на службу сын помещика «припускался» к пользованию землей,\nно при отставке отца поместье поступало к нему же на оброк вплоть до его\nсовершеннолетия. С сер. XVI в. этот порядок изменился – поместье\nоставалось в пользовании отставника-помещика до тех пор, пока его\nсыновья не достигали нужного возраста; вместе с тем к наследованию\nпоместья стали допускаться и родственники по боковой линии. Женщины не\nучаствовали в наследовании поместий. Они наделялись землей только в\nформе пенсионных выплат.<\/p>\n", "t": " основными видами феодального землевладения в россии в xvii в. были вотчина и поместье . вотчина – безусловное наследственное землевладение (княжеское, боярское, монастырское). вотчины фактически были в свободном гражданском обороте земли. вотчины по субъектам делились на дворцовые, государственные, церковные и частновладельческие, а по способу приобретения – на родовые, выслуженные (жалованные) и купленные (здесь субъектом собственности выступала семья – муж и жена). чаще всего круг правомочий жалованного вотчинника определялся в жалованной грамоте, которая являлась и формальным подтверждением его законных прав на имущество. по сути, купленная вотчина по правовому статусу приравнивалась к выслуженной. с xv в. широко распространяются поместья т. е. условные (даваемые за гос. службу) землевладения. особым образом рассчитывался поместный оклад, определявшийся прежде всего объемом возложенных на помещика гос. обязанностей. объектом поместного землевладения являлись не только пахотные земли, но и рыбные, охотничьи угодья, городские дворы и т. п. первоначально обязательным условием пользования поместьем была реальная служба, начинавшаяся для дворян с 15-летнего возраста. поступивший на службу сын помещика «припускался» к пользованию землей, но при отставке отца поместье поступало к нему же на оброк вплоть до его совершеннолетия. с сер. xvi в. этот порядок изменился – поместье оставалось в пользовании отставника-помещика до тех пор, пока его сыновья не достигали нужного возраста; вместе с тем к наследованию поместья стали допускаться и родственники по боковой линии. женщины не участвовали в наследовании поместий. они наделялись землей только в форме пенсионных выплат. "}, {"n": "Oсновные этапы закрепощения крестьян на Руси.", "h": "<p><strong>1)Первый этап (конец XV- конец VXI вв.)- Юрьев\nдень<\/strong><\/p>\n<p>Из-за роста городских повинностей крестьяне все чаще уходят от\nпомещиков на другие земли. Власть государя еще не настолько велика,\nчтобы вводить жесткие запреты. Но необходимость сохранения лояльности\nдворянства требует мер. Поэтому в 1473 году Иван 3 издает судебник,\nсогласно которому уход от помещика теперь возможен только после\nокончания паханных работ, 26 ноября, в течение недели до Юрьева дня и\nнедели после, при условии выплаты «пожилого»<\/p>\n<p>В 1581 году на фоне тяжелых разорений страны царь Иван 4 Грозный\nиздает Указ о ведении «заповедных лет», временно запрещающий крестьянам\nуходить даже в Юрьев день.<\/p>\n<p><strong>Второй этап (конец XVI в. 1649 г.) Соборное\nуложение.<\/strong><\/p>\n<p>В эпоху смутного времени удержать крестьян от бегства становится все\nтруднее. В 1597 году издается указ о введении пятилетнего срока сыска\nбеглых крестьян. В последующие годы срок <strong>«урочных лет»<\/strong>\nувеличивается. В обязанности местных администраций входит сыск беглых и\nдознание, которому подвергаются все пришлые крестьяне. Соборное уложение\n1649 года окончательно признают крестьян собственностью землевладельцев.\nКрепостнический статус утверждается как наследственный- дети отца-\nкрепостного и свободные люди, вступающие в брак с крепостными, также\nстановится крепостными. «Урочные лета», объявленные Иваном грозным\nотменяются: в силу вступает указ об бессрочном сыске беглых.<\/p>\n<p><strong>Третий этап (середина XVII- конец XVIII вв.) полное\nукрепление крепостничества.<\/strong><\/p>\n<p>Самый тяжелый этап закрепощения крестьян. Помещики получают полное\nправо распоряжаться крепостными: продавать, подвергать телесным\nнаказанием (нередко приводящим к гибели крестьян), без суда ссылать на\nкаторгу или в Сибирь. К этому времени крепостные фактически ничем не\nотличаются от чернокожих рабов на плантациях Нового света.<\/p>\n<p><strong>Четвёртый этап (конец XVIII в. 1861 г.) разложенное и отмена\nкрепостного права.<\/strong><\/p>\n<p>К началу этого периода становится все более очевидной упорядоченность\nкрепостнической системы. Развитие либеральных идей среди дворянства\nприводит к формированию негативного отношения передовой его части к\nявлению крепостничества. Понимание неэффективности позорности самого\nявления крепостной зависимости постепенно укрепляется и на самом верху.\nПопытки изменить существующее положение предпринимает Павел 1 затем\nАлександр 1. Но лишь спустя полвека Александр второй издает манифест,\nдающий крепостным право распоряжаться своей свободы, по своему\nусмотрению менять виды деятельности и переходить в другие сословия.<\/p>\n", "t": " 1)первый этап (конец xv- конец vxi вв.)- юрьев день из-за роста городских повинностей крестьяне все чаще уходят от помещиков на другие земли. власть государя еще не настолько велика, чтобы вводить жесткие запреты. но необходимость сохранения лояльности дворянства требует мер. поэтому в 1473 году иван 3 издает судебник, согласно которому уход от помещика теперь возможен только после окончания паханных работ, 26 ноября, в течение недели до юрьева дня и недели после, при условии выплаты «пожилого» в 1581 году на фоне тяжелых разорений страны царь иван 4 грозный издает указ о ведении «заповедных лет», временно запрещающий крестьянам уходить даже в юрьев день. второй этап (конец xvi в. 1649 г.) соборное уложение. в эпоху смутного времени удержать крестьян от бегства становится все труднее. в 1597 году издается указ о введении пятилетнего срока сыска беглых крестьян. в последующие годы срок «урочных лет» увеличивается. в обязанности местных администраций входит сыск беглых и дознание, которому подвергаются все пришлые крестьяне. соборное уложение 1649 года окончательно признают крестьян собственностью землевладельцев. крепостнический статус утверждается как наследственный- дети отца- крепостного и свободные люди, вступающие в брак с крепостными, также становится крепостными. «урочные лета», объявленные иваном грозным отменяются: в силу вступает указ об бессрочном сыске беглых. третий этап (середина xvii- конец xviii вв.) полное укрепление крепостничества. самый тяжелый этап закрепощения крестьян. помещики получают полное право распоряжаться крепостными: продавать, подвергать телесным наказанием (нередко приводящим к гибели крестьян), без суда ссылать на каторгу или в сибирь. к этому времени крепостные фактически ничем не отличаются от чернокожих рабов на плантациях нового света. четвёртый этап (конец xviii в. 1861 г.) разложенное и отмена крепостного права. к началу этого периода становится все более очевидной упорядоченность крепостнической системы. развитие либеральных идей среди дворянства приводит к формированию негативного отношения передовой его части к явлению крепостничества. понимание неэффективности позорности самого явления крепостной зависимости постепенно укрепляется и на самом верху. попытки изменить существующее положение предпринимает павел 1 затем александр 1. но лишь спустя полвека александр второй издает манифест, дающий крепостным право распоряжаться своей свободы, по своему усмотрению менять виды деятельности и переходить в другие сословия. "}, {"n": "Местничество и кормление как принципы организации государственной службы в Русском государстве.", "h": "<p><strong>Местничество<\/strong> — в средневековой Руси: порядок\nраспределения служебных мест с учётом происхождения и служебного\nположения предков лица. Местничество было отменено приговором Земского\nСобора 1682г. Формирование государственного аппарата с конца XV века\nосуществлялось по принципу местничества, в значительной степени\nвоспринятому из польско-литовского законодательства.<\/p>\n<p>Система местничества была основана на критериях знатности\nпроисхождения (чем выше стояли предки претендента, тем более высокий\nпост в государственной иерархии он мог занять). Эта практика превращала\nбоярство в замкнутую корпорацию, подменяла общесоциальные интересы\nсословными. В 1682 году система местничества была отменена приговором\nЗемского Собора, как являющая собой пережиток прошлого (это объективно\nспособствовало усилению позиций дворянства).<\/p>\n<p><strong>Кормле́ние<\/strong> — вид пожалования великих и удельных\nкнязей своим должностным лицам, по которому княжеская администрация\nсодержалась за счёт местного населения в течение периода службы.<\/p>\n<p>Первоначально кормление носило эпизодический характер. В соответствии\nс нормами Русской правды, сборщики штрафа (виры), строители городов и\nнекоторые другие категории получали с населения определённое натуральное\nдовольствие. В XII-XIV веках кормление сыграло значительную роль в\nскладывании системы местного управления. Князья посылали в города и\nволости бояр в качестве наместников и волостелей, а других служилых\nлюдей — типунами. Население обязывалось содержать их («кормить») в\nтечение всего периода службы. Наместники, волостели и другие\nпредставители местной княжеской администрации получали «корм» обычно 3\nраза в году — на Рождество, Пасху и Петров день. При вступлении\nкормленщика в должность население платило ему «въезжий корм». «Корм»\nдавался натурой: хлебом, мясом, сыром и т. д.; для лошадей кормленщиков\nпоставлялись овёс, сено. Кроме того, кормленщики собирали в свою пользу\nразличные пошлины: судебные, за клеймение («пятнание») и продажу\nлошадей, «полавочное», мыт и другие. За счёт этих сборов они жили и\nсодержали свою челядь. Наибольшего развития система кормлений достигла в\nXIV—XV веках.<\/p>\n<ul>\n<li><strong>Преобразование системы центральных органов управления в\nпервой четверти XVIII в<\/strong>.<\/li>\n<\/ul>\n<p>В первой четверти XVIII в. произошли многочисленные реформы высших\nорганов власти и управления. <em>Эти реформы принято подразделять на три\nэтапа:<\/em><\/p>\n<ol type=\"1\">\n<li><p><strong>1699–1710 гг.<\/strong> – частичные\nпреобразования;<\/p><\/li>\n<li><p><strong>1710–1719 гг<\/strong>. – ликвидация прежних центральных\nорганов власти и управления, создание Сената, появление новой\nстолицы;<\/p><\/li>\n<li><p><strong>1719–1725 гг.<\/strong> – образование новых органов\nотраслевого управления, проведение второй областной реформы, реформы\nцерковного управления и финансово-налоговой.<\/p><\/li>\n<\/ol>\n<p>Первостепенное значение приобрела <strong>Ближняя\nканцелярия<\/strong>, на заседании которой в 1705 г. принимали участие не\nболее 20 человек. Реальной властью обладала заседавшая в здании Ближней\nканцелярии <strong>Консилия министров<\/strong> – совет глав важнейших\nведомств при царе.<\/p>\n<p>Следующим в реформе центральных органов власти стало создание\n<strong>Сената<\/strong>, который был образован в 1711 г. Его члены\nназначались царем. В состав Сената первоначально входило всего девять\nчеловек, которые решали дела коллективно. С 1718 по 1722 гг. данный\nорган стал собранием президентов коллегий, а в 1722 г. он был\nреформирован тремя указами императора. Эта реформа превратила Сенат в\nвысший орган центрального управления, который встал над всем\nгосударственным аппаратом. В его компетенцию входили вопросы правосудия,\nрасходы казны и налоги, торговля, контроль за администрацией разных\nуровней.<\/p>\n<p>В целях надзора за деятельностью администрации при Сенате была\nучреждена должность <strong>обер-фискала<\/strong>, которому должны были\nбыть подчинены провинциал-фискалы. Доносы фискалов ежемесячно\nдокладывала Сенату <strong>Расправная палата<\/strong>, восстановленная в\n1712 г. Недовольный работой фискалов Петр I учредил при Сенате в 1715 г.\nдолжность <strong>генерального ревизора<\/strong>, или\n<strong>надзирателя указов<\/strong>. В 1722 г. руководство работой\nсенаторов было поручено генерал-прокурору П. И. Ягужинскому (1683–1738\nгг.).<\/p>\n<p>В 1718 г. с учреждением коллегий все административные функции Сената\nпереходят к коллегиям.<\/p>\n<p>Сенат стал общим собранием президентов коллегий. Это был не постоянно\nдействующий орган, а временное собрание президентов, которое собиралось\nв случае необходимости для совместного решения по какому-то делу. К\nведомству Сената относились вопросы, не регулируемые ни одной коллегией.\nИными словами, на долю Сената не оставалось практически ничего, так как\nсистема коллегий охватывала все основные области государственной\nжизни.<\/p>\n<p>Коллегиальная система предусматривала систематическое разделение\nадминистрации на определенное количество ведомств, что само по себе\nсоздавало более высокий уровень централизации. Всего к 1721 г.\nдействовало 12 коллегий: иностранная, военная, адмиралтейская,\nштатс-контор-коллегия (ведение всех госрасходов), ревизионная (контроль\nза доходами и расходами), коммерции, берг-коллегия (горное дело),\nмануфактур-коллегия (промышленность), камергерская (дворец), юстиции,\nвотчинная и камор-коллегия (налоги и сборы). Кроме того, на правах\nколлегий были <strong>главный магистрат<\/strong>, управлявший городским\nсословием, и <strong>Святейший правительствующий Синод<\/strong>.<\/p>\n<p>В 1722 г. были также учреждены должности\n<strong>рекетмейстера<\/strong> и <strong>герольдмейстера<\/strong>.\nПервый принимал и рассматривал жалобы на волокиту или несправедливые\nрешения коллегии, доносил о том Сенату, а в некоторых случаях и самому\nгосударю. Герольдмейстер заведовал всей службой дворян, а служить они\nдолжны были все (мужчины) пожизненно.<\/p>\n", "t": " местничество — в средневековой руси: порядок распределения служебных ме

<\/strong> возглавлял всю систему власти в стране,\nосуществлял объединение и координацию всех отраслей управления.\nУкрепляется тенденция, берущая начало в петровские времена.\nИгнорирование и неуважение к закону начинают трактоваться как\nпреступление.<\/p>\n<p>Носителями высшей власти в империи в этот период были Александр I и\nНиколай I.<\/p>\n<p><strong>Государственный строй<\/strong> Российской империи в годы\nправления Александра I выглядел следующим образом: император, обладавший\nвсей полнотой власти, опирался на разветвленный чиновничий аппарат;\nвысшим совещательным органом при императоре с 1801 по 1810 г. был\n<strong>Непременный совет<\/strong>. В 1810 г. Непременный совет был\nупразднен, и высшим законосовещательным органом стал Государственный\nсовет.<\/p>\n<p>Председателем Государственного совета был <strong>император<\/strong>.\nВысшим судебным органом Российской империи был <strong>Сенат<\/strong>. В\nсамом начале XIX в., в 1802 г., Сенат был объявлен верховным учреждением\nимперии и в соответствии с этим должен был контролировать деятельность\nколлегий и губернаторов, проводить ревизии деятельности местных органов\nвласти, для чего собирал и обобщал необходимые материалы, которые затем\nпередавал в случае необходимости компетентным органам. На Сенат были\nвозложены функции Конституционного суда.<\/p>\n<p>В 1-й половине XIX в. Сенат представлял собой совокупность полу\nсамостоятельных учреждений — <strong>департаментов<\/strong>. В состав\nкаждого департамента входили несколько сенаторов, назначаемых царем, а\nтакже несколько генералов. Возглавлял департамент обер-прокурор.<\/p>\n<p>В 1802 г. был издан указ об учреждении вместо коллегий\n<strong>министерств<\/strong>: Военного, Морского, иностранных дел,\nюстиции, внутренних дел, финансов, коммерции, народного просвещения.<\/p>\n<p>В 1810 г. на базе <strong>Министерства внутренних дел<\/strong> было\nсоздано <strong>Министерство полиции<\/strong>, наделенное чисто\nполицейскими полномочиями. Однако этот опыт оказался не очень удачным, и\nв 1819 г. оно было ликвидировано, а его функции переданы\n<strong>Министерству внутренних дел<\/strong>.<\/p>\n<p>Эффективной была организация <strong>Государственного\nказначейства<\/strong>, были также образованы <strong>Главное управление\nпутей сообщения<\/strong>. В 1824 г. <strong>Министерство духовных\nдел<\/strong> было ликвидировано.<\/p>\n<p>В целом образование министерств усилило централизацию\nгосударственного аппарата. Также были значительно расширены возможности\nканцелярий, возросло их влияние.<\/p>\n<p>Для решения межведомственных вопросов созывались <strong>совещания\nминистров<\/strong>. <strong>Комитет министров<\/strong> был еще одним\nвысшим законосовещательным органом Российской империи. Суть его\nдеятельности состояла в совещании царя с высшими чиновниками по\nвопросам, которые затрагивали интересы различных ведомств.<\/p>\n<p>Таким образом, функции высших центральных учреждений — Комитета\nминистров, Государственного совета и Сената — неизбежно зачастую\nпереплетались.<\/p>\n<p>В таких условиях особенное значение приобретали личностные качества\nвысших чиновников и императора.<\/p>\n<p>Важнейшим центральным органом государственного управления в России в\n1-й половине XIX в. была <strong>Собственная Его Императорского\nВеличества канцелярия<\/strong>, созданная в конце XVIII в.<\/p>\n<p>При вступлении на российский престол Николая I роль Канцелярии\nособенно усилилась. В 1826 г. было образовано <strong>первое\nотделение<\/strong>. В его задачу входил контроль за деятельностью\nминистерств и ведомств, министров и высших чиновников министерств. Оно\nзанималось назначением и увольнением высших чиновников.<\/p>\n<p>В задачу <strong>второго отделения<\/strong>, созданного в 1826 г.,\nвходили анализ и обобщение юридической практики, запись законов\nРоссийской империи.<\/p>\n<p>Важнейшим было <strong>третье отделение<\/strong>, на базе Особой\nканцелярии Министерства внутренних дел, которая ведала вопросами\nполитической и государственной безопасности. В его задачи входили\nруководство полицией, борьба с государственными преступлениями и\nпротивниками существующего режима, сектантами и раскольниками, высылка и\nразмещение ссыльных, управление тюрьмами и наблюдение за\nиностранцами.<\/p>\n<p>Сформировалась структура третьего отделения, которая с конца 20-х гг.\nвключала 8 отделов. Так, 1-й отдел организовывал сбор данных по всем\nвопросам, входящим в компетенцию 3-го отделения; 2-й отдел организовывал\nконтроль за деятельностью религиозных сект и раскольников; 3-й\nосуществлял борьбу с подделкой денег и ценных бумаг; 4-й организовывал\nнадзор над гражданами; 5-й координировал усилия по административной\nвысылке поднадзорных; 6-й осуществлял руководство за местами лишения\nсвободы; 7-й организовывал наблюдения за иностранными подданными на\nтерритории империи. Основной задачей 8-го отдела было проведение научных\nизысканий по всем вопросам, интересующим третье отделение, для чего\nсобирались и обобщались статистические и прочие материалы, готовились\nсправки и доклады.<\/p>\n<p>Канцелярию вполне можно рассматривать как высший правительственный\nорган с самыми широкими полномочиями и важнейшими функциями.<\/p>\n", "t": " россия этого периода — абсолютная монархия . император возглавлял всю систему власти в стране, осуществлял объединение и координацию всех отраслей управления. укрепляется тенденция, берущая начало в петровские времена. игнорирование и неуважение к закону начинают трактоваться как преступление. носителями высшей власти в империи в этот период были александр i и николай i. государственный строй российской империи в годы правления александра i выглядел следующим образом: император, обладавший всей полнотой власти, опирался на разветвленный чиновничий аппарат; высшим совещательным органом при императоре с 1801 по 1810 г. был непременный совет . в 1810 г. непременный совет был упразднен, и высшим законосовещательным органом стал государственный совет. председателем государственного совета был император . высшим судебным органом российской империи был сенат . в самом начале xix в., в 1802 г., сенат был объявлен верховным учреждением империи и в соответствии с этим должен был контролировать деятельность коллегий и губернаторов, проводить ревизии деятельности местных органов власти, для чего собирал и обобщал необходимые материалы, которые затем передавал в случае необходимости компетентным органам. на сенат были возложены функции конституционного суда. в 1-й половине xix в. сенат представлял собой совокупность полу самостоятельных учреждений — департаментов . в состав каждого департамента входили несколько сенаторов, назначаемых царем, а также несколько генералов. возглавлял департамент обер-прокурор. в 1802 г. был издан указ об учреждении вместо коллегий министерств : военного, морского, иностранных дел, юстиции, внутренних дел, финансов, коммерции, народного просвещения. в 1810 г. на базе министерства внутренних дел было создано министерство полиции , наделенное чисто полицейскими полномочиями. однако этот опыт оказался не очень удачным, и в 1819 г. оно было ликвидировано, а его функции переданы министерству внутренних дел . эффективной была организация государственного казначейства , были также образованы главное управление путей сообщения . в 1824 г. министерство духовных дел было ликвидировано. в целом образование министерств усилило централизацию государственного аппарата. также были значительно расширены возможности канцелярий, возросло их влияние. для решения межведомственных вопросов созывались совещания министров . комитет министров был еще одним высшим законосовещательным органом российской империи. суть его деятельности состояла в совещании царя с высшими чиновниками по вопросам, которые затрагивали интересы различных ведомств. таким образом, функции высших центральных учреждений — комитета министров, государственного совета и сената — неизбежно зачастую переплетались. в таких условиях особенное значение приобретали личностные качества высших чиновников и императора. важнейшим центральным органом государственного управления в россии в 1-й половине xix в. была собственная его императорского величества канцелярия , созданная в конце xviii в. при вступлении на российский престол николая i роль канцелярии особенно усилилась. в 1826 г. было образовано первое отделение . в его задачу входил контроль за деятельностью министерств и ведомств, министров и высших чиновников министерств. оно занималось назначением и увольнением высших чиновников. в задачу второго отделения , созданного в 1826 г., входили анализ и обобщение юридической практики, запись законов российской империи. важнейшим было третье отделение , на базе особой канцелярии министерства внутренних дел, которая ведала вопросами политической и государственной безопасности. в его задачи входили руководство полицией, борьба с государственными преступлениями и противниками существующего режима, сектантами и раскольниками, высылка и размещение ссыльных, управление тюрьмами и наблюдение за иностранцами. сформировалась структура третьего отделения, которая с конца 20-х гг. включала 8 отделов. так, 1-й отдел организовывал сбор данных по всем вопросам, входящим в компетенцию 3-го отделения; 2-й отдел организовывал контроль за деятельностью религиозных сект и раскольников; 3-й осуществлял борьбу с подделкой денег и ценных бумаг; 4-й организовывал надзор над гражданами; 5-й координировал усилия по административной высылке поднадзорных; 6-й осуществлял руководство за местами лишения свободы; 7-й организовывал наблюдения за иностранными подданными на территории империи. основной задачей 8-го отдела было проведение научных изысканий по всем вопросам, интересующим третье отделение, для чего собирались и обобщались статистические и прочие материалы, готовились справки и доклады. канцелярию вполне можно рассматривать как высший правительственный орган с самыми широкими полномочиями и важнейшими функциями. "}, {"n": "Систематизация российского законодательства во второй четверти Х1Х в.", "h": "<p>Николай I, придя к власти, поручил систематизацию российского\nзаконодательства Второму Отделению Собственной Его Императорского\nВеличества Канцелярии. Формально работу возглавлял профессор права\nБалугьянский, а фактически – Михаил Михайлович Сперанский.<\/p>\n<p><em>Сперанский разработал план:<\/em><\/p>\n<ol type=\"1\">\n<li><p>Собрать все законы, изданные после 1649 года, расположив их в\nхронологическом порядке. В результате, в 1830 году, было издано Полное\nСобрание Законов Российской Империи (ПСЗ). Законы располагались в\nхронологическом порядке с 1649 года по ноябрь 1825 года (Умер Александр\nI). Затем началась подготовка второго собрания ПСЗ, в которой вошли\nзаконы с ноября 1825 года по первое марта 1881 года (День убийства\nАлександра II). Начали издавать третье собрание ПСЗ, куда вошли законы\nсо 2 марта 1881 года. Последний том вышел в 1916 году, содержал\nзаконодательство за 1915 год.<\/p><\/li>\n<li><p>Из ПСЗ выбрать только действующие законы, собрать их по темам. В\nэто время в России ещё не существовало деления на отрасли права. Право\nделилось по древнеримской системе на публичное и частное. Однако\nэлементы отраслевого деления уже наметились. Результатом работы стал\nСвод Законов Российской Империи (СЗ) в 14 томах. Например - том 10\nназывался законы гражданские. В 1875 году был добавлен 15 том СЗ,\nсодержащий в себе нормы процессуального права.<\/p><\/li>\n<li><p>На базе ПСЗ и СЗ разработать кодексы по основным отраслям права.\nНапример – Сперанский создал проект Гражданского Уложения России. Но\nАлександр I отверг его, сославшись, что он очень похож на Гражданский\nКодекс наполеона. Но истинная причина – наличие крепостного права.\nРеально был создан и вступил в силу только один кодекс – Уголовный\nкодекс, называвшийся «Уложение о наказаниях уголовных и исправительных\n1845 года».<\/p><\/li>\n<\/ol>\n", "t": " николай i, придя к власти, поручил систематизацию российского законодательства второму отделению собственной его императорского величества канцелярии. формально работу возглавлял профессор права балугьянский, а фактически – михаил михайлович сперанский. сперанский разработал план: собрать все законы, изданные после 1649 года, расположив их в хронологическом порядке. в результате, в 1830 году, было издано полное собрание законов российской империи (псз). законы располагались в хронологическом порядке с 1649 года по ноябрь 1825 года (умер александр i). затем началась подготовка второго собрания псз, в которой вошли законы с ноября 1825 года по первое марта 1881 года (день убийства александра ii). начали издавать третье собрание псз, куда вошли законы со 2 марта 1881 года. последний том вышел в 1916 году, содержал законодательство за 1915 год. из псз выбрать только действующие законы, собрать их по темам. в это время в россии ещё не существовало деления на отрасли права. право делилось по древнеримской системе на публичное и частное. однако элементы отраслевого деления уже наметились. результатом работы стал свод законов российской империи (сз) в 14 томах. например - том 10 назывался законы гражданские. в 1875 году был добавлен 15 том сз, содержащий в себе нормы процессуального права. на базе псз и сз разработать кодексы по основным отраслям права. например – сперанский создал проект гражданского уложения россии. но александр i отверг его, сославшись, что он очень похож на гражданский кодекс наполеона. но истинная причина – наличие крепостного права. реально был создан и вступил в силу только один кодекс – уголовный кодекс, называвшийся «уложение о наказаниях уголовных и исправительных 1845 года». "}]</script>
<script>
const Q=JSON.parse(document.getElementById('d').textContent);
const S={cur:0,st:{},recall:false,view:'read',q:'',ci:0,show:false};
try{const o=JSON.parse(localStorage.getItem('igpr')||'{}');['cur','st','recall'].forEach(k=>{if(o[k]!==undefined)S[k]=o[k]})}catch(e){}
const save=()=>{try{localStorage.setItem('igpr',JSON.stringify({cur:S.cur,st:S.st,recall:S.recall}))}catch(e){}};
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function list(){
  const q=S.q.trim().toLowerCase();
  $('ls').innerHTML=Q.map((x,i)=>(!q||x.n.toLowerCase().includes(q)||x.t.includes(q))?
    `<a data-i="${i}" class="${i===S.cur&&S.view==='read'?'cur':''}"><b>${i+1}</b><s class="${S.st[i]||''}"></s><span>${esc(x.n)}</span></a>`:'').join('')||'<p>Ничего не найдено</p>';
  const ok=Object.values(S.st).filter(v=>v==='ok').length;
  $('pb').style.width=ok/Q.length*100+'%';
  $('vr').classList.toggle('on',S.view==='read');$('vc').classList.toggle('on',S.view==='cards');
  $('rc').classList.toggle('on',S.recall);$('rc').textContent=S.recall?'Показать термины':'Скрыть термины';
}
function cloze(el){el.querySelectorAll('strong').forEach(s=>{s.classList.add('cz');s.onclick=()=>s.classList.toggle('open')})}
function mark(i,v){S.st[i]=v;save();}
function read(){
  const x=Q[S.cur],i=S.cur;
  $('mi').innerHTML=`<article><h2>${i+1}. ${esc(x.n)}</h2>${S.recall?'<p class="hint">Режим запоминания: нажимайте на скрытые термины, чтобы проверить себя.</p>':''}<div id="bd">${x.h}</div>
  <div class="act"><button class="btn" id="pv">← Назад</button><button class="btn" id="nx">Далее →</button><span class="sp"></span>
  <button class="btn rp" id="rp">Повторить</button><button class="btn ok" id="ok">Выучил ✓</button></div></article>`;
  if(S.recall)cloze($('bd'));
  $('pv').onclick=()=>go(i-1);$('nx').onclick=()=>go(i+1);
  $('ok').onclick=()=>{mark(i,'ok');go(i+1)};$('rp').onclick=()=>{mark(i,'rep');go(i+1)};
}
function go(i){S.cur=Math.max(0,Math.min(Q.length-1,i));S.view='read';save();render();scrollTo(0,0)}
function cards(){
  const qu=Q.map((_,i)=>i).filter(i=>S.st[i]!=='ok');
  if(!qu.length){$('mi').innerHTML='<article class="card"><h2>Все вопросы выучены 🎉</h2><p>Сбросьте отметки в списке, чтобы начать заново.</p><button class="btn pri" id="rs">Сбросить прогресс</button></article>';
    $('rs').onclick=()=>{S.st={};save();render()};return}
  const i=qu[S.ci%qu.length],x=Q[i];
  $('mi').innerHTML=`<article class="card"><p class="hint">Осталось: ${qu.length} из ${Q.length}. Вспомните ответ, затем проверьте себя.</p><h2>${i+1}. ${esc(x.n)}</h2>
  ${S.show?`<div style="text-align:left">${x.h}</div><div class="act"><span class="sp"></span><button class="btn rp" id="rp">Повторить</button><button class="btn ok" id="ok">Знаю ✓</button></div>`:'<button class="btn pri" id="sh">Показать ответ</button>'}</article>`;
  if(S.show){$('ok').onclick=()=>{mark(i,'ok');S.show=false;render();scrollTo(0,0)};$('rp').onclick=()=>{mark(i,'rep');S.ci++;S.show=false;render();scrollTo(0,0)}}
  else $('sh').onclick=()=>{S.show=true;render()};
}
function render(){list();S.view==='read'?read():cards()}
$('ls').onclick=e=>{const a=e.target.closest('a');if(a){go(+a.dataset.i);$('nv').classList.remove('open')}};
$('sq').oninput=e=>{S.q=e.target.value;list()};
$('vr').onclick=()=>{S.view='read';render()};
$('vc').onclick=()=>{S.view='cards';S.show=false;render()};
$('rc').onclick=()=>{S.recall=!S.recall;save();render()};
$('mn').onclick=()=>$('nv').classList.toggle('open');
$('th').onclick=()=>{const r=document.documentElement,d=getComputedStyle(r).getPropertyValue('--bg').trim()==='#16171a';r.dataset.theme=d?'light':'dark'};
document.onkeydown=e=>{if(e.target.tagName==='INPUT')return;if(S.view==='read'){if(e.key==='ArrowRight')go(S.cur+1);if(e.key==='ArrowLeft')go(S.cur-1)}};
if(S.cur>=Q.length)S.cur=0;
render();
</script>
</body>

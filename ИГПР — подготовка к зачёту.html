ды<\/strong>, состоявшие из президента,\nвице-президента и 2-6 членов суда. эти суды рассматривали дела по\nдоносам фискалов, уголовные и гражданские дела города. Являлся\nапелляционной инстанцией к нижним судам. С 1720г. в этих судах\nучреждался прокурор, для надзора.<\/p>\n<p>1722г. судебная реформа упразднила <strong>нижние суды<\/strong>. В\nпровинциях учреждались провинциальные суды, которые состояли из воеводы\nи асессоров. Апелляционными судами для них были надворные суды.<\/p>\n<p>Образовывались <strong>военные суды<\/strong>. Высший -\n<strong>Генеральный кригсрехт<\/strong>, рассматривающий наиболее важные\nдела. Нижняя инстанция - <strong>полковой кригсрехт<\/strong>.<\/p>\n<p><em>Нововведения в судах XVIII в.:<\/em><\/p>\n<ol type=\"1\">\n<li><p>Коллегиальное устройство судов<\/p><\/li>\n<li><p>учреждение контроля за деятельностью судов<\/p><\/li>\n<li><p>совмещение гражданской и военной юстиции.<\/p><\/li>\n<\/ol>\n<p><em>Процесс:<\/em><\/p>\n<ol type=\"1\">\n<li><p>Формальное оповещение о начале процесса<\/p><\/li>\n<li><p>Разбирательство<\/p><\/li>\n<li><p>вынесение приговора и его исполнение<\/p><\/li>\n<\/ol>\n<p>Указ <strong>\"О Форме суда\"<\/strong> 1723г. наметил переход к\nсостязательной форме процесса.<\/p>\n", "t": " высшая судебная инстанция - монарх . неограниченная компетенция. следующая инстанция - сенат , которому подчинялась юстиц-коллегия и вся система судебных учреждений. являлся высшей апелляционной инстанцией. судебными функциями наделялись приказы и коллегии ( вотчинная - земельные споры, мануфактур-коллегия - дела членов цеха и тд.). с 1719г. страна разделена на судебные округа, в них учреждались надворные суды , состоявшие из президента, вице-президента и 2-6 членов суда. эти суды рассматривали дела по доносам фискалов, уголовные и гражданские дела города. являлся апелляционной инстанцией к нижним судам. с 1720г. в этих судах учреждался прокурор, для надзора. 1722г. судебная реформа упразднила нижние суды . в провинциях учреждались провинциальные суды, которые состояли из воеводы и асессоров. апелляционными судами для них были надворные суды. образовывались военные суды . высший - генеральный кригсрехт , рассматривающий наиболее важные дела. нижняя инстанция - полковой кригсрехт . нововведения в судах xviii в.: коллегиальное устройство судов учреждение контроля за деятельностью судов совмещение гражданской и военной юстиции. процесс: формальное оповещение о начале процесса разбирательство вынесение приговора и его исполнение указ \"о форме суда\" 1723г. наметил переход к состязательной форме процесса. "}, {"n": "Создание и развитие полиции в России.", "h": "<ul>\n<li>Создание:<\/li>\n<\/ul>\n<p>До 18 века страна не обладала регулярным полицейским органом. Чтобы\nпонять, как создавалась полиция России, нужно обратиться ко времени,\nкогда вместо нее данная деятельность называлась «благочинием». Сам\nтермин «полиция» появился еще в Древней Греции. Это был регулярный\nвоенизированный орган власти, который отвечал за сохранение\nобщественного порядка. В древнерусской государственности ту же функцию\nвыполняли помещики, наместники, дворские, мечники и так далее. По сути,\nпервым из основных этапов развития полиции России можно считать создание\nкняжеских дружин. Когда государство зарождалось, им помогали и\nобщинники.<\/p>\n<p>Затем правоохранительная функция постепенно перешла в руки\nнаместников. Они имели целый штат сотрудников. Суд осуществлялся\nтиунами, а доводчики вызывали стороны спора. Праветчики были\nответственными за исполнение решений суда.<\/p>\n<ul>\n<li>Развитие:<\/li>\n<\/ul>\n<p><strong>16 век:<\/strong><\/p>\n<p>В Москве в те времена установили, так называемые,\n<strong>рогатки<\/strong>, в которых имелась стража. Ее содержало местное\nнаселение. Весь город делился на отдельные районы, которые\nразграничивали ворота. Запрещено было ходить по улицам ночью без света.\nИоанном Васильевичем были утверждены разъезды по столице с целью\nподдержания порядка. Дела по поиску преступников в те годы вели\n<strong>губные старосты<\/strong>. До того момента губные грамоты\nвыдавали населению по их прошениям. Такие документы позволяли\nосуществлять губные дела самостоятельно. По сути, городской полицией\nбыли <strong>городничие<\/strong>. Какое-то время делами, связанными с\nпреступностью, ведали <strong>бояре<\/strong>. Но это оказалось\nнеэффективным. Тогда был введен <strong>Разбойный приказ<\/strong>.<\/p>\n<p><strong>17 век:<\/strong><\/p>\n<p>В этот период дела, которыми ведал Разбойный приказ, были отданы\n<strong>Земским приказам<\/strong>. Существовали отряды, которые следили\nза пожарной и общественной безопасностью. Вооружены они были рогатинами,\nтопорами, водоливными трубами. Служащие носили красно-зеленую\nодежду.<\/p>\n<p><strong>18 век<\/strong>:<\/p>\n<p>Петр I учредил орган <strong>Главная полиция<\/strong>. Изначально\nздесь трудилось 4 офицера, 36 нижних чинов. Этот орган выполнял функции\nпо надзору в городе. Помимо этого, именно его представители отвечали за\nмощение улиц, осушение болот, уборку мусора. В 1718 году\nгенерал-полицмейстером стал Девиер. Он начал командовать одним армейским\nполком, а также полицмейстерской канцелярией. Благодаря ему в\nСанкт-Петербурге были установлены фонари, скамейки. Организованной\nоказалась и служба пожарной безопасности. В 1722 году в Москве появилась\nдолжность <strong>обер-полицмейстера<\/strong>. Он отвечал за\nобщественный порядок в Москве.<\/p>\n<p>А при Анне Иоанновне полиция стала еще и судебной инстанцией. Она\nсама занималась назначением наказаний по уголовным делам.<\/p>\n<p><strong>19 век:<\/strong><\/p>\n<p>В это время функции полицейского главы стал выполнять <strong>земский\nисправник<\/strong>. Его выбирали дворяне. <strong>Городничие<\/strong>\nбыли упразднены. Появились <strong>полицейские управления<\/strong>.\nВпервые за всю российскую историю появились особые подразделения по\nраскрытию преступлений и дознанию в Санкт-Петербурге. Здесь в 1866 году\nввели <strong>сыскную полицию<\/strong>. Позже та же структура начала\nприменяться в Москве и в других городах. Возникла служба уголовного\nсыска. Уже в 1907 году таковая имелась во многих крупнейших российских\nгородах.<\/p>\n<p><strong>20 век:<\/strong><\/p>\n<p>С 1903 года начала распространяться <strong>уездная полицейская\nстража<\/strong>. Благодаря реформам Столыпина для начальников сыска были\nвведены особые курсы. Даже в Швейцарии русский сыск был признан лучшим в\nмире в 1913 году. Однако прогремела Февральская революция, и Департамент\nполиции упразднили. Эта процедура была одной из главных задач,\nпровозглашенных В.И. Лениным. Вместо этого была введена <strong>народная\nмилиция<\/strong>. Кроме того, организовали и рабочую милицию. Эти\nструктуры действовали под руководством политической силы, а иногда и без\nнее. Рабочая милиция не была связана с городской.<\/p>\n<p>Вскоре между народной и городской милицией начались конфликты.\nНаметилось разрушение этой важной государственной структуры. НКВД\nпринялось выпускать постановления для урегулирования этого вопроса.\nРабочая милиция, по сути, была самодеятельной организацией, основанной\nна добровольных дружинах. Она не могла бороться с преступностью. В 1918\nгоду НКВД признало милицию отдельным штатом лиц, который исполнял особые\nобязанности. При этом действовал он независимо от армии.<\/p>\n", "t": " создание: до 18 века страна не обладала регулярным полицейским органом. чтобы понять, как создавалась полиция россии, нужно обратиться ко времени, когда вместо нее данная деятельность называлась «благочинием». сам термин «полиция» появился еще в древней греции. это был регулярный военизированный орган власти, который отвечал за сохранение общественного порядка. в древнерусской государственности ту же функцию выполняли помещики, наместники, дворские, мечники и так далее. по сути, первым из основных этапов развития полиции россии можно считать создание княжеских дружин. когда государство зарождалось, им помогали и общинники. затем прав <\/p><\/li>\n<\/ol>\n<p><em>Для этого было принято два документа:<\/em><\/p>\n<p><strong>УКАЗ О ЕДИНОНАСЛЕДИИ. (1714 год)<\/strong><\/p>\n<ol type=\"1\">\n<li><p>Поместье дворян теперь можно было передавать по наследству –\nтаким образом, оно было приравнено к вотчине, а боярство и дворянство\nслилось в одно привилегированное сословие –\n<strong>дворянство<\/strong>.<\/p><\/li>\n<li><p>Служба государству стала обязанностью дворянина.<\/p><\/li>\n<li><p>Поместье можно было передавать только одному (как правило,\nстаршему, сыну) – это приводило к появлению безземельного дворянства,\nкоторое должно было устраиваться на военную или гражданскую\nгосударственную службу.<\/p><\/li>\n<\/ol>\n<p>Таким образом, был создано сословие, главной обязанностью и стороной\nдеятельности которого была служба государству, управление им.<\/p>\n<p><strong>ТАБЕЛЬ О РАНГАХ<\/strong><\/p>\n<p><em>Основные её положения:<\/em><\/p>\n<ol type=\"1\">\n<li><p>Военная, гражданская, придворная служба была разделена на 14\nклассов (рангов) чиновников (самый старший в военном первом классе был\nГенерал-фельдмаршал, самый старший гражданский чин – канцлер, самый\nмладший – военные – прапорщики, гражданские – регистратор)<\/p><\/li>\n<li><p>Любой высший чин мог быть присвоен только после прохождения\nнизших чинов.<\/p><\/li>\n<li><p>Получение чина 14 класса недворянином давало личное дворянство\n(которое он не мог передавать по наследству), а получение 8-го класса\nдавало потомственное дворянство (которое можно было передавать по\nнаследству)<\/p><\/li>\n<\/ol>\n<p>Таким образом, в начале XVIII века было создано привилегированное\nсословие – дворянство, главной обязанностью которого стала военная и\nгражданская служба.<\/p>\n<p>Принцип продвижения по службе в зависимости от знатности был\nокончательно заменён принципом личной выслуги.<\/p>\n<p>Недворянскому сословию хотя бы теоретически тоже был открыт путь к\nгосударственной службе и дворянскому званию.<\/p>\n", "t": " для управления и работы в созданном государственном аппарате должны были быть созданы чиновники-бюрократы . признаки бюрократического управления (государственной службы): строгая иерархия – т. е. подчинение нижестоящих лиц вышестоящим; назначение на должность (а не выборность). получение за свою работу жалования. для этого было принято два документа: указ о единонаследии. (1714 год) поместье дворян теперь можно было передавать по наследству – таким образом, оно было приравнено к вотчине, а боярство и дворянство слилось в одно привилегированное сословие – дворянство . служба государству стала обязанностью дворянина. поместье можно было передавать только одному (как правило, старшему, сыну) – это приводило к появлению безземельного дворянства, которое должно было устраиваться на военную или гражданскую государственную службу. таким образом, был создано сословие, главной обязанностью и стороной деятельности которого была служба государству, управление им. табель о рангах основные её положения: военная, гражданская, придворная служба была разделена на 14 классов (рангов) чиновников (самый старший в военном первом классе был генерал-фельдмаршал, самый старший гражданский чин – канцлер, самый младший – военные – прапорщики, гражданские – регистратор) любой высший чин мог быть присвоен только после прохождения низших чинов. получение чина 14 класса недворянином давало личное дворянство (которое он не мог передавать по наследству), а получение 8-го класса давало потомственное дворянство (которое можно было передавать по наследству) таким образом, в начале xviii века было создано привилегированное сословие – дворянство, главной обязанностью которого стала военная и гражданская служба. принцип продвижения по службе в зависимости от знатности был окончательно заменён принципом личной выслуги. недворянскому сословию хотя бы теоретически тоже был открыт путь к государственной службе и дворянскому званию. "}, {"n": "Оформление абсолютизма в России.", "h": "<p>Форсированное оформление абсолютизма пришлось на середину XVII -\nпервую четверть XVIII вв.<\/p>\n<p><em>С середины ХVII в. в правление царя Алексея Михайловича началось\nформирование элементов абсолютизма:<\/em><\/p>\n<p>— реже созывались Земские соборы,<\/p>\n<p>—снижалась роль боярской Думы и возрастало значение Ближней думы и\nприказной бюрократии (дьяки и подьячие),<\/p>\n<p>— изживал себя основной принцип феодальной службы (местничество),<\/p>\n<p>— увеличивалось число солдатских и рейтарских полков иноземного\nстроя, предвестников регулярной армии,<\/p>\n<p>— возрастала роль светской культуры,<\/p>\n<p>— присоединившись к антитурецкой коалиции Россия попыталась войти в\nсистему европейских государств.<\/p>\n<p>Значительная роль принадлежала Петру 1 и его окружению. Это\nвыразилось в превращении России в империю и в новом титуле император\n(1721 г.). Петр заменил приказы <strong>коллегиями<\/strong> (1718 г.),\nреформировал местное управление, поставил церковь под управление\nгосударства, создал регулярную армию и флот. При нем впервые появилась\nроспись государственных доходов и расходов. Подворная подать была\nзаменена <strong>подушной<\/strong> (1718—1719 гг.). Введение\n<strong>Табели о рангах<\/strong> (1722 г.) установило единые принципы\nчинопроизводства по военной и гражданской службе.<\/p>\n<p>Укрепление абсолютизма продолжалось при преемниках Петра I. В 1740 г.\nв соответствии с Манифестом императрицы наследником престола был\nобъявлен сын племянницы императрицы, Анны Леопольдовны, малолетний Иван\nАнтонович, а регентом при нём – бывший фаворит Эрнст Бирон, вскоре\nсвергнутый и отправленный в сибирскую ссылку фельдмаршалом Минихом.\nПосле кратковременного регентства Анны Леопольдовны Иван Антонович был\nнизложен и заточен в темницу, а вместо него 25 ноября 1741 г. гвардией\nна престол была возведена дочь Петра I Елизавета, после смерти которой в\n1761 г. престол перешел к её племяннику Петру III. Но уже в 1762 г. жена\nПетра III свергла его с престола, совершив очередной дворцовый переворот\nс помощью гвардии.<\/p>\n<p>Екатерина II царствовала 34 года. Екатерина П стремилась сочетать\nидею самодержавия с идеей сословности как непременным элементом\nпросвещенной монархии. Ко времени правления Екатерины шел процесс\nобразования сословий. Они оставались слабо структурированными, не имели\nзаконодательно оформленных сословных прав и привилегий, сословной\nорганизации и сословного суда, то есть в сущности, не являлись\nкорпорациями публичного права. Создать сословный строй в России, связать\nего с самодержавием — такую задачу поставила перед собой Екатерина в\nначале своего царствования. В екатерининское время по мере расширения\nимперии на запад и юг эта политика становилась имперской, то есть\nотражала устойчивый комплекс специфических имперских идей властвования\nнад другими народами. Речь идет не о политике, обращенной во внешний\nмир, а о политике внутри многонациональной империи. Сутью ее становятся\nтри принципа: русификация, централизация и унификация, а также\nнасильственное распространение православия. Русификация проявлялась не\nтолько в естественных процессах усвоения ценностей европейской\nцивилизации через русскую культуру, но и в сознательном стремлении\nвласти подчеркнуть русские культурные и политические приоритеты. На\nприсоединенных землях проводилось выравнивание статуса этих территорий\nпутем административных изменений, на основе унификации и централизации.\nВся Россия получила единую систему местного управления, построенную на\nоснове строгого централизма и бюрократизации. При большой веротерпимости\nправославие являлось государственной религией.<\/p>\n", "t": " форсированное оформление абсолютизма пришлось на середину xvii - первую четверть xviii вв. с середины хvii в. в правление царя алексея михайловича началось формирование элементов абсолютизма: — реже созывались земские соборы, —снижалась роль боярской думы и возрастало значение ближней думы и приказной бюрократии (дьяки и подьячие), — изживал себя основной принцип феодальной службы (местничество), — увеличивалось число солдатских и рейтарских полков иноземного строя, предвестников регулярной армии, — возрастала роль светской культуры, — присоединившись к антитурецкой коалиции россия попыталась войти в систему европейских государств. значительная роль принадлежала петру 1 и его окружению. это выразилось в превращении россии в империю и в новом титуле император (1721 г.). петр заменил приказы коллегиями (1718 г.), реформировал местное управление, поставил церковь под управление государства, создал регулярную армию и флот. при нем впервые появилась роспись государственных доходов и расходов. подворная подать была заменена подушной (1718—1719 гг.). введение табели о рангах (1722 г.) установило единые принципы чинопроизводства по военной и гражданской службе. укрепление абсолютизма продолжалось при преемниках петра i. в 1740 г. в соответствии с манифестом императрицы наследником престола был объявлен сын племянницы императрицы, анны леопольдовны, малолетний иван антонович, а регентом при нём – бывший фаворит эрнст бирон, вскоре свергнутый и отправленный в сибирскую ссылку фельдмаршалом минихом. после кратковременного регентства анны леопольдовны иван антонович был низложен и заточен в темницу, а вместо него 25 ноября 1741 г. гвардией на престол была возведена дочь петра i елизавета, после смерти которой в 1761 г. престол перешел к её племяннику петру iii. но уже в 1762 г. жена петра iii свергла его с престола, совершив очередной дворцовый переворот с помощью гвардии. екатерина ii царствовала 34 года. екатерина п стремилась сочетать идею самодержавия с идеей сословности как непременным элементом просвещенной монархии. ко времени правления екатерины шел процесс образования сословий. они оставались слабо структурированными, не имели законодательно оформленных сословных прав и привилегий, сословной организации и сословного суда, то есть в сущности, не являлись корпорациями публичного права. создать сословный строй в россии, связать его с самодержавием — таку ние дворянства. Начинается и\nпостепенно усиливается земельная и промышленная экспансия дворянства. С\n1762 г. значительно усиливается приток дворян на проживание в деревне.\nПараллельно проходило межевание помещичьих земель, перераспределение\nнедвижимости. По указу 1760 г. Дворяне получали право ссылать неугодных\nим крестьяне в Сибирь, а с 1756г. Им предоставлялось право отдавать\nкрестьян в каторжные работы. Еще в 1755 г. была установлена дворянская\nмонополия на винокурение. В 1766 г. дворянство получает важную льготу —\nна шесть лет отменяются пошлины на вывоз хлеба из их хозяйств, в 1787 г.\nдворянству разрешается повсеместная свободная торговля хлебом.\nЗаключительным актом правового и привилегированного оформления\nдворянского сословия стала <strong>Жалованная грамота\nдворянству<\/strong> (1785 г.).<\/p>\n<p>Крестьянство в этот период численно возрастает, подразделяясь на\nпомещичьих, государственных, экономических, посессионных и дворцовых\n(удельных). Помещичьи крестьяне несли в пользу помещика различные\nповинности: барщину, оброк и пр. На них ложились <strong>рекрутские\nпоборы<\/strong> (ежегодно с каждых двадцати дворов по рекруту) и\nгосударственные повинности. Подушная подать 1718 г. и размещение армии\nпо деревням и селам (постойная повинность) усугубляли ситуацию.\nГосударственные крестьяне составляли почти сорок процентов всех\nкрестьян. Они несли повинности и платили оброк государству. Их нельзя\nбыло продавать, однако раздачи крестьян частным владельцам производились\nдостаточно часто: только при Екатерине II более восьмисот тысяч\nгосударственных и дворцовых крестьян были розданы помещиками. Дворцовые\nкрестьяне принадлежали царской фамилии и управление ими осуществлялось\n<strong>Департаментов уделов<\/strong>. Крестьянство было неоднородным, в\nего среде появлялись богатые люди, стремившиеся перейти в купечество,\nоткрыть мануфактуру или заняться торговлей. В 1788 году крестьянам было\nразрешено покупать деревни у помещиков. Указ 1719 г. распространял\nподушный сбор на холопов, имеющих свою пашню. В 1720 и 1723 гг. эта\nподать распространяется на всех лиц мужского пола: крестьян\n<strong>пашенных<\/strong> и <strong>непашенных<\/strong>, холопов,\nдворовых, городских и сельских помещичьих людей. Установление единой\nподушной подати уравняло в фискальном отношении все категории\nкрестьянского населения. Оно ликвидировало особые категории:\n<strong>холопов<\/strong> и <strong>вольных<\/strong> <strong>(гулящих)\nлюдей<\/strong>. Государство стремилось включить в свою орбиту все\nкатегории лиц, ранее ему не подконтрольных — вольных людей забирали в\nсолдаты или записывали за помещиком.<\/p>\n", "t": " монарх рассматривается не просто как «отец нации», а как блюститель законности: «просвещенный абсолютизм» связывается с «правильной организацией» управления и суда. в официальную идею начинают проникать идеи всесословного характера власти. дворянство оставалось правящим сословием. неудобные и ограничительные для него положения петровского указа о единонаследии достаточно скоро начинают корректироваться (в 1730 г. срок дворянской службы фиксируется в двадцать пять лет, начало службы сдвигается с пятнадцати на двадцать лет, один из братьев-помещиков вовсе освобождался от службы), а в 1762 г. по манифесту петра iii \"о даровании вольности и свободы всему российскому дворянству\" вовсе отменяются. дворяне освобождались от обязательной военной и государственной службы. это обстоятельство заметно повлияло на экономическое поведение дворянства. начинается и постепенно усиливается земельная и промышленная экспансия дворянства. с 1762 г. значительно усиливается приток дворян на проживание в деревне. параллельно проходило межевание помещичьих земель, перераспределение недвижимости. по указу 1760 г. дворяне получали право ссылать неугодных им крестьяне в сибирь, а с 1756г. им предоставлялось право отдавать крестьян в каторжные работы. еще в 1755 г. была установлена дворянская монополия на винокурение. в 1766 г. дворян ение процессов: система доказательств.", "h": "<p>Доказательства были четырех видов — собственное признание,\nсвидетельские показания, письменные доказательства, присяга.<\/p>\n<p>Собственное признание являлось «царицей доказательств». Для получения\nпризнания могла применяться пытка. Закон регламентировал ее\nиспользование: пытали соразмерно занимаемому чину и сословию, возрасту,\nсостоянию здоровья. Пытать можно было определенное число раз.\nДопускалась пытка свидетелей. Показания, данные при пытке, должны были\nбыть подтверждены другими доказательствами.<\/p>\n<p>Свидетельские показания не были равноценными. Противопоставлялись\nпоказания мужчин и женщин, знатного человека и незнатного, ученого и\nнеученого, духовного лица и светского человека. Определялся круг лиц,\n<em>которые не могли быть свидетелями:<\/em> клятвопреступники, проклятые\nцерковью, изгнанные из государства, судимые за воровство, убийство,\nразбой и др. Как правило, свидетеля мог допрашивать только судья и\nтолько в суде!<\/p>\n<p>К письменным доказательствам относились <em>различные документы:<\/em>\nзаписи в городовых и судейских книгах, записи в торговых книгах,\nдолговые обязательства, деловые письма и т. д. Обычно письменные\nдоказательства нуждались в подкреплении присягой. <strong>Очистительная\nприсяга<\/strong> применялась в крайних случаях, когда другим способом\nбыло невозможно доказать обвинение. Принесший присягу ответчик считался\nоправданным, отказавшийся принести присягу признавался виновным.<\/p>\n", "t": " доказательства были четырех видов — собственное признание, свидетельские показания, письменные доказательства, присяга. собственное признание являлось «царицей доказательств». для получения признания могла применяться пытка. закон регламентировал ее использование: пытали соразмерно занимаемому чину и сословию, возрасту, состоянию здоровья. пытать можно было определенное число раз. допускалась пытка свидетелей. показания, данные при пытке, должны были быть подтверждены другими легиальное устройство судов;<\/p><\/li>\n<li><p>попытки (правда, неудачные) отделить судебную организацию и\nфункцию от административной;<\/p><\/li>\n<li><p>учреждение контроля за деятельностью судов со стороны специально\nучрежденных органов (прокуроров, фискалов, аудиторов);<\/p><\/li>\n<li><p>совмещение гражданской и военной юстиции (аналогичная ситуация\nскладывалась в сфере местного управления, где наряду с гражданскими\nорганами местного самоуправления действовали военные «полковые\nдворы»).<\/p><\/li>\n<\/ol>\n", "t": " высшей судебной инстанцией был монарх . его компетенция в сфере судопроизводства была неограниченной. следующей инстанцией был сенат , подчинявший себе юстиц-коллегию (в числе всех других) и всю систему судебных учреждений. сенат являлся высшей апелляционной инстанцией и его решения были окончательными. образовывались военные суды. высшей инстанцией в этой системе являлся генеральный кригсрехт , рассматривавший наиболее важные дела, связанные с государственными и воинскими преступлениями. нижней инстанцией стал полковой кригсрехт , рассматривавший все остальные дала. военные суды также были коллегиальными, при каждом из них состоял аудитор, наблюдавший за законностью правосудия. приговоры генерального кригсрехта выносились на утверждение в военную коллегию. новыми чертами организационной судебной системы в первой четверти xviii в. стали: коллегиальное устройство судов; попытки (правда, неудачные) отделить судебную организацию и функцию от административной; учреждение контроля за деятельностью судов со стороны специально учрежденных органов (прокуроров, фискалов, аудиторов); совмещение гражданской и военной юстиции (аналогичная ситуация складывалась в сфере местного управления, где наряду с гражданскими органами местного самоуправления действовали военные «полковые дворы»). "}, {"n": "Развитие понятия преступления в Русском законодательстве XI-XVIII в.", "h": "<p>Древнерусские памятники законодательства (до 18 века) не дают\nопределения преступления.<\/p>\n<p><strong>«Русская Правда»<\/strong> трактует преступление как то, что\nпричиняет вред определённому человеку, его личности и имуществу. Отсюда\nи термин для обозначения преступления — <strong>«обида»<\/strong>.<\/p>\n<p>В <strong>Псковской судной грамоте<\/strong> даётся расширенное\nпонятие преступления. По сравнению с «Русской Правдой» заметна эволюция\nопределения преступления. Теперь преступлением считаются любые деяния,\nзапрещённые уголовной нормой, хотя бы они и не причинили\nнепосредственного ущерба конкретному лицу (например, преступления,\nнаправленные против суда).<\/p>\n<p><strong>Судебник 1497 г.<\/strong> трактовал понятие преступления\nотлично от Русской Правды, но в целом тождественно Псковской судной\nграмоте. Под преступлением понимались всякие действия, которые так или\nиначе угрожали государству или господствующему классу в целом и поэтому\nзапрещались законом. В отличие от Псковской судной грамоты, Судебник\nдаёт термин для обозначения преступления. Оно теперь именуется\n<strong>«лихое дело».<\/strong> <strong>Соборное Уложение 1649\nгода<\/strong> в целом трактовало понятие преступления так же.<\/p>\n<p>Первое определение преступления даётся в <strong>Артикуле воинском\nПетра I<\/strong>. Он даёт современный термин для обозначения уголовного\nправонарушения — <strong>«преступление»<\/strong>. Заметно развивается\nучение о составе преступления, предусматривается разграничение\nпреступлений по признаку субъективной стороны: преступления делятся на\nумышленные, неосторожные и случайные деяния. Преступление определялось\nкак «вражеские и предосудительные против персоны его величества или его\nвойск, а также государства, людей или интереса государственного\nдеяния».<\/p>\n<p>Какое наказание предусматривалось Соборным Уложением за следующие\nвиды преступлений: а) богохульство; б) подделка государственных грамот,\nпечатей; в) изготовление фальшивых денег; г) незаконное производство и\nхранение спиртных напитков, табака; д) убийство родителя ребенком; е)\nубийство ребенка родителем (сошлитесь на конкретные статьи).<\/p>\n<p><strong>Соборное Уложение 1649 года<\/strong> впервые в истории\nрусского законодательства дало классификацию преступления\n(антигосударственные, против церкви, уголовные, гражданские\nправонарушения).<\/p>\n<p>а) <strong>Богохульство<\/strong>. Квалификацией состава этого\nпреступления рассматривается не только как оскорблением словом Бога, но\nглавным образом как неверие, отрицание его существования, что считалось\nпосягательством на основы христианского вероучения. Так же воспрещалась\nхула на христианскую святыню: Христа, Святую Богородицу, святой крест и\nсвятых. Виновные наказывались смертной казнью через сожжение.<\/p>\n<p>б) <strong>Подделка документов, печатей и подписей<\/strong>\nнаказывалась смертью (гл. 4 ст.1.).<\/p>\n<p>в) Одним из наиболее серьезных правонарушений было\n<strong>фальшивомонетчество<\/strong> - деяние, направленное против\nденежной монополии государства. Памятники 1- го периода не знают такого\nпреступления, так как орудиями обращения были металлы по весу,\nосуществлялся лишь особый надзор государства за частными производителями\nденег, которые подвергались наказанию только за выпуск монет ниже\nустановленной пробы. Исключительное производство монеты государством\nустанавливается лишь в 16 веке, и с этого же времени начинается\nпрактическое преследование о подделке монеты: при великом князе Василии\nИоанновиче (1533 г.) «казнили многих людей в деньгах, а казнь была –\nолово лили в рот, да руки секли». Михаил Федорович смягчил наказание,\nустановив, вместо залития в горла расплавленным металлом, вечное\nтюремное заключение; но подделка монеты резко увеличилась, и царь в 1637\nгоду восстановил смертную казнь в прежней форме «для пущих воров»\n(главных виновников) и простую для пособников, укрывателей и сбытчиков.\nПри Алексее Михайловиче пособников карали различно: отсечением руки,\nурезанием ноздрей.<\/p>\n<p>г) Известное еще церковному законодательству <strong>корчемство\n<\/strong>запрещалось Стоглавом, а Соборное Уложение предусматривало\nуголовную ответственность не только незаконных изготовителей и продавцов\nспиртных напитков. табака, но и для его потребителей. Наказание\nпостепенно ужесточается, в случае повтора преступления, и так до 4-х раз\n(когда, наконец, следовала ссылка в дальние города и конфискация\nимущества).<\/p>\n<p><strong>Убийство<\/strong> различалось: <strong>умышленное<\/strong>\n(каралось смертной казнью) и <strong>неумышленное<\/strong> (наказывалось\nбитием кнутом и заключением в тюрьму).<\/p>\n<p>д) Особо выделяется <strong>убийство родителей<\/strong>, за что\nкаралось смертью.<\/p>\n<p>е) <strong>Убийство детей<\/strong> никогда не наказывалось смертью,\nвиновный сажался в тюрьму на год и потом подвергался публичному\nцерковному покаянию. (Глава 22 ст.3). Но <strong>“детоубийство”<\/strong>\nв узком смысле, то есть убийство матерью незаконнорожденного ребенка,\nкарается смертью. (Глава 22 ст.26.)<\/p>\n", "t": " древнерусские памятники законодательства (до 18 века) не дают определения преступления. «русская правда» трактует преступление как то, что причиняет вред определённому человеку, его личности и имуществу. отсюда и термин для обозначения преступления — «обида» . в псковской судной грамоте даётся расширенное понятие преступления. по сравнению с «русской правдой» заметна эволюция определения преступления. теперь преступлением считаются любые деяния, запрещённые уголовной нормой, хотя бы они и не причинили непосредственного ущерба конкретному лицу (например, преступления, направленные против суда). судебник 1497 г. трактовал понятие преступления отлично от русской правды, но в целом тождественно псковской судной грамоте. под преступлением понимались всякие действия, которые так или иначе угрожали государству или господствующему классу в целом и поэтому запрещались законом. в отличие от псковской судной грамоты, судебник даёт термин для обозначения преступления. оно теперь именуется «лихое дело». соборное уложение 1649 года в целом трактовало понятие преступления так же. первое определение преступления даётся в артикуле воинском петра i . он даёт современный термин для обозначения уголовного правонарушения — «преступление» . заметно развивается учение о составе преступления, предусматривается разграничение преступлений по признаку субъективной стороны: преступления делятся на умышленные, неосторожные и случайные деяния. преступление определялось как «вражеские и предосудительные против персоны его величества или его войск, а также государства, людей или интереса государственного деяния». какое наказание предусматривалось соборным уложением за следующие виды преступлений: а) богохульство; б) подделка государственных грамот, печатей; в) изготовление фальшивых денег; г) незаконное производство и хранение спиртных напитков, табака; д) убийство родителя ребенком; е) убийство ребенка родителем (сошлитесь на конкретные статьи). соборное уложение 1649 года впервые в истории русского законодательства дало классификацию преступления (антигосударственные, против церкви, уголовные, гражданские правонарушения). а) богохульство . квалификацией состава этого преступления рассматривается не только как оскорблением словом бога, но главным образом как неверие, отрицание его существования, что считалось посягательством на основы христианского вероучения. так же воспрещалась хула на христианскую святыню: христа, святую богородицу, святой крест и святых. виновные наказывались смертной казнью через сожжение. б) подделка документов, печатей и подписей наказывалась смертью (гл. 4 ст.1.). в) одним из наиболее серьезных правонарушений было фальшивомонетчество - деяние, направленное против денежной монополии государства. памятники 1- го периода не знают такого преступления, так как орудиями обращения были металлы по весу, осуществлялся лишь особый надзор государства за частными производителями денег, которые подвергались наказанию только за выпуск монет ниже установленной пробы. исключительное производство монеты государством устанавливается лишь в 16 веке, и с этого же времени начинается практическое преследование о подделке монеты: при великом князе василии иоанновиче (1533 г.) «казнили многих людей в деньгах, а казнь была – олово лили в рот, да руки секли». михаил федорович смягчил наказание, установив, вместо залития в горла расплавленным металлом, вечное тюремное заключение; но подделка монеты резко увеличилась, и царь в 1637 году восстановил смертную казнь в прежней форме «для пущих воров» (главных виновников) и простую для пособников, укрывателей и сбытчиков. при алексее михайловиче пособников карали различно: отсечением руки, урезанием ноздрей. г) известное еще церковному законодательству корчемство запрещалось стоглавом, а соборное уложение предусматривало уголовную ответственность не только незаконных изготовителей и продавцов спиртных напитков. табака, но и для его потребителей. наказание постепенно ужесточается, в случае повтора преступления, и так до 4-х раз (когда, наконец, следовала ссылка в дальние города и конфискация имущества). убийство различалось: умышленное (каралось смертной казнью) и неумышленное (наказывалось битием кнутом и заключением в тюрьму). д) особо выделяется убийство родителей , за что каралось смертью. е) убийство детей никогда не наказывалось смертью, виновный сажался в тюрьму на год и потом подвергался публичному церковному покаянию. (глава 22 ст.3). но “детоубийство” в узком смысле, то есть убийство матерью незаконнорожденного ребенка, карается смертью. (глава 22 ст.26.) "}, {"n": "Воинские артикулы: развитие понятия преступления (общая часть)", "h": "<p>Воинские артикулы состоят из 24 глав и 209 статей и включены в\nкачестве части второй в Воинский устав.<\/p>\n<p>Артикулы содержат основные принципы уголовной ответственности,\nпонятие преступления, вины, цели наказания, понятия необходимой обороны,\nкрайней необходимости, перечень смягчающих и отягчающих обстоятельств.\n<strong>Преступление<\/strong> рассматривается не с точки зрения\nправонарушения, а как нарушение субординации, неисполнение приказанного,\nослушание. Т.е. это не только формальный акт нарушения, его\nгосударственной воли, но и действие, причиняющее вред государству,\nпосягающее на государственный интерес, господствующий класс в целом\n(дворянство), воля которого возведена в закон и выражена в законах.<\/p>\n<p>Преступления подразделялись на умышленные, неосторожные и случайные.\nЗаконодатель обращал внимание на степень случайности — грань между\nнеосторожным и случайным преступлениями была весьма тонкой. Выделив\nсубъективную сторону преступления, законодатель все же не отказывался от\nпринципа объективного вменения: нередко неосторожные действия\nнаказывались так же, как и умышленные — для суда был важен результат\nдействия, а не его мотив. Вместе с преступником несли ответственность\nлица, не совершавшие преступления — его родственники. Ответственность\nснималась или смягчалась в зависимости от объективных обстоятельств. К\n<strong>смягчающим обстоятельствам<\/strong> закон относил состояние\nаффекта, малолетство преступника, \"непривычку к службе\" и служебное\nрвение, в пылу которого было совершено преступление.<\/p>\n<p>Характерно, что к <strong>отягчающим обстоятельствам<\/strong> закон\nвпервые стал относить состояние опьянения, прежде всегда бывшее\nобстоятельством, смягчающим вину.<\/p>\n<p>Законодатель вводил понятия <strong>крайней необходимости<\/strong>\n(например, кража от голода) и <strong>необходимой обороны<\/strong>. Для\nпоследней требовалось наличие ряда обстоятельств: важнейшим была степень\nсоответствия примененной защиты угрожающему нападению, факт наличия\nтакого нападения и факт угрозы жизни защищающегося. Отсутствие одного из\nпризнаков могло повлечь для защищающегося наказание, пусть даже\nсмягченное.<\/p>\n<p><em>Преступление делилось на стадии:<\/em> умысел, покушение на\nпреступление и законченное преступление. В ряде случаев законодатель\nпредусматривал наказание за один только умысел (в государственных\nпреступлениях).<\/p>\n<p>Покушение на преступление могло быть <strong>оконченным<\/strong> и\n<strong>неоконченным<\/strong>: закон предусматривал возможность\nдобровольного отказа от совершения преступления (например, отказ от\nзавершения дуэли, уже сошедшимся в бою дуэлянтам).<\/p>\n<p>Институт соучастия в преступлении не был достаточно разработан: роли\nсоучастников не дифференцировались законом. Однако по некоторым видам\nпреступлений пособники наказывались мягче, чем исполнители преступления\n(например, пособник, помогавший составить \"пасквиль\", пособники,\nподдержавшие бунтовщиков и мятежников). В обоих случаях присутствовал\nполитический мотив: в одном следовало ужесточить репрессию к пособникам,\n\"чтоб неповадно было\", а в другом отделить их от главных исполнителей в\nинтересах следствия.<\/p>\n", "t": " воинские артикулы состоят из 24 глав и 209 статей и включены в качестве части второй в воинский устав. артикулы содержат основные принципы уголовной ответственности, понятие преступления, вины, цели наказания, понятия необходимой обороны, крайней необходимости, перечень смягчающих и отягчающих обстоятельств. преступление рассматривается не с точки зрения правонарушения, а как нарушение субординации, неисполнение приказанного, ослушание. т.е. это не только формальный акт нарушения, его государственной воли, но и действие, причиняющее вред государству, посягающее на государственный интерес, господствующий класс в целом (дворянство), воля которого возведена в закон и выражена в законах. преступления подразделялись на умышленные, неосторожные и случайные. законодатель обращал внимание на степень случайности — грань между неосторожным и случайным преступлениями была весьма тонкой. выделив субъективную сторону преступления, законодатель все же не отказывался от принципа объективного вменения: нередко неосторожные действия наказывались так же, как и умышленные — для суда был важен результат действия, а не его мотив. вместе с преступником несли ответственность лица, не совершавшие преступления — его родственники. ответственность снималась или смягчалась в зависимости от объективных обстоятельств. к смягчающим обстоятельствам закон относил состояние аффекта, малолетство преступника, \"непривычку к службе\" и служебное рвение, в пылу которого было совершено преступление. характерно, что к отягчающим обстоятельствам закон впервые стал относить состояние опьянения, прежде всегда бывшее обстоятельством, смягчающим вину. законодатель вводил понятия крайней необходимости (например, кража от голода) и необходимой обороны . для последней требовалось наличие ряда обстоятельств: важнейшим была степень соответствия примененной защиты угрожающему нападению, факт наличия такого нападения и факт угрозы жизни защищающегося. отсутствие одного из признаков могло повлечь для защищающегося наказание, пусть даже смягченное. преступление делилось на стадии: умысел, покушение на преступление и законченное преступление. в ряде случаев законодатель предусматривал наказание за один только умысел (в государственных преступлениях). покушение на преступление могло быть оконченным и неоконченным : закон предусматривал возможность добровольного отказа от совершения преступления (например, отказ от завершения дуэли, уже сошедшимся в бою дуэлянтам). институт соучастия в преступлении не был достаточно разработан: роли соучастников не дифференцировались законом. однако по некоторым видам преступлений пособники наказывались мягче, чем исполнители преступления (например, пособник, помогавший составить \"пасквиль\", пособники, поддержавшие бунтовщиков и мятежников). в обоих случаях присутствовал политический мотив: в одном следовало ужесточить репрессию к пособникам, \"чтоб неповадно было\", а в другом отделить их от главных исполнителей в интересах следствия. "}, {"n": "Воинские артикулы: система преступлений и наказаний.", "h": "<p>Преступником считалось лицо, достигшее 15 лет. Если человеку было\nменьше 15, его отправляли в монастырь на перевоспитание.<\/p>\n<ul>\n<li>Артикулы включали следующие виды преступлений:<\/li>\n<\/ul>\n<p>1). <strong>Против религии.<\/strong> В эту группу входили:\nчародейство, идолопоклонство, которые наказывались смертной казнью\n(сожжением) при условии, что будет доказано сношение обвиняемого с\nдьяволом.<\/p>\n<p>Богохульство наказывалось усечением языка, несоблюдение церковных\nобрядов и непосещение богослужений, нахождение в церкви в пьяном виде\nнаказывалось штрафом или тюремным заключением. \"Совращение в раскол\"\nнаказывалось каторгой, конфискацией имущества, а для священников —\nколесованием.<\/p>\n<p>2). <strong>Государственные.<\/strong> Простой умысел убить или взять\nв плен царя наказывался четвертованием. Так же наказывалось вооруженное\nвыступление против властей, оскорбление словом монарха наказывалось\nотсечением головы. Бунт и возмущение, наказывались повешением.<\/p>\n<p><em>Измена включала:<\/em> тайную переписку и переговоры с\nнеприятелем, сообщение ему пароля, военных сведений и распространение\nнеприятельских воззваний. Смертной казнью наказывались за измену как\nисполнители, так и недоносители.<\/p>\n<p>3). К <strong>должностным преступлениям<\/strong> Артикулы относили\nвзяточничество, наказываемое смертной казнью, конфискацией имущества и\nтелесными наказаниями, злоупотребление властью в корыстных целях–\nнаказание в виде повешенья, неповиновение начальству, отказ от\nвыполнения служебных обязанностей.<\/p>\n<p>4). <strong>Преступления<\/strong> <strong>против порядка управления и\nсуда<\/strong>. <em>К ним относились:<\/em> срывание и истребление указов,\nчто наказывалось смертной казнью, дуэль- оставшиеся в живых дуэлянты\nнаказывались повешением, тела погибших на дуэли подвергались\nнадругательству (покушение на преступление (вызов на дуэль) наказывалось\nмягче — конфискацией имущества), самоубийство- совершение позорящей\nпроцедуры относительно самоубийцы: палач должен был волочить тело\nсамоубийцы по улицам и закопать в «бесчестном» месте; телесные\nповреждения. Фальшивомонетничество - За это полагались телесные\nнаказания и конфискация. За подделку денег — сожжение.<\/p>\n<p><em>К преступлениям против суда относились:<\/em> лжеприсяга, которая\nнаказывалась отсечением двух пальцев (которыми присягали) и ссылкой на\nкаторгу, лжесвидетельство, наказываемое, как и лжеприсяга (кроме того,\nназначалось церковное покаяние).<\/p>\n<p>5). <strong>Преступление против \"благочиния\"<\/strong>, укрывательство\nпреступников, каравшееся смертной казнью, в дополняющих Артикулы указах\nпредусматривались наказания за буйство, пьянство, игру в карты на\nденьги, драки и нецензурную брань в публичных местах.<\/p>\n<p>6). <strong>Преступления<\/strong> <strong>против личности<\/strong>\nвключали преступления против жизни, телесной неприкосновенности,\nчести.<\/p>\n<p>В этой группе главное место занимало убийство. Артикулы различали\n<strong>умышленное<\/strong> (каравшееся отсечением головы),\n<strong>неосторожное<\/strong> (наказываемое телесным заключением,\nштрафом, шпицрутенами), <strong>случайное<\/strong> (ненаказуемое).<\/p>\n<p>Преступления против телесной неприкосновенности делились на\n<strong>увечья<\/strong> и <strong>побои<\/strong>. При нанесении увечья\nназначалось отсечение руки преступнику (действовал архаический принцип\nталиона).<\/p>\n<p>Отсечение руки назначалось за удар тростью. Нанесение удара ножом\n(легкие телесные повреждения) наказывалось по сложной процедуре:\nвиновного ставили под виселицу, прибивали ему руки тем же ножом на час к\nплахе, после чего наказывали шпицрутенами.<\/p>\n<p>Преступления против чести ассоциировались с клеветой. Клевета могла\nбыть <strong>устной<\/strong> или <strong>письменной<\/strong>. Устная\nклевета наказывалась заключением в тюрьму (на полгода). Письменная\nопределялась как анонимное обвинение. Если оно было справедливым и факты\nподтверждались, его автор наказывался тюрьмой и каторгой. За оскорбление\nсловом виновный перед судом просил прощения у обвиненного. Если\nоскорбление было жестоким, то он дополнительно наказывался штрафом и\nкраткосрочным тюремным заключением.<\/p>\n<p>7). К <strong>имущественным преступлениям<\/strong>\n<em>относились:<\/em> кража, грабеж, поджог, истребление или повреждение\nчужого имущества.<\/p>\n<ul>\n<li><p><strong>Простая кража.<\/strong> До 20 рублей, наказывалась\nшпицрутенами, членовредительством и каторгой. Особо выделялась\n<strong>мелкая кража<\/strong>, наказывающаяся легче. Смягчалось\nнаказание за воровство из тяжелого материального состояния,\nголода;<\/p><\/li>\n<li><p><strong>Квалифицированная кража<\/strong>: a) ценой более 20\nрублей; б) четвертый раз; в) во время стихийного бедствия (пожар,\nнаводнение); г) из военного арсенала; д) на месте несения караула; е) у\nтоварища-солдата или офицера; ё) из церкви. Этот вид кражи карался\nсмертной казнью (повешение колесование);<\/p><\/li>\n<li><p><strong>Грабеж.<\/strong> Различаются грабеж, <strong>совершенный\nбез оружия<\/strong> (полагались шпицрутены и телесные наказания) и\n<strong>совершенный с оружием <\/strong>(смертная казнь). Ночного вора\nможно было убить, т.к. он ночью не только для воровства, но и для\nубийства проникает. <strong>Поджог<\/strong>. Различался\n<strong>умышленный поджог<\/strong> – смертная казнь,\n<strong>неосторожный поджог<\/strong> – возмещение убытков;<\/p><\/li>\n<li><p><strong>Утайка находки<\/strong>. Нашедший должен был представить\nнаходку начальнику, за что получал до 1/3 ее цены. Утаивший находку\nнаказывался как вор. Невозвращение отданного на хранение наказывалось\nкак воровство.<\/p><\/li>\n<\/ul>\n<p>8). К <strong>преступлениям против нравственности\n<\/strong><em>относили<\/em>: изнасилование); мужеложество (наказываемое\nсмертной казнью или ссылкой на галеры); скотоложество (за которым\nследовало тяжелое телесное наказание); \"блуд\", кровосмешение или связь\nмежду близкими родственниками; двоеженство; прелюбодеяние (наказываемое\nтюремным заключением и каторгой).<\/p>\n<ol start=\"9\" type=\"1\">\n<li><strong>Против общественного порядка и спокойствия<\/strong>. Это\nсодержание притонов, драки, брань, бунты и «непристойные подозрительные\nсходбища». Наказания, в основном, телесные, либо же смертная казнь.<\/li>\n<\/ol>\n<p>Основной целью наказания по Артикулам являлось устрашение. Устрашение\nсочеталось с публичностью наказаний. Казнь производилась в людном месте,\nо ней предварительно объявлялось. Процедура казни превращалась в особый\nспектакль, где каждому была отведена своя роль.<\/p>\n<p><em>Характерными чертами наказания были<\/em> жестокость (смертная\nказнь предусматривалась в 74 артикулах), неопределенность в видах и\nнесоответствие между наказанием и совершенным преступлением.<\/p>\n<ul>\n<li>Виды наказаний:<\/li>\n<\/ul>\n<p>А) <strong>Смертная казнь<\/strong>. Подразделялась на простую\n(расстрел, повешенье, отсечение головы) и квалифицированную\n(четвертование, колесование, залитие горла металлом, сожжение).<\/p>\n<p>Смертная казнь широко применялась за государственные преступления и в\nпервую очередь к руководителям и участникам крестьянских восстаний.<\/p>\n<p>Б) <strong>Телесные наказания<\/strong>. Делились на болезненные\n(битье кнутом, шпицрутенами) и членовредительские (отсечение руки,\nпальцев, ушей, носа, клеймение).<\/p>\n<p>Г) <strong>Срочная и бессрочная ссылка<\/strong>.<\/p>\n<p>Д) <strong>Каторга<\/strong> (на галеры, строительство гаваней,\nкрепостей, заводов).<\/p>\n<p>Е) <strong>Конфискация<\/strong>.<\/p>\n<p>Ё) <strong>Тюрьма<\/strong>. Простое и жестокое (с заковыванием в\n\"железо\")<\/p>\n<p>Ж) <strong>Штраф<\/strong>.<\/p>\n<p>З) <strong>Имущественные наказания<\/strong>:<\/p>\n<ul>\n<li><p>конфискация имущества<\/p><\/li>\n<li><p>штраф в пользу государства и частных лиц<\/p><\/li>\n<li><p>вычет из жалованья<\/p><\/li>\n<\/ul>\n<p>И) <strong>Лишение чести и прав<\/strong> - позорящие наказания\n(повешение за ноги после смерти, публичное испрашивание на коленях\nпрощения и т.п.)<\/p>\n<p>В отношении офицеров применялись особые наказания:<\/p>\n<p>1)<strong>Отставление от службы<\/strong> (временное или\nпостоянное).<\/p>\n<p>2)<strong>Лишение чина<\/strong>.<\/p>\n<p>3)<strong>Служба в качестве рядового<\/strong>.<\/p>\n<p>4)<strong>Арест у профоса <\/strong>(палача).<\/p>\n<p>5)<strong>Лишение отпуска<\/strong>.<\/p>\n<p>6)<strong>Шельмование<\/strong> было наиболее тяжким видом. Впервые\nвведено Петром 1. Имя преступника прибивали к виселице, палач\nпереламывает шпагу над его головой, и он объявлялся вором (шельмой).\nПосле шельмования преступник ставился вне общества и вне закона; его\nможно было безнаказанно ограбить, побить, ранить и даже в случае его\nнеявки на смотр убить. Он предавался анафеме, отлучению от церкви, ему\nзапрещалось вступать в брак. Ошельмованный не имел фактически никаких\nправ: не мог быть свидетелем в суде, выступать с иском.<\/p>\n", "t": " преступником считалось лицо, достигшее 15 лет. если человеку было меньше 15, его отправляли в монастырь на перевоспитание. артикулы включали следующие виды преступлений: 1). против религии. в эту группу входили: чародейство, идолопоклонство, которые наказывались смертной казнью (сожжением) при условии, что будет доказано сношение обвиняемого с дьяволом. богохульство наказывалось усечением языка, несоблюдение церковных обрядов и непосещение богослужений, нахождение в церкви в пьяном виде наказывалось штрафом или тюремным заключением. \"совращение в раскол\" наказывалось каторгой, конфискацией имущества, а для священников — колесованием. 2). государственные. простой умысел убить или взять в плен царя наказывался четвертованием. так же наказывалось вооруженное выступление против властей, оскорбление словом монарха наказывалось отсечением головы. бунт и возмущение, наказывались повешением. измена включала: тайную переписку и переговоры с неприятелем, сообщение ему пароля, военных сведений и распространение неприятельских воззваний. смертной казнью наказывались за измену как исполнители, так и недоносители. 3). к должностным преступлениям артикулы относили взяточничество, наказываемое смертной казнью, конфискацией имущества и телесными наказаниями, злоупотребление властью в корыстных целях– наказание в виде повешенья, неповиновение начальству, отказ от выполнения служебных обязанностей. 4). преступления против порядка управления и суда . к ним относились: срывание и истребление указов, что наказывалось смертной казнью, дуэль- оставшиеся в живых дуэлянты наказывались повешением, тела погибших на дуэли подвергались надругательству (покушение на преступление (вызов на дуэль) наказывалось мягче — конфискацией имущества), самоубийство- совершение позорящей процедуры относительно самоубийцы: палач должен был волочить тело самоубийцы по улицам и закопать в «бесчестном» месте; телесные повреждения. фальшивомонетничество - за это полагались телесные наказания и конфискация. за подделку денег — сожжение. к преступлениям против суда относились: лжеприсяга, которая наказывалась отсечением двух пальцев (которыми присягали) и ссылкой на каторгу, лжесвидетельство, наказываемое, как и лжеприсяга (кроме того, назначалось церковное покаяние). 5). преступление против \"благочиния\" , укрывательство преступников, каравшееся смертной казнью, в дополняющих артикулы указах предусматривались наказания за буйство, пьянство, игру в карты на деньги, драки и нецензурную брань в публичных местах. 6). преступления против личности включали преступления против жизни, телесной неприкосновенности, чести. в этой группе главное место занимало убийство. артикулы различали умышленное (каравшееся отсечением головы), неосторожное (наказываемое телесным заключением, штрафом, шпицрутенами), случайное (ненаказуемое). преступления против телесной неприкосновенности делились на увечья и побои . при нанесении увечья назначалось отсечение руки преступнику (действовал архаический принцип талиона). отсечение руки назначалось за удар тростью. нанесение удара ножом (легкие телесные повреждения) наказывалось по сложной процедуре: виновного ставили под виселицу, прибивали ему руки тем же ножом на час к плахе, после чего наказывали шпицрутенами. преступления против чести ассоциировались с клеветой. клевета могла быть устной или письменной . устная клевета наказывалась заключением в тюрьму (на полгода). письменная определялась как анонимное обвинение. если оно было справедливым и факты подтверждались, его автор наказывался тюрьмой и каторгой. за оскорбление словом виновный перед судом просил прощения у обвиненного. если оскорбление было жестоким, то он дополнительно наказывался штрафом и краткосрочным тюремным заключением. 7). к имущественным преступлениям относились: кража, грабеж, поджог, истребление или повреждение чужого имущества. простая кража. до 20 рублей, наказывалась шпицрутенами, членовредительством и каторгой. особо выделялась мелкая кража , наказывающаяся легче. смягчалось наказание за воровство из тяжелого материального состояния, голода; квалифицированная кража : a) ценой более 20 рублей; б) четвертый раз; в) во время стихийного бедствия (пожар, наводнение); г) из военного арсенала; д) на месте несения караула; е) у товарища-солдата или офицера; ё) из церкви. этот вид кражи карался смертной казнью (повешение колесование); грабеж. различаются грабеж, совершенный без оружия (полагались шпицрутены и телесные наказания) и совершенный с оружием (смертная казнь). ночного вора можно было убить, т.к. он ночью не только для воровства, но и для убийства проникает. поджог . различался умышленный поджог – смертная казнь, неосторожный поджог – возмещение убытков; утайка находки . нашедший должен был представить находку начальнику, за что получал до 1/3 ее цены. утаивший находку наказывался как вор. невозвращение отданного на хранение наказывалось как воровство. 8). к преступлениям против нравственности относили : изнасилование); мужеложество (наказываемое смертной казнью или ссылкой на галеры); скотоложество (за которым следовало тяжелое телесное наказание); \"блуд\", кровосмешение или связь между близкими родственниками; двоеженство; прелюбодеяние (наказываемое тюремным заключением и каторгой). против общественного порядка и спокойствия . это содержание притонов, драки, брань, бунты и «непристойные подозрительные сходбища». наказания, в основном, телесные, либо же смертная казнь. основной целью наказания по артикулам являлось устрашение. устрашение сочеталось с публичностью наказаний. казнь производилась в людном месте, о ней предварительно объявлялось. процедура казни превращалась в особый спектакль, где каждому была отведена своя роль. характерными чертами наказания были жестокость (смертная казнь предусматривалась в 74 артикулах), неопределенность в видах и несоответствие между наказанием и совершенным преступлением. виды наказаний: а) смертная казнь . подразделялась на простую (расстрел, повешенье, отсечение головы) и квалифицированную (четвертование, колесование, залитие горла металлом, сожжение). смертная казнь широко применялась за государственные преступления и в первую очередь к руководителям и участникам крестьянских восстаний. б) телесные наказания . делились на болезненные (битье кнутом, шпицрутенами) и членовредительские (отсечение руки, пальцев, ушей, носа, клеймение). г) срочная и бессрочная ссылка . д) каторга (на галеры, строительство гаваней, крепостей, заводов). е) конфискация . ё) тюрьма . простое и жестокое (с заковыванием в \"железо\") ж) штраф . з) имущественные наказания : конфискация имущества штраф в пользу государства и частных лиц вычет из жалованья и) лишение чести и прав - позорящие наказания (повешение за ноги после смерти, публичное испрашивание на коленях прощения и т.п.) в отношении офицеров применялись особые наказания: 1) отставление от службы (временное или постоянное). 2) лишение чина . 3) служба в качестве рядового . 4) арест у профоса (палача). 5) лишение отпуска . 6) шельмование было наиболее тяжким видом. впервые введено петром 1. имя преступника прибивали к виселице, палач переламывает шпагу над его головой, и он объявлялся вором (шельмой). после шельмования преступник ставился вне общества и вне закона; его можно было безнаказанно ограбить, побить, ранить и даже в случае его неявки на смотр убить. он предавался анафеме, отлучению от церкви, ему запрещалось вступать в брак. ошельмованный не имел фактически никаких прав: не мог быть свидетелем в суде, выступать с иском. "}, {"n": "Областная реформа последней четверти XVIII в.", "h": "<p>После смерти Петра I его преемники пытались упростить систему местных\nорганов управления — контор, канцелярий, осуществляли слияние и\nукрупнение учреждений и т.п. Попытка Петра I отделить суд от\nадминистрации в губерниях привела к созданию надворных судов,\nнезависимых от губернатора. При Екатерине I это разделение было вновь\nнарушено.<\/p>\n<p>В городах Петр I создал ратуши и магистраты, также независимые от\nгубернаторов и подчиненные Главному магистрату в Петербурге. При\nЕкатерине I и Петре II независимая магистратская система разрушалась,\nмагистраты подчинялись губернаторам и вновь преобразовывались в\nратуши.<\/p>\n<p>Провести новую реформу областного (губернского) управления Екатерину\nII побудили требования дворянских депутатов Уложенной комиссии и события\nПугачевского восстания 1773—1774 гг., после которого стала очевидной\nнеобходимость усиления губернаторской власти на местах.<\/p>\n<p><em>Официальными мотивами проведения реформы стали:<\/em> слишком\nбольшие размеры губерний, как административно-территорильных единиц;\nмалое число управленческих учреждений и недостаточная численность\nуправленческого состава в них; смешение ведомственных функций\n(финансовых, судебных, административных) в этих учреждениях.<\/p>\n<p>Документом, определившим направление новой губернской реформы, стали\n<strong>Учреждения для управления губерний Всероссийской империи\n(1775)<\/strong>. Накануне реформы территория России разделялась на 23\nгубернии, 66 провинций и около 180 уездов. Проводимая реформа\nпланировала осуществить разукрупнение губерний; их число было удвоено;\nчерез двадцать лет после ее начала число губерний достигло 50.<\/p>\n<p>Деление на губернии и уезды осуществлялось по строго\nадминистративному принципу, без учета географических, национальных и\nэкономических признаков. Основная цель деления — приспособить новый\nадминистративный аппарат к фискальным и полицейским делам. В основу\nделения положен чисто количественный критерий — численность населения.\nНа территории губернии проживало около 400 тыс. душ, на территории уезда\n— около 30 тыс. душ. Упразднялись провинции как территориальные\nединицы.<\/p>\n<p>Во главе губернии стоял <strong>губернатор<\/strong>, назначаемый и\nсмещаемый монархом. В своей деятельности он опирался на губернское\nправление, в которое входили губернский прокурор и два сотника.\nФинансовые и фискальные вопросы в губернии решала казенная палата.\nВопросами здравоохранения и образования ведал приказ общественного\nпризрения.<\/p>\n<p>Надзор за законностью в губернии осуществлял <strong>губернский\nпрокурор<\/strong> и два <strong>губернских стряпчих<\/strong>. В уезде те\nже задачи решал уездный стряпчий. Во главе уездной администрации стоял\n<strong>земский исправник<\/strong>, избираемый уездным дворянством, как\nи коллегиальный орган управления — <strong>нижний земский суд<\/strong>\n(в котором кроме исправника действовали два заседателя). Земский суд\nруководил земской полицией, наблюдал за проведением в жизнь законов и\nрешений губернских правлений. В городах была учреждена должность\nгородничего.<\/p>\n<p>Руководство несколькими губерниями поручалось\n<strong>генерал-губернатору<\/strong>. Ему подчинялись губернаторы, он\nпризнавался главнокомандующим на своей территории, если там в данный\nмомент отсутствовал монарх; он мог вводить чрезвычайные меры,\nнепосредственно обращаться с докладом к императору.<\/p>\n<p>Губернская реформа 1775 г. усилила власть губернаторов и, разукрупнив\nтерритории, упрочила положение административного аппарата на местах. С\nтой же целью создавались специальные полицейские, карательные органы и\nпреобразовывалась судебная система.<\/p>\n<p>Попытки отделить суд от администрации (на губернском уровне) делались\nеще в работе Уложенной комиссии (1769), на одном из заседаний было\nзаявлено: «Лучше будет отделить совсем суд и расправу от государственных\nдел». Предполагалось создать суды по следующей системе: уездные судные\nприказы — провинциальные судные приказы — губернские, апелляционные\nнадворные суды или расправные палаты — Сенат (апелляционная\nинстанция).<\/p>\n<p>В городах планировалось сохранить <strong>уездные<\/strong> и\n<strong>губернские суды магистратов<\/strong>, а также создать\n<strong>сословные суды<\/strong> для крестьян и <strong>земские мировые\nсуды<\/strong> — для дворян. Депутаты предлагали сделать судебное\nразбирательство гласным и открытым, однако выступали за создание\nопределенно сословных судов. Еще в 1769 г. был подготовлен законопроект\n<strong>«О судебных местах»<\/strong>, в котором регламентировались\nначала судебного права «просвещенного абсолютизма».<\/p>\n", "t": " после смерти петра i его преемники пытались упростить систему местных органов управления — контор, канцелярий, осуществляли слияние и укрупнение учреждений и т.п. попытка петра i отделить суд от администрации в губерниях привела к созданию надворных судов, независимых от губернатора. при екатерине i это разделение было вновь нарушено. в городах петр i создал ратуши и магистраты, также независимые от губернаторов и подчиненные главному магистрату в петербурге. при екатерине i и петре ii независимая магистратская система разрушалась, магистраты подчинялись губернаторам и вновь преобразовывались в ратуши. провести новую реформу областного (губернского) управления екатерину ii побудили требования дворянских депутатов уложенной комиссии и события пугачевского восстания 1773—1774 гг., после которого стала очевидной необходимость усиления губернаторской влас ть городничего. руководство несколькими губерниями поручалось генерал-губернатору . ему подчинялись губернаторы, он признавался главнокомандующим на своей территории, если там в данный момент отсутствовал монарх; он мог вводить чрезвычайные меры, непосредственно обращаться с докладом к императору. губернская реформа 1775 г. усилила власть губернаторов и, разукрупнив территории, упрочила положение административного аппарата на местах. с той же целью создавались специальные полицейские, карательные органы и преобразовывалась судебная система. попытки отделить суд от администрации (на губернском уровне) делались еще в работе уложенной комиссии (1769), на одном из заседаний было заявлено: «лучше будет отделить совсем суд и расправу от государственных дел». предполагалось создать суды по следующей системе: уездные судные приказы — провинциальные судные приказы — губернские, апелляционные надворные суды или расправные палаты — сенат (апелляционная инстанция). в городах планировалось сохранить уездные и губернские суды магистратов , а также создать сословные суды для крестьян и земские мировые суды — для дворян. депутаты предлагали сделать судебное разбирательство гласным и открытым, однако выступали за создание определенно сословных судов. еще в 1769 г. был подготовлен законопроект «о судебных местах» , в котором регламентировались начала судебного права «просвещенного абсолютизма». "}, {"n": "Институты вещного права в Русском законодательстве XI-XVIII вв.", "h": "<p><strong>Вещное право по Русской правде.<\/strong><\/p>\n<p>В Русской Правде в подавляющем большинстве случаев речь идет о праве\nсобственности людей на движимое имущество, движимые вещи, носившие общее\nназвание «имения». <em>Для обозначения принадлежности вещи\nиспользовались термины:<\/em> мой, твой, его и т.д. В качестве объекта\n«имения» фигурируют одежда, оружие, кони, другой скот, орудия труда,\nторговые товары и пр. Право частной собственности на них было полным и\nнеограниченным. Собственник мог ими <strong>владеть<\/strong> (фактически\nобладать ими), <strong>пользоваться<\/strong> (извлекать доходы) и\n<strong>распоряжаться<\/strong> (определять юридическую судьбу вещей) до\nих уничтожения, вступать в договоры, связанные с вещами, требовать\nзащиты своих прав на вещи и др. <strong>Собственность на Руси<\/strong> –\nвесьма древний институт, считавшийся во времена Русской Правды объектом\nполного господства собственника. Можно предполагать, что субъектами\nправа собственности в указанное время были все свободные люди.\nСобственник имел право на возврат своего имущества из чужого незаконного\nвладения на основе строго установленной в Русской Правде процедуры. За\nпричиненный имуществу ущерб назначался штраф. Возвращение вещей\nтребовало свидетельских показаний и т.д.<\/p>\n<p><em>Виды вещных прав по РП:<\/em><\/p>\n<ul>\n<li><p>Право собственности<\/p><\/li>\n<li><p>Право на чужую вещь<\/p><\/li>\n<li><p>владение (на определенное время)<\/p><\/li>\n<li><p>сервитут (в РП не упоминается, но по факту он\nсуществовал).<\/p><\/li>\n<\/ul>\n<p>Вещное право по Псковской Судной грамоте предусматривало деление\nвещей на <strong>недвижимые<\/strong> — <strong>«отчина»<\/strong> и\n<strong>движимые<\/strong> — <strong>«живот»<\/strong>. Кроме того,\nразделялось <strong>наследственное землевладение<\/strong> —\n<strong>«вотчина» <\/strong>и <strong>условное<\/strong> —\n<strong>«кормля»<\/strong>. (Институт «кормли» представляет собой сложное\nмногоплановое явление. Кормля - имущество, предоставленное пережившему\nсупругу на праве пользования до его смерти, пострижения в монахи или\nвступления в новый брак).<\/p>\n<p><em>Виды вещных прав:<\/em><\/p>\n<ul>\n<li><p>право собственности<\/p><\/li>\n<li><p>право на чужую вещь (владение, сервитут)<\/p><\/li>\n<\/ul>\n<p><em>Способы приобретения:<\/em><\/p>\n<ul>\n<li><p>наследование<\/p><\/li>\n<li><p>Захват<\/p><\/li>\n<li><p>договор<\/p><\/li>\n<li><p>пожалование<\/p><\/li>\n<li><p>приращение (берег реки, к примеру)<\/p><\/li>\n<li><p>Отделение плодов<\/p><\/li>\n<\/ul>\n<p><strong>Судебник 1497 и 1550:<\/strong><\/p>\n<p>Основными способами приобретения вещных прав считались\n<strong>захват<\/strong> (оккупация), <strong>давность<\/strong>,\n<strong>находка<\/strong>, <strong>договор<\/strong> и\n<strong>пожалование<\/strong>. Наиболее сложный характер имели\nимущественные права, связанные с приобретением и передачей недвижимой\nсобственности. Так, пожалование земли представляло собой сложный\nкомплекс юридических действий: выдача жалованной грамоты, запись в\nприказной книге, «обыск», заключавшийся в публичном отмере земли.\nРаздачу земли осуществляли уполномоченные на то приказы.<\/p>\n<p>Основными формами земельной собственности были\n<strong>вотчина<\/strong> (наследственное землевладение) и\n<strong>поместье<\/strong> (условное землевладение). Вотчины делились на\nнесколько видов в соответствии с характером субъектов (дворцовые,\nгосударственные, церковные, частновладельческие) и способами их\nприобретения (родовые, выслуженные (или пожалованные), купленные).<\/p>\n<p><strong>Поместные наделы<\/strong> жаловались из княжеских (дворцовых)\nземель лицам, непосредственно связанным с княжеским дворцом и службой\nкнязю. Термин <strong>«поместье»<\/strong> впервые был использован в\n<strong>Судебнике 1497 г. <\/strong>и вошел в обиход для обозначения\nособого вида условного землевладения, выдаваемого за выполнение\nгосударственной службы.<\/p>\n<p><strong>Соборное Уложение.<\/strong><\/p>\n<p>Вещи по Соборному Уложению были предметом целого ряда правомочий,\nотношений и обязательств. <em>Основными способами приобретения имущества\nсчитались<\/em> захват, давность, находка, пожалование и непосредственно\nприобретение в обмене или при покупке. В Уложении 1649 года\nрегламентацию приобретает <strong>пожалование земли<\/strong>. Оно\nпредставляло собой сложный комплекс юридических действий, включавший\nвыдачу жалованной грамоты; составление справки (т.е. запись в приказной\nкниге определенных сведений о наделяемом лице); ввод во владение,\nкоторый заключался в публичном отмере земли. Раздачу земли наряду с\n<strong>Поместным приказом<\/strong> осуществляли и другие органы -\nРазрядный приказ, Приказ Большого дворца, Малороссийский, Новгородский,\nСибирский и другие приказы. Договор в XVII веке оставался основным\nспособом приобретения прав собственности на имущество, и, в частности,\nна землю. В договоре теряют значение <strong>ритуальные обряды<\/strong>,\nпроисходит замена <strong>формализованных действий<\/strong> (участие\nсвидетелей при заключении договора) <strong>письменными актами<\/strong>\n(\"рукоприкладством\" свидетелей без их личного участия). Впервые в\nСоборном Уложении 1649 года регламентировался <strong>институт\nсервитутов <\/strong>(юридическое ограничение права собственности одного\nлица в интересах права пользования другого или других лиц). Законодатель\nзнал <strong>личные сервитуты<\/strong> (ограничения в пользу\nопределенных лиц, специально оговоренных в законе), например, потрава\nлугов ратниками, находящимися на службе. <strong>Вещные\nсервитуты<\/strong> (ограничение права собственности в интересах\nнеопределенного числа субъектов) <em>включали:<\/em> право владельца\nмельницы в производственных целях заливать нижележащий луг,\nпринадлежащий другому лицу; возможность возводить печь у стены\nсоседского дома или строить дом на меже чужого участка (гл.10). Наряду с\nэтим право собственности ограничивалось либо прямым предписанием закона,\nлибо установлением правового режима, который не гарантировал \"вечной\nсобственности\".<\/p>\n", "t": " вещное право по русской правде. в русской правде в подавляющем большинстве случаев речь идет о праве собственности людей на движимое имущество, движимые вещи, носившие общее название «имения». для обозначения принадлежности вещи использовались термины: мой, твой, его и т.д. в качестве объекта «имения» фигурируют одежда, оружие, кони, другой скот, орудия труда, торговые товары и пр. право частн существляли уполномоченные на то приказы. основными формами земельной собственности были вотчина (наследственное землевладение) и поместье (условное землевладение). вотчины делились на несколько видов в соответствии с характером субъектов (дворцовые, государственные, церковные, частновладельческие) и способами их приобретения (родовые, выслуженные (или пожалованные), купленные). поместные наделы жаловались из княжеских (дворцовых) земель лицам, непосредственно связанным с княжеским дворцом и службой князю. термин «поместье» впервые был использован в судебнике 1497 г. и вошел в обиход для обозначения особого вида условного землевладения, выдаваемого за выполнение государственной службы. соборное уложение. вещи по соборному уложению были предметом целого ряда правомочий, отношений и обязательств. основными способами приобретения имущества считались захват, давность, находка, пожалование и непосредственно приобретение в обмене или при покупке. в уложении 1649 года регламентацию приобретает пожалование земли . оно представляло собой сложный комплекс юридических действий, включавший выдачу жалованной грамоты; составление справки (т.е. запись в приказной книге определенных сведений о наделяемом лице); ввод во владение, который заключался в публичном отмере земли. раздачу земли наряду с поместным приказом осуществляли и другие органы - разрядный приказ, приказ большого дворца, малороссийский, новгородский, сибирский и другие приказы. договор в xvii веке оставался основным способом приобретения прав собственности на имущество, и, в частности, на землю. в договоре теряют значение ритуальные обряды , происходит замена формализованных действий (участие свидетелей при заключении договора) письменными актами (\"рукоприкладством\" свидетелей без их личного участия). впервые в соборном уложении 1649 года регламентировался институт сервитутов (юридическое ограничение права собственности одного лица в интересах права пользования другого или других лиц). законодатель знал личные сервитуты (ограничения в пользу определенных лиц, специально оговоренных в законе), например, потрава лугов ратниками, находящимися на службе. вещные сервитуты (ограничение права собственности в интересах неопределенного числа субъектов) включали: право владельца мельницы в производственных целях заливать нижележащий луг, принадлежащий другому лицу; возможность возводить печь у стены соседского дома или строить дом на меже чужого участка (гл.10). наряду с этим право собственности ограничивалось либо прямым предписанием закона, либо установлением правового режима, который не гарантировал \"вечной собственности\". "}, {"n": "Развитие судебного процесса в начале XVIII в.", "h": "<p>Уже с конца XVII в. в области судебного процесса господствовали\nпринципы розыска, «инквизиционный» процесс. В 1697 г. принят Указ\n<strong>«Об отмене в судных делах очных ставок, о бытии вместо оных\nраспросу и розыску...»<\/strong>. Розыскные начала вводились также в\nгражданские споры. Регламентация этого вида процесса давалась в\nспециальном Кратком изображении процессов или судебных тяжб (1716).<\/p>\n<p><strong>Уголовный процесс<\/strong> и <strong>гражданский судебный\nпроцесс<\/strong> не были достаточно четко разграничены ни в\nзаконодательстве, ни в судебной практике. Различие проявлялось прежде\nвсего в форме судебного разбирательства: в <strong>уголовных\n<\/strong>делах преобладающим становился розыскной принцип\n(государственное обвинение, письменное производство, пытка и т.д.), в\n<strong>гражданских <\/strong>— сохранялись элементы состязательности,\nспора, равенства сторон и т.д., т.е. «суда». Выбор формы судебного\nразбирательства основывался на существе конкретного дела.<\/p>\n<p><em>Процесс делился на три части:<\/em> первая начиналась формальным\nоповещением о начале процесса и продолжалась до получения показаний\nответчика; вторая — собственно разбирательство — длилась вплоть до\nвынесения приговора; третья — от вынесения приговора до его\nисполнения.<\/p>\n<p>Оповещение о явке всех заинтересованных в деле лиц в суд делалось\nофициально и в письменной форме. Претензии челобитчика и пояснения\nответчика также были письменными и протоколировались.<\/p>\n<p>В процессе не допускалось представительство и требовалось личное\nучастие сторон. Исключение составляло представительство одной из сторон\nпо причине болезни и невозможности откладывания слушания дела. <em>Закон\nдопускал отвод судей при наличии на то особых оснований: <\/em>нахождение\nсудьи «в свойстве» с одной из сторон, наличие между судьей и стороной\nвраждебных отношений или долговых обязательств.<\/p>\n<p>Первая стадия заканчивалась на ответе ответчика. Такой ответ мог быть\n«повинным», ответчик мог «запереться» или признаться, но с указанием\nновых обстоятельств дела.<\/p>\n<p>Вторая стадия процесса начиналась с анализа доказательств.\n<em>Различались четыре вида доказательств<\/em> — собственное признание,\nсвидетельские показания, письменные доказательства, присяга.<\/p>\n<p><strong>«Царица доказательств»<\/strong> — собственное признание. Для\nего получения могла применяться пытка. Пытка не являлась вне\nпроцессуальной мерой, она подвергалась законом тщательной регламентации:\nпытали соразмерно занимаемому чину и сословию (дворян, как людей\n«деликатного сложения», следовало пытать не так жестоко, как крестьян),\nвозрасту (лиц старше 70 лет пытке не подвергали, так же, как и\nнедорослей, не достигших 15-летнего возраста), состоянию здоровья\n(нельзя было пытать беременных женщин). Пытать можно только определенное\nчисло раз, после каждой процедуры испытуемому давали возможность\nоправиться и подлечиться. Пытать могли и свидетелей.<\/p>\n<p>Доказательства делились на <strong>совершенные<\/strong> и\n<strong>несовершенные<\/strong>. Совершенными они становились при\nопределенных условиях: собственное признание должно быть дополнительно\nпроверено; свидетельские показания оценивались судом по лицам, их\nприносящим, и обстоятельствам; очистительная присяга также должна была\nперепроверяться на фактах. Совокупность косвенных доказательств (улик)\nне признавалась непреложной и совершенной.<\/p>\n<p>Свидетельские показания не были равноценными. Существовала\nвозможность вовсе отвести свидетеля, например, по мотивам его родства с\nодной из сторон. Негодными свидетелями считались лица, не достигшие\n15-летнего возраста; клятвопреступники, признанные таковыми по суду;\nпроклятые Церковью, клейменые, шельмованные; судимые за разбой,\nворовство и убийство; прелюбодеи; иностранцы, о которых нет достаточных\nсведений.<\/p>\n<p>Свидетелей допрашивал только судья и только в суде (знатным особам\nразрешалось давать показания на дому).<\/p>\n", "t": " уже с конца xvii в. в области судебного процесса господствовали принципы розыска, «инквизиционный» процесс. в 1697 г. принят указ «об отмене в судных делах очных ставок, о бытии вместо оных распросу и розыску...» . розыскные начала вводились также в гражданские споры. регламентация этого вида процесса давалась в специальном кратком изображении процессов или судебных тяжб (1716). уголовный процесс и гражданский судебный процесс не были достаточно четко разграничены ни в законодательстве, ни в судебной практике. различие проявлялось прежде всего в форме судебного разбирательства: в уголовных делах преобладающим становился розыскной принцип (государственное обвинение, письменное производство, пытка и т.д.), в гражданских — сохранялись элементы состязательности, спора, равенства сторон и т.д., т.е. «суда». выбор формы судебного разбирательства основывался на существе конкретного дела. процесс делился на три части: первая начиналась формальным оповещением о начале процесса и продолжалась до получения показаний ответчика; вторая — собственно разбирательство — длилась вплоть до вынесения приговора; третья — от вынесения приговора до его исполнения. оповещение о явке всех заинтересованных в деле лиц в суд делалось официально и в письменной форме. претензии челобитчика и пояснения ответчика также были письменными

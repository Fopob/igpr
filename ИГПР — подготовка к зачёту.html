, не достигшие 15-летнего возраста; клятвопреступники, признанные таковыми по суду; проклятые церковью, клейменые, шельмованные; судимые за разбой, воровство и убийство; прелюбодеи; иностранцы, о которых нет достаточных сведений. свидетелей допрашивал только судья и только в суде (знатным особам разрешалось давать показания на дому). "}, {"n": "Классификация преступлений и наказаний по Соборному Уложению 1649 г.", "h": "<p>В области уголовного права Соборное Уложение уточняет понятие\n<strong>«лихое дело»<\/strong>, злодейство, «воровство», разработанное\nеще в Судебниках (точное определение преступления отсутствует).\nСубъектами преступления могли быть как отдельные лица, так и группа лиц\nстарше 15 лет. Субъектом церковных правонарушений являлось лицо, старше\n20 лет.<\/p>\n<p>Объекты преступления: семья, церковь, государство, личность,\nимущество, нравственность.<\/p>\n<p>Форма преступления- действие или бездействие. Место и время являлись\nквалифицирующим признаком преступления.<\/p>\n<p>Закон разделяет соучастников на <strong>главных<\/strong>\n(<strong>подстрекатели<\/strong>)- те, кто подстрекали к совершению\nпреступления и <strong>второстепенных (пособники, укрыватели)<\/strong>.\nВ свою очередь соучастие может быть, как <strong>физическим<\/strong>\n(содействие, практическая помощь, совершение тех же действий, что\nсовершал главный субъект преступления), так и\n<strong>интеллектуальным<\/strong> (например, подстрекательство к\nубийству в гл. XXII). В этой связи субъектом стал признаваться даже раб,\nсовершавший преступление по указанию своего господина. Действовал\nпринцип: вышестоящий по званию нес меньшее наказание, чем нижестоящий.\nДети несли более суровое наказание, чем родители.<\/p>\n<p>Субъективная сторона преступления обусловлена степенью вины, Уложение\nзнает деление преступлений, на умышленные, неосторожные и случайные.\nХарактерно, что за неосторожные действия совершивший их наказывается так\nже, как за умышленные преступные действия. В признаках объективной\nстороны преступления закон выделяет <strong>смягчающие<\/strong> и\n<strong>отягчающие<\/strong> <strong>обстоятельства<\/strong>. К первым\nотносятся состояние опьянения, неконтролируемость действий, вызванная\nоскорблением или угрозой (аффект), ко вторым — повторность преступления,\nразмеры вреда, особый статус объекта и предмета преступления,\nсовокупность нескольких преступлений.<\/p>\n<p><em>Закон выделяет отдельные стадии преступного деяния:<\/em> 1)\nумысел (который сам по себе уже может быть наказуемым), 2) подготовка\n(поиск средств, способов, соучастников), 3) приготовление (покупка\nоружия и т.д.), 4) покушение на преступление, 5) совершение\nпреступления. Закон знает понятие рецидива (совпадающее в Уложении с\nпонятием «лихой человек») и крайней необходимости, которая является\nненаказуемой.<\/p>\n<ul>\n<li>Система преступлений по Соборному Уложению выглядела следующим\nобразом:<\/li>\n<\/ul>\n<p>а) <strong>преступления против церкви:<\/strong> богохульство в любой\nформе- квалифицированная смерть через сожжение, прерывание хода литургии\nв храме- смерть, произнесение в ней непристойных речей в лицо\nмитрополиту, игумену или другому священническому чину- торговая\nказнь.<\/p>\n<p>б) <strong>государственные преступления<\/strong>, любые действия (и\nдаже умысел), направленные против личности государя или его семьи, бунт,\nзаговор, измена- смертная казнь и конфискация имущества. Родственники,\nне знавшие о преступлении, освобождаются от наказания, также им\nвыделяется прожиток из конфискованного имущества;<\/p>\n<p>в) <strong>преступления против порядка управления:<\/strong> злостная\nнеявка ответчика в суд и сопротивление приставу, изготовление фальшивых\nграмот, актов и печатей, самовольный выезд за границу,\nфальшивомонетничество, содержание без имеющегося разрешения питейных\nзаведений и самогоноварение, принесение в суде ложной присяги, дача\nложных свидетельских показаний, «ябедничество» или ложное обвинение (в\nпоследнем случае к «ябеде» применялось то наказание, которое было бы\nприменено к человеку ложно им обвиненному. Здесь явно действовал древний\nпринцип талиона — «око за око, зуб за зуб», т.е. модификация кровной\nмести); Данные правонарушения карались смертной казнью, путем залития\nолова.<\/p>\n<p>д) <strong>должностные преступления:<\/strong> взяточничество,\nнеправомерные поборы, вымогательство, заведомо несправедливое решение\nдела, обусловленное корыстью или личной неприязнью, фальсификация\nдокументов, сведений, искажения в денежных бумагах и т.д.<\/p>\n<p>е) <strong>воинские преступления:<\/strong> нанесение ущерба частным\nлицам, мародерство, побег из части.<\/p>\n<p>е) <strong>преступления против личности:<\/strong> убийство,\nразделявшееся на <strong>простое<\/strong> и <strong>квалифицированное\n<\/strong>(убийство ядом), нанесение увечья- большие штрафы, выплата\nкомпенсаций потерпевшему; побои, оскорбление чести. Вовсе не\nнаказывалось убийство изменника или вора на месте преступления (убитого\nили раненого нужно было незамедлительно предъявить «окольным людям»\n(соседям, односельчанам), затем доставить его с поличным соответствующим\nвластям). Умышленное убийство каралось смертной казнью.<\/p>\n<p>ж) <strong>имущественные преступления:<\/strong> кража\n(татьба)-<strong>тайное хищение<\/strong>, <strong>простая<\/strong> и\n<strong>квалифицированная<\/strong> (церковная, на службе, конокрадство,\nсовершенная в государевом дворе, кража овощей из огорода и рыбы из\nсадка), разбой-<strong>открытое хищение<\/strong> (совершаемый в виде\nпромысла) и грабеж <strong>обыкновенный<\/strong> или\n<strong>квалифицированный<\/strong> (совершенный служилыми людьми или\nдетьми в отношении родителей), мошенничество (хищение, связанное с\nобманом, но без насилия), поджог (пойманного поджигателя бросали в\nогонь), насильственное завладение чужим имуществом (землей, животными),\nпорча чужого имущества. Смертная казнь назначалась, если человек был\nуличен в краже в третий раз.<\/p>\n<p>з) <strong>преступления против нравственности= против\nблагочиния:<\/strong> не почитание детьми родителей, отказ содержать\nпрестарелых родителей, сводничество, «блуд» жены (но не мужа), половая\nсвязь господина с рабой, содержание притонов, укрывательство беглых,\nнезаконная продажа имущества, недозволенная запись в заклад, обложение\nпошлинами освобожденных от них лиц.<\/p>\n<p>Целями наказания по Соборному Уложению были устрашение и возмездие,\nизоляция преступника от общества составляла дополнительную и\nвторостепенную цель.<\/p>\n<ul>\n<li>Для системы наказаний были характерны следующие признаки:<\/li>\n<\/ul>\n<p>а) <strong>индивидуализация наказания<\/strong> (жена и дети\nпреступника не отвечали за совершенное им деяние);<\/p>\n<p>б) <strong>сословный характер наказания.<\/strong> Он выражался в том,\nчто за одни и те же преступления разные субъекты несли разную\nответственность;<\/p>\n<p>в) <strong>неопределенность в установлении наказания.<\/strong> Этот\nпризнак был связан с целью наказания — устрашением. В приговоре мог быть\nуказан не сам вид наказания, а использовались такие формулировки: «как\nгосударь укажет», «по вине» или «наказать жестоко». Если даже вид\nнаказания был определен, неясным оставался способ его исполнения\n(«наказать смертью») или мера (срок) наказания (бросить «в тюрьму до\nгосударева указа»). Принцип неопределенности дополнялся принципом\nмножественности наказаний. За одно и то же преступление могло быть\nустановлено сразу несколько наказаний. За кражу наказания\nустанавливались по нарастающей: за первую кражу — битье кнутом и\nурезание уха, два года тюрьмы и ссылка; за вторую — битье кнутом,\nурезание уха, четыре года тюрьмы; за третью — смертная казнь.<\/p>\n<p><em>Смертная казнь делилась на<\/em>\n<strong>квалифицированную<\/strong> (колесование, четвертование,\nсожжение, залитие горла металлом, закапывание живьем в землю) и\n<strong>простую<\/strong> (отсечение головы, повешение).<\/p>\n<ul>\n<li><p>Виды наказаний:<\/p><\/li>\n<li><p><strong>имущественные<\/strong>: конфискация, штрафы и\nт.д.<\/p><\/li>\n<li><p><strong>церковные<\/strong>: отлучение от церкви, епитимия и\nт.д.<\/p><\/li>\n<li><p><strong>бесчестящие наказания<\/strong>: выговор в присутствии\nпонятых, выдача головой, лишение званий или понижение в чине, к примеру\nперевод из бояр в дворяне.<\/p><\/li>\n<\/ul>\n<p><strong>Язычная молка- <\/strong>показания, данные на пытке<\/p>\n<p><strong>Порука- <\/strong>слежка за подозреваемым<\/p>\n", "t": " в области уголовного права соборное уложение уточняет понятие «лихое дело» , злодейство, «воровство», разработанное еще в судебниках (точное определение преступления отсутствует). субъектами преступления могли быть как отдельные лица, так и группа лиц старше 15 лет. субъектом церковных правонарушений являлось лицо, старше 20 лет. объекты преступления: семья, церковь, государство, личность, имущество, нравственность. форма преступления- действие или бездействие. место и время являлись квалифицирующим признаком преступления. закон разделяет соучастников на главных ( подстрекатели )- те, кто подстрекали к совершению преступления и второстепенных (пособники, укрыватели) . в свою очередь соучастие может быть, как физическим (содействие, практическая помощь, совершение тех же действий, что совершал главный субъект преступления), так и интеллектуальным (например, подстрекательство к убийству в гл. xxii). в этой связи субъектом стал признаваться даже раб, совершавший преступление по указанию своего господина. действовал принцип: вышестоящий по званию нес меньшее наказание, чем нижестоящий. дети несли более суровое наказание, чем родители. субъективная сторона преступления обусловлена степенью вины, уложение знает деление преступлений, на умышленные, неосторожные и случайные. характерно, что за неосторожные действия совершивший их наказывается так же, как за умышленные преступные действия. в признаках объективной стороны преступления закон выделяет смягчающие и отягчающие обстоятельства . к первым относятся состояние опьянения, неконтролируемость действий, вызванная оскорблением или угрозой (аффект), ко вторым — повторность преступления, размеры вреда, особый статус объекта и предмета преступления, совокупность нескольких преступлений. закон выделяет отдельные стадии преступного деяния: 1) умысел (который сам по себе уже может быть наказуемым), 2) подготовка (поиск средств, способов, соучастников), 3) приготовление (покупка оружия и т.д.), 4) покушение на преступление, 5) совершение преступления. закон знает понятие рецидива (совпадающее в уложении с понятием «лихой человек») и крайней необходимости, которая является ненаказуемой. система преступлений по соборному уложению выглядела следующим образом: а) преступления против церкви: богохульство в любой форме- квалифицированная смерть через сожжение, прерывание хода литургии в храме- смерть, произнесение в ней непристойных речей в лицо митрополиту, игумену или другому священническому чину- торговая казнь. б) государственные преступления , любые действия (и даже умысел), направленные против личности государя или его семьи, бунт, заговор, измена- смертная казнь и конфискация имущества. родственники, не знавшие о преступлении, освобождаются от наказания, также им выделяется прожиток из конфискованного имущества; в) преступления против порядка управления: злостная неявка ответчика в суд и сопротивление приставу, изготовление фальшивых грамот, актов и печатей, самовольный выезд за границу, фальшивомонетничество, содержание без имеющегося разрешения питейных заведений и самогоноварение, принесение в суде ложной присяги, дача ложных свидетельских показаний, «ябедничество» или ложное обвинение (в последнем случае к «ябеде» применялось то наказание, которое было бы применено к человеку ложно им обвиненному. здесь явно действовал древний принцип талиона — «око за око, зуб за зуб», т.е. модификация кровной мести); данные правонарушения карались смертной казнью, путем залития олова. д) должностные преступления: взяточничество, неправомерные поборы, вымогательство, заведомо несправедливое решение дела, обусловленное корыстью или личной неприязнью, фальсификация документов, сведений, искажения в денежных бумагах и т.д. е) воинские преступления: нанесение ущерба частным лицам, мародерство, побег из части. е) преступления против личности: убийство, разделявшееся на простое и квалифицированное (убийство ядом), нанесение увечья- большие штрафы, выплата компенсаций потерпевшему; побои, оскорбление чести. вовсе не наказывалось убийство изменника или вора на месте преступления (убитого или раненого нужно было незамедлительно предъявить «окольным людям» (соседям, односельчанам), затем доставить его с поличным соответствующим властям). умышленное убийство каралось смертной казнью. ж) имущественные преступления: кража (татьба)- тайное хищение , простая и квалифицированная (церковная, на службе, конокрадство, совершенная в государевом дворе, кража овощей из огорода и рыбы из садка), разбой- открытое хищение (совершаемый в виде промысла) и грабеж обыкновенный или квалифицированный (совершенный служилыми людьми или детьми в отношении родителей), мошенничество (хищение, связанное с обманом, но без насилия), поджог (пойманного поджигателя бросали в огонь), насильственное завладение чужим имуществом (землей, животными), порча чужого имущества. смертная казнь назначалась, если человек был уличен в краже в третий раз. з) преступления против нравственности= против благочиния: не почитание детьми родителей, отказ содержать престарелых родителей, сводничество, «блуд» жены (но не мужа), половая связь господина с рабой, содержание притонов, укрывательство беглых, незаконная продажа имущества, недозволенная запись в заклад, обложение пошлинами освобожденных от них лиц. целями наказания по соборному уложению были устрашение и возмездие, изоляция преступника от общества составляла дополнительную и второстепенную цель. для системы наказаний были характерны следующие признаки: а) индивидуализация наказания (жена и дети преступника не отвечали за совершенное им деяние); б) сословный характер наказания. он выражался в том, что за одни и те же преступления разные субъекты несли разную ответственность; в) неопределенность в установлении наказания. этот признак был связан с целью наказания — устрашением. в приговоре мог быть указан не сам вид наказания, а использовались такие формулировки: «как государь укажет», «по вине» или «наказать жестоко». если даже вид наказания был определен, неясным оставался способ его исполнения («наказать смертью») или мера (срок) наказания (бросить «в тюрьму до государева указа»). принцип неопределенности дополнялся принципом множественности наказаний. за одно и то же преступление могло быть установлено сразу несколько наказаний. за кражу наказания устанавливались по нарастающей: за первую кражу — битье кнутом и урезание уха, два года тюрьмы и ссылка; за вторую — битье кнутом, урезание уха, четыре года тюрьмы; за третью — смертная казнь. смертная казнь делилась на квалифицированную (колесование, четвертование, сожжение, залитие горла металлом, закапывание живьем в землю) и простую (отсечение головы, повешение). виды наказаний: имущественные : конфискация, штрафы и т.д. церковные : отлучение от церкви, епитимия и т.д. бесчестящие наказания : выговор в присутствии понятых, выдача головой, лишение званий или понижение в чине, к примеру перевод из бояр в дворяне. язычная молка- показания, данные на пытке порука- слежка за подозреваемым "}, {"n": "Развитие основных институтов обязательственного права в русском законодательстве XI-XVIII вв.", "h": "<p>Обязательственные отношения могли возникать из причинения вреда или\nиз договоров. За невыполнение обязательств должник отвечал имуществом, а\nиногда и своей свободой. Форма заключения: устная, при свидетелях, на\nторгу или в присутствии мытника.<\/p>\n<p><em>В Русской Правде упоминаются договоры:<\/em> купли-продажи (людей,\nвещей, копей, самопродажи), pайма (денег, вещей), кредитования (под\nпроценты или без), личного найма (в услужение, для выполнения\nопределенной работы), хранения, поручения (выполнять определенные\nдействия) и пр.<\/p>\n<p><strong>Псковская судная грамота (ПСГ) 1467 г.<\/strong><\/p>\n<p>Обязательственное право регламентировало договоры купли-продажи,\nдарения, залога, займа, мены, поклажи, найма помещений, личного\nнайма.<\/p>\n<p>Форма договора: Устная / письменная.<\/p>\n<p>Оформление - в присутствии священника или свидетелей.<\/p>\n<p>При заключении некоторых договоров требовался заклад (при ссудах и\nзаймах на сумму свыше 1 руб.), поручительство (\"порука\" — если сумма\nменее 1 руб.) или обязательное письменное оформление (\"запись\").<\/p>\n<p><strong>Обязательственное право XV—XVI вв.<\/strong> развивалось по\nлинии постепенной замены личностной ответственности по договорам\nимущественной ответственностью.<\/p>\n<p>При заключении договора займа закон запрещал должникам служить в\nхозяйстве кредиторов.<\/p>\n<p>Прослеживаются попытки законодателя по-новому рассматривать и договор\nличного найма, долгое время бывший источником личной кабальной\nзависимости для нанимающихся.<\/p>\n<p>Неопределенное положение физического лица в законодательстве, т.к.\nперенесение ответственности по обязательствам с конкретных лиц,\nпринимающих их, на третьих лиц, прежде всего на членов семьи: так,\nсупруг отвечал по обязательствам другого супруга, отец — по\nобязательствам детей, дети — за отца. Перенесение ответственности\nдопускалось также от господина на его людей, слуг и крестьян.<\/p>\n<p>Закон предусматривал ситуации, когда третьи лица должны были вступать\nв обязательство, заменяя собой действительных участников отношения. Так,\nсудья или дьяк, получившие взятку от ответчика при рассмотрении\nсудебного дела, сами переходили в положение ответчиков по данному делу и\nна них возлагались все соответствующие обязательства +случаи\nдобровольной замены в обязательстве одного лица другим: кредитор имел\nправо передать третьему лицу полученную от должника кабалу, пометив на\nней акт передачи. Такая передача осуществлялась без согласия должника,\nно сам он мог передать свои обязательства третьим лицам только с\nсогласия кредитора.<\/p>\n<p>Близким к сфере обязательственных отношений был <strong>институт\nзалога<\/strong> (здесь, однако, происходила не передача обязательства, а\nпередача прав на имущество). Залог по русскому праву XV―XVI вв.\nвыражался в переходе на залогополучателя прав владения и пользования\nимуществом залогодателя, но без полного перехода права собственности на\nвещь. (право налогополучателя пользоваться заложенной вещью возникало не\nиз существа залогового отношения, а из специально оговоренного условия о\nпроцентах.)<\/p>\n<p><em>Условия заключения договора:<\/em> свобода воли сторон\n(возможность оспорить такую сделку в течение короткого срока. Закон\nпризнавал недействительной сделку, заключенную в состоянии опьянения или\nпод действием обмана мог быть установлен обман в отношении\nтождественности лица, заключившего сделку, права заключать эту сделку,\nотносительно самого предмета сделки.)<\/p>\n<p>До середины XVI в. преобладающей формой заключения договоров\nоставалось устное соглашение.<\/p>\n<p>К концу века все большее значение стала приобретать письменная форма\nсделок (<strong>кабала<\/strong>). Кабала подписывалась собственноручно\nобязующимися сторонами, а в случае их неграмотности, ― их духовными\nотцами или родственниками (братьями и племянниками, но не сыновьями).\nПостепенно возникала и крепостная (<strong>нотариальная<\/strong>) форма\nсделок, первоначально используемая только в договорах, связанных с\nпродажей некоторых вещей или с кабальными служилыми обязательствами\n(ст.20 Судебника 1497 г.).<\/p>\n<p>*Прекр**ащение обязательства:*<\/p>\n<ul>\n<li><p>исполнение/неисполнение в установленные сроки<\/p><\/li>\n<li><p>смерть одной из сторон.<\/p><\/li>\n<\/ul>\n<p>-срок исполнения при особых обстоятельствах он мог быть продлен\nраспоряжением представителя власти.<\/p>\n<p>Так лицам, пострадавшим от разбоя, выдавались <strong>\"полетные\nграмоты\"<\/strong>, в которых устанавливалась отсрочка платежей по\nдолгам, причем для должников положение менялось и в том случае, если в\nчисле пострадавших оказывался и их кредитор.<\/p>\n<p>*Внутри системы Уложения (1649) нормы, регулирующие\nгражданско-правовые отношения, т**есно соприкасались со смежными:*<\/p>\n<p>1)положения о правомочиях собственников (вотчинников, помещиков)\nблизко соприкасаются с нормами государственного и административного\nправа (о службе),<\/p>\n<p>2)нормы обязательственного права смыкаются с уголовно-правовыми\nсанкциями (выдача головой, постановка на правеж).<\/p>\n<p>*Недифференцирован**ность гражданско-правовых норм:*<\/p>\n<p>---установленный законом срок приобретательной давности, доказывающий\nправо собственности на недвижимость, оказывался только дополнительным\nусловием, а законность владения устанавливалась из других\nисточников.<\/p>\n<p>---на практике нередко договор купли-продажи, когда он осуществлялся\nне посредством денег, а других эквивалентов, сливался с меной, договор\nзайма — с договором ссуды.<\/p>\n<p><strong>Обязательственное право XVII.<\/strong><\/p>\n<p>Замена личностной ответственности по договорам имущественной\nответственностью должника. =&gt; вырабатываются широкие пределы для\nпереноса взысканий по обязательствам —на дворы и скот, на вотчины и\nпоместья, на дворы и лавки посадских людей.<\/p>\n<p>Процесс эмансипации личности должника совпадал с общей тенденцией к\nвозрастанию индивидуальности субъективных прав<\/p>\n<p>Перенос ответственности на имущество должника = более интенсивное\nразвитие оборота, параллельно усиливая чисто гражданско-правовые аспекты\nобязательственных отношений. *У**словия заключения договора:*<\/p>\n<ul>\n<li>свобода волеизъявления<\/li>\n<\/ul>\n<p>но: в Соборном Уложении (гл. X, ст. 190) «хозяева квартир, где\nразмещаются военные при исполнении своих обязанностей, становятся\nхранителями вещей этих военных при выступлении последних в поход.»<\/p>\n<p>возможность оспорить такую сделку в течение недели (гл. X, ст. 251)\n*га**рантии против насилия и обмана:*<\/p>\n<ul>\n<li><p>введение специальных процедурных моментов:<\/p><\/li>\n<li><p>присутствие свидетелей при заключении сделки<\/p><\/li>\n<li><p>письменная или \"крепостная\" (нотариальная) форма. (Обязательна\n\"крепостная\" для договоров о передаче недвижимости)<\/p><\/li>\n<\/ul>\n", "t": " обязательственные отношения могли возникать из причинения вреда или из договоров. за невыполнение обязательств должник отвечал имуществом, а иногда и своей свободой. форма заключения: устная, при свидетелях, на торгу или в присутствии мытника. в русской правде упоминаются договоры: купли-продажи (людей, вещей, копей, самопродажи), pайма (денег, вещей), кредитования (под проценты или без), личного найма (в услужение, для выполнения определенной работы), хранения, поручения (выполнять определенные действия) и пр. псковская судная грамота (псг) 1467 г. обязательственное право регламентировало договоры купли-продажи, дарения, залога, займа, мены, поклажи, найма помещений, личного найма. форма договора: устная / письменная. оформление - в присутствии священника или свидетелей. при заключении некоторых договоров требовался заклад (при ссудах и займах на сумму свыше 1 руб.), поручительство (\"порука\" — если сумма менее 1 руб.) или обязательное письменное оформление (\"запись\"). обязательственное право xv—xvi вв. развивалось по линии постепенной замены личностной ответственности по договорам имущественной ответственностью. при заключении договора займа закон запрещал должникам служить в хозяйстве кредиторов. прослеживаются попытки законодателя по-новому рассматривать и договор личного найма, долгое время бывший источником личной кабальной зависимости для нанимающихся. неопределенное положение физического лица в законодательстве, т.к. перенесение ответственности по обязательствам с конкретных лиц, принимающих их, на третьих лиц, прежде всего на член ми и племянниками, но не сыновьями). постепенно возникала и крепостная ( нотариальная ) форма сделок, первоначально используемая только в договорах, связанных с продажей некоторых вещей или с кабальными служилыми обязательствами (ст.20 судебника 1497 г.). *прекр**ащение обязательства:* исполнение/неисполнение в установленные сроки смерть одной из сторон. -срок исполнения при особых обстоятельствах он мог быть продлен распоряжением представителя власти. так лицам, пострадавшим от разбоя, выдавались \"полетные грамоты\" , в которых устанавливалась отсрочка платежей по долгам, причем для должников положение менялось и в том случае, если в числе пострадавших оказывался и их кредитор. *внутри системы уложения (1649) нормы, регулирующие гражданско-правовые отношения, т**есно соприкасались со смежными:* 1)положения о правомочиях собственников (вотчинников, помещиков) близко соприкасаются с нормами государственного и административного права (о службе), 2)нормы обязательственного права смыкаются с уголовно-правовыми санкциями (выдача головой, постановка на правеж). *недифференцирован**ность гражданско-правовых норм:* ---установленный законом срок приобретательной давности, доказывающий право собственности на недвижимость, оказывался только дополнительным условием, а законность владения устанавливалась из других источников. ---на практике нередко договор купли-продажи, когда он осуществлялся не посредством денег, а других эквивалентов, сливался с меной, договор займа — с договором ссуды. обязательственное право xvii. замена личностной ответственности по договорам имущественной ответственностью должника. =&gt; вырабатываются широкие пределы для переноса взысканий по обязательствам —на дворы и скот, на вотчины и поместья, на дворы и лавки посадских людей. процесс эмансипации личности должника совпадал с общей тенденцией к возрастанию индивидуальности субъективных прав перенос ответственности на имущество должника = более интенсивное развитие оборота, параллельно усиливая чисто гражданско-правовые аспекты обязательственных отношений. *у**словия заключения договора:* свобода волеизъявления но: в соборном уложении (гл. x, ст. 190) «хозяева квартир, где размещаются военные при исполнении своих обязанностей, становятся хранителями вещей этих военных при выступлении последних в поход.» возможность оспорить такую сделку в течение недели (гл. x, ст. 251) *га**рантии против насилия и обмана:* введение специальных процедурных моментов: присутствие свидетелей при заключении сделки письменная или \"крепостная\" (нотариальная) форма. (обязательна \"крепостная\" для договоров о передаче недвижимости) "}, {"n": "Обязательственное право по Соборному Уложению 1649 г.", "h": "<p>Широкое распространение получили обязательства из договоров (договоры\nкупли-продажи, мены, займа, поклажи и др.). Соборное Уложение 1649 г.,\nстремясь облегчить положение должников (особенно дворян), запретило\nвзыскивать проценты по займу, считая, что таковой должен быть\nбезвозмездным.<\/p>\n<p>Законодательство предусматривало порядок заключения договоров.\nНаиболее крупные сделки оформлялись крепостным порядком, при котором\nдокумент, удостоверявший сделку, составлялся площадным подьячим при\nобязательном участии в этом не менее двух свидетелей. Менее крупные\nсделки могли оформляться домашним способом. В законе точно не\nопределялся круг сделок, которые должны были оформляться крепостным\nпорядком. Предусматривались способы обеспечения исполнения договоров –\n<strong>залог и поручительство<\/strong>.<\/p>\n<p>Соборное уложение впервые упоминает <strong>сервитуты<\/strong> (право\nна чужие вещи), (Глава№7 право на потраву лугов ратниками или\nнаходящимися на службе, право на въезд в лесные частные угодья ратников\nи находящихся на службе). <strong>Личные сервитуты<\/strong> –это\nограничения в пользу определенных лиц, специально оговоренных в законе,\nнапример, потрава лугов ратниками, находящимися на службе.\n<strong>Вещные сервитуты<\/strong>– это ограничение права собственности в\nинтересах неопределенного числа субъектов. Они включали право владельца\nмельницы в производственных целях заливать нижележащий луг,\nпринадлежащий другому лицу; возможность возводить печь у стены\nсоседского дома или строить дом на меже чужого участка и т.д.<\/p>\n<p><strong>Договоры.<\/strong> В соборное уложение появилось понятие о\nнедействительности договоров (заключение договоров считается\nнедействительным если он заключен обманом, с насилием или в состоянии\nопьянения).<\/p>\n<p>Договоры в основном были письменные, скреплялись подписями свидетелей\nи регистрировались в приказе. Договор считался прекращенным в результате\nисполнения или 15 давности.<\/p>\n<p><em>Виды обязательств:<\/em><\/p>\n<p>1)<strong>Обязательства из договора<\/strong><\/p>\n<p>Обязательства по договорам преобладают перед внедоговорными.\nОбязательства, вытекающие из договора, стали обеспечиваться не\nличностью, а имуществом ответчика. Ответственность не была\nиндивидуальной. Долги по обязательствам переходили по наследству. В\nслучае стихийных бедствий предусматривалась отсрочка уплаты долга до 3\nлет.<\/p>\n<p>2)<strong>Обязательства из деликта<\/strong><\/p>\n<p>Обязательства из деликта в Московском царстве предполагали\nматериальное возмещение. Сохраняется представление о том, что\nматериальное обязательство возникает из убийства. Выплата кабальных\nдолгов убитого из имущества умышленного убийцы подтверждается в тексте\nСоборного уложения (гл. 10, ст. 105—106). Другими основаниями\nвозникновения таких обязательств считались нанесение личных обид,\nворовство и разбой, незаконное владение и пользование чужими вещами,\nистребление и порча вещей, межевых знаков. Мера вознаграждения\nпервоначально определялась судом. Но в Соборном уложении по некоторым\nдействиям устанавливается четко определенная ответственность. В Соборном\nуложении уже достаточно четко различается виновное и невиновное (ст.\n225) причинение вреда, выделяется также причинение вреда умышленное (ст.\n228) и в силу небрежности (ст. 224, 273 и др.).<\/p>\n<p>Средства обеспечения обязательств. Наряду с древнейшими\nпоручительством и залогом (<strong>закладом<\/strong>) к концу XV в. в\nзаконодательстве появляется неустойка. В Соборном уложении идет речь об\nобеспечении неустойкой соглашения о совершении брака и договора мены.\nНеисправимый должник выставлялся на <strong>«правеж» <\/strong>(битье\nбатогами по икрам, количество ударов зависело от суммы долга- 100\nр./месяц), а после отдавался истцу, делали его кабальным холопом, пока\nне отработает свой долг (мужчина- 5 р./год, женщина- 2,60 р./год, дети-\n2 р./год)<\/p>\n<p><em>Виды договоров:<\/em><\/p>\n<p>•<strong>Мена<\/strong> (обмен имения на движимое имущество)<\/p>\n<p>•<strong>Договор купли-продажи<\/strong> (движимые вещи продавались\nпутем словесного договора, а недвижимое с помощью купчей крепости),\n(родовые вотчины можно было продать с согласия государя, но собственнику\nв личное имущество дается только через 40 лет)<\/p>\n<p>•<strong>Договор дарения<\/strong> (ограничивался только к земельным\nвладениям)<\/p>\n<p>•<strong>Договор займа<\/strong> (ограничивал проценты роста до 20% и\nтолько на 5 лет)<\/p>\n<p>•<strong>Поклажа <\/strong>(оформлялся крепостью (письменным актом,\nкроме ратников (воинов))<\/p>\n<p>•<strong>Подряд<\/strong> (ст. 193)<\/p>\n<p>•<strong>Договор личного найма<\/strong> (осуществлялся без договора\nписьменного, но не более чем на 3 месяца), (разрешало отдавать в\nуслужение детей, братьев, племянников только на 5 лет)<\/p>\n<p>•<strong>Договор найма имущества<\/strong> (наем жилья, торговых\nпомещений, складов и аренду земли)<\/p>\n", "t": " широкое распространение получили обязательства из договоров (договоры купли-продажи, мены, займа, поклажи и др.). соборное уложение 1649 г., стремясь облегчить положение должников (особенно дворян), запретило взыскивать проценты по займу, считая, что таковой должен быть безвозмездным. законодательство предусматривало порядок заключения договоров. наиболее ний, складов и аренду земли) "}, {"n": "Суд и розыск по Уложению 1649 г.", "h": "<p>Соборное уложение устанавливало две формы судебного процесса:\n<strong>обвинительно-состязательный<\/strong> и <strong>розыскной\n(политический, уголовный)<\/strong>.<\/p>\n<p><strong>Политический процесс<\/strong> начинался с извета. Для извета\nнужно было сказать: «Слово и дело государева». Изветчика брали под\nстражу. Если изветчик врал, его наказывали кнутом. (Извет&gt; очная\nставка&gt; сыск&gt; вершение).<\/p>\n<p>Обвинительно-состязательный процесс, или суд, применялся при\nрассмотрении имущественных споров и мелких уголовных дел.<\/p>\n<p>Гл. X Уложения подробно описывает различные процедуры \"суда\": процесс\nраспадался на собственно суд и \"вершение\", т.е. вынесение приговора,\nрешения.<\/p>\n<p>Суд начинался с подачи заинтересованным лицом <strong>челобитной\nжалобы <\/strong>в письменной форме (оформлял истец или дьяк, если истец\nне умел писать). Затем пристав вызывал в суд ответчика («срочная\nзазывная грамота»). Последнему при наличии уважительных причин\nпредоставлялось право дважды не являться в суд, однако после третьей\nнеявки он автоматически проигрывал процесс. Выигравшая сторона получала\nсоответствующую грамоту. Ответчик мог выставить вместо себя\nпредставителя.<\/p>\n<p>Последствием неявки в срок для ответчика была выдача\n<strong>«бессудной грамоты»,<\/strong> т.е. утверждение права за истцом\nтак, как если бы суд состоялся; неявка истца вела к прекращению\nиска.<\/p>\n<p>В рассматриваемый период в судебном процессе уцелели элементы\n«божьего суда»: <strong>крестное целование<\/strong>, т.е. присяга\nсторон, допускалось в исках, превышающих 1 рубль, а также для лиц,\nсовершеннолетних и целовавших крест не более двух раз в жизни.<\/p>\n<p>Доказательства: свидетельские показания, письменные доказательства,\nприсяга.<\/p>\n<p><em>Показания свидетелей могли быть нескольких видов:<\/em><\/p>\n<ol type=\"1\">\n<li><p><strong>Ссылка из виноватых<\/strong>- ссылка стороны на показания\nсвидетеля, которые должны были совпасть с утверждениями\nссылающегося<\/p><\/li>\n<li><p><strong>Общая ссылка<\/strong>- обе спорящих стороны обращались к\nодним и тем же свидетелям. Их показания являлись основой решения\nдела.<\/p><\/li>\n<li><p>Свидетелями могли быть лица совершеннолетние; не могли быть\nсвидетелями жена против мужа, дети против родителей, холопы против\nгоспод. Свидетелю из высших классов давалось предпочтение перед\nсвидетелем из низших<\/p><\/li>\n<li><p><strong>Повальный обыск<\/strong>- опрос по поводу конкретного\nлица, подозреваемого в преступлении.<\/p><\/li>\n<\/ol>\n<p>Письменные доказательства – в эпоху Уложения только крепостные акты\nимеют безусловное значение.<\/p>\n<p>Судоговорение в обвинительно-состязательном процессе было устным.\nКаждая стадия процесса (вызов в суд, поручительство, вынесение решения и\nт. д.) оформлялась особой грамотой.<\/p>\n<p><strong>Розыскной процесс<\/strong>, или <strong>сыск<\/strong>,\nприменялся по наиболее важным уголовным делам. Дело в розыскном\nпроцессе, как и по Судебнику 1497 г., могло начинаться с заявления\nпотерпевшего, с обнаружения факта преступления или с наговора.\nГосударственным органам, которые вели следствие по делу, предоставлялись\nширокие полномочия. Они опрашивали свидетелей, проводили пытки,\nприменяли «обыск»— опрос всех свидетелей и подозреваемых и др.<\/p>\n<p>Глава XXI Соборного уложения регламентировала использование\n<strong>пыток<\/strong>. Основанием для ее применения обычно служили\nрезультаты <strong>«обыска»<\/strong>. Пытку можно было применять не\nболее трех раз с определенным перерывом. Показания, данные при пытке\n<strong>(«оговор»)<\/strong>, должны были быть подтверждены другими\nдоказательствами (допроса, присяги, «обыска»). Показания пытаемого\nпротоколировались.<\/p>\n<p><em>Государственные судебные органы состояли из трех\nинстанций:<\/em><\/p>\n<ul>\n<li>губные, земские учреждения, воеводы на местах; приказы; суд Боярской\nдумы и царя.<\/li>\n<\/ul>\n<p>Суд полковых воевод и судей при них над воинскими людьми в период их\nслужбы и полках тоже был разновидностью государственного суда.<\/p>\n<p>Важнейшим центральным судебным звеном были <strong>приказы<\/strong>,\nсреди которых имелись <strong>судебные<\/strong> (судные, четвертные\nприказы) и <strong>приказы со специальной подсудностью<\/strong>\n(Земский, Поместный, Разбойный, Холопий).<\/p>\n<p>Высшей судебной и апелляционной инстанцией в отношении приказов были\n<strong>Боярская дума<\/strong> и <strong>царь<\/strong>.<\/p>\n<p>Уложение допускало отвод судей сторонами по мотивам родства или\nкоммерческого отношения к одной из тяжущихся сторон, но не иначе как до\nсудебного процесса.<\/p>\n<p>Судебное решение считалось окончательным <strong>(«правая\nграмота»)<\/strong> и могло подлежать пересмотру только в порядке\nапелляции в высшую инстанцию.<\/p>\n", "t": " соборное уложение устанавливало две формы судебного процесса: обвинительно-состязательный и розыскной (политический, уголовный) . политический процесс начинался с извета. для извета нужно было сказать: «слово и дело государева». изветчика брали под стражу. если изветчик врал, его наказывали кнутом. (извет&gt; очная ставка&gt; сыск&gt; вершение). обвинительно-состязательный процесс, или суд, применялся при рассмотрении имущественных споров и мелких уголовных дел. гл. x уложения подробно описывает различные процедуры \"суда\": процесс распадался на собственно суд и \"вершение\", т.е. вынесение приговора, решения. суд начинался с подачи заинтересованным лицом челобитной жалобы в письменной форме (оформлял истец или дьяк, если истец не умел писать). затем пристав вызывал в суд ответчика («срочная зазывная грамота»). последнему при наличии уважительных причин предоставлялось право дважды не являться в суд, однако после третьей неявки он автоматически проигрывал процесс. выигравшая сторона получала соответствующую грамоту. ответчик мог выставить вместо себя представителя. последствием неявки в срок для ответчика была выдача «бессудной грамоты», т.е. утверждение права за истцом так, как если бы суд состоялся; неявка истца вела к прекращению иска. в рассматриваемый период в судебном процессе уцелели элементы «божьего суда»: крестное целование , т.е. присяга сторон, допускалось в исках, превышающих 1 рубль, а также для лиц, совершеннолетних и целовавших крест не более двух раз в жизни. доказательства: свидетельские показания, письменные доказательства, присяга. показания свидетелей могли быть нескольких видов: ссылка из виноватых - ссылка стороны на показания свидетеля, которые должны были совпасть с утверждениями ссылающегося общая ссылка - обе спорящих стороны обращались к одним и тем же свидетелям. их показания являлись основой решения дела. свидетелями могли быть лица совершеннолетние; не могли быть свидетелями жена против мужа, дети против родителей, холопы против господ. свидетелю из высших классов давалось предпочтение перед свидетелем из низших повальный обыск - опрос по поводу конкретного лица, подозреваемого в преступлении. письменные доказательства – в эпоху уложения только крепостные акты имеют безусловное значение. судоговорение в обвинительно-состязательном процессе было устным. каждая стадия процесса (вызов в суд, поручительство, вынесение решения и т. д.) оформлялась особой грамотой. розыскной процесс , или сыск , применялся по наиболее важным уголовным делам. дело в розыскном процессе, как и по судебнику 1497 г., могло начинаться с заявления потерпевшего, с обнаружения факта преступления или с наговора. государственным органам, которые вели следствие по делу, предоставлялись широкие полномочия. они опрашивали свидетелей, проводили пытки, применяли «обыск»— опрос всех свидетелей и подозреваемых и др. глава xxi соборного уложения регламентировала использование пыток . основанием для ее применения обычно служили результаты «обыска» . пытку можно было применять не более трех раз с определенным перерывом. показания, данные при пытке («оговор») , должны были быть подтверждены другими доказательствами (допроса, присяги, «обыска»). показания пытаемого протоколировались. государственные судебные органы состояли из трех инстанций: губные, земские учреждения, воеводы на местах; приказы; суд боярской думы и царя. суд полковых воевод и судей при них над воинскими людьми в период их службы и полках тоже был разновидностью государственного суда. важнейшим центральным судебным звеном были приказы , среди которых имелись судебные (судные, четвертные приказы) и приказы со специальной подсудностью (земский, поместный, разбойный, холопий). высшей судебной и апелляционной инстанцией в отношении приказов были боярская дума и царь . уложение допускало отвод судей сторонами по мотивам родства или коммерческого отношения к одной из тяжущихся сторон, но не иначе как до судебного процесса. судебное решение считалось окончательным («правая грамота») и могло подлежать пересмотру только в порядке апелляции в высшую инстанцию. "}, {"n": "Уложение о наказаниях уголовных и исправительных 1845 г.: понятие преступления, «лестница наказаний».", "h": "<p>Уложение о наказаниях уголовных и исправительных- первый российский\nуголовный кодекс. Было подписано 15 августа 1845 года Николаем I. Оно\nбыло введено в действие в 1846 году. Уложение представляло собой\nкодифицированный нормативный акт, содержавший как нормы, регулировавшие\nобщие вопросы уголовного права, так и устанавливающие ответственность за\nсовершение конкретных преступных посягательств.<\/p>\n<ul>\n<li>Понятие преступления:<\/li>\n<\/ul>\n<p>Уложение делило правонарушения на <strong>преступления<\/strong> и\n<strong>проступки<\/strong>, хотя граница была проведена не слишком\nчетко. Так, по Уложению преступлением или проступком признавалось\nнарушение или неисполнение установленных законом предписаний.\nРазграничение преступлений и проступков проводилось по объекту\nпосягательства, хотя и не очень четко.<\/p>\n<p>Форма вины- <strong>действие<\/strong> или\n<strong>бездействие<\/strong><\/p>\n<p>Состав преступления- <strong>формальный<\/strong> и\n<strong>материальный<\/strong> (предполагает не только совершение деяния,\nа также последствия и причинно-следственные связи между ними).<\/p>\n<p>Уложение 1845 года достаточно определенно формулировало стадии\nсовершения преступления (в современном праве – институт неоконченного\nпреступления). <em>Различались 4 стадии совершения преступления:\n<\/em>обнаружение умысла, приготовление к преступлению, покушение на\nпреступление и «совершившееся» преступление (ст. 8-11). Так называемый\n<strong>«голый» умысел<\/strong>, наказывался только в случаях, прямо\nпредусмотренных в законе (это были наиболее тяжкие государственные\nпреступления), (ст. 9). Уложение 1845 года было последним российским\nуголовным кодексом, устанавливающим ответственность за обнаружение\nумысла на совершение преступления (ст. 10). Наказание за приготовление к\nпреступлению следовало только в установленных законом случаях, при\nусловии, если сам характер приготовительных действий не был\nпротивозаконным (ст. 118). (ст. 11) Уложение же знало виды покушения.\nОтветственность за покушение на преступление определялась «по большей\nили меньшей близости сего покушения к совершению преступления, одною или\nдвумя степенями ниже против наказания, постановленного за самое\nсовершение преступления» (ст. 120).<\/p>\n<p>В Уложении 1845 года очень четко для того времени был сформулирован\nинститут <strong>добровольного отказа от совершения\nпреступления<\/strong> (правда, без сформулированного термина), причем по\nсуществу он вполне совпадал с аналогичным институтом, содержащемся в\nуголовном кодексе России (ст. 16). (ст. 119). Изложенное достаточно\nочевидно свидетельствует о том, что основные понятия института\nнеоконченного преступления в Уложении 1845 года были разработаны на\nвесьма высоком уровне.<\/p>\n<p>Уложение делило преступления и проступки на\n<strong>умышленные<\/strong> и <strong>неумышленные<\/strong>,\n<em>различало умысел двух степеней:<\/em> заранее обдуманный и «по\nвнезапному побуждению». <strong>Неосторожность<\/strong> как форма вины\nне была отражена в виде общего определения, однако в целом неосторожная\nвина влекла применение значительно более мягкого наказания.<\/p>\n<p>Подробно регламентировался институт соучастия, именовавшийся\n<strong>«участием в преступлении»<\/strong>. <em>Выделялись 2 формы\nсоучастия<\/em> – без предварительного согласия и по предварительному\nсогласию, при этом виды соучастников разграничивались в зависимости от\nформы соучастия. Регламентировались также пределы ответственности\nсоучастников.<\/p>\n<p>Уложение устанавливало определенные обстоятельства, «по коим\nсодеянное не должно быть вменяемо в вину». <em>К таковым\nотносились:<\/em> невинность деяния; малолетство; безумие, сумасшествие и\nприпадки болезни; добросовестное заблуждение; принуждение; необходимая\nоборона.<\/p>\n<p>Основаниями уголовной ответственности Уложение признавало\n«несомненную доказанность преступного деяния и виновность».<\/p>\n<p>В системе преступлений на первом месте стояли преступления и\nпроступки против религии, государства, порядка управления, должностные\nпреступления. При этом формулировки отличались громоздкостью и\nказуистичностью, поскольку законодатель стремился предусмотреть все\nвозможные виды преступлений. Так, наказание за убийство\nпредусматривалось 24 статьями Уложения.<\/p>\n<ul>\n<li>Лестница наказаний:<\/li>\n<\/ul>\n<p>Система наказаний по Уложению 1845 года была чрезвычайно сложной и\nгромоздкой. Она представляла собой так называемую лестницу наказаний, в\nкоторой все наказания подразделялись на рода, виды и степени по\nсравнительной их тяжести и располагались в последовательном порядке\nступеней. Было установлено 12 родов наказаний, разделенных на 38\nстепеней, которые образовывали убывающую прогрессию, начиная от смертной\nказни и кончая внушением. При этом отдельно предусматривались наказания\nдля лиц, изъятых от тяжелых наказаний, и для лиц, не изъятых от этих\nнаказаний. Все меры ответственности подразделялись на общие (могли\nназначаться за любые преступления), особенные (назначались за\nпреступления и проступки по службе) и исключительные (за определенные,\nуказанные в законе преступления). Общие наказания, кроме того, делились\nна главные, дополнительные и заменяющие. Главные же в свою очередь могли\nбыть уголовными или исправительными. Н.С. Таганцев писал в конце XIX\nвека: «Ожидания составителей Уложения не оправдались. Лестница,\nсозданная ими, оказалась тяжела и непригодна. Жизнь почти вслед за\nвведением Уложения так расшатала ее, выстроила из нее так много\nступеней, что в ее позднейшей обрисовке ... она сохранила мало сходства\nс первоначальной».<\/p>\n", "t": " уложение о наказаниях уголовных и исправительных- первый российский уголовный кодекс. было подписано 15 августа 1845 года николаем i. оно было введено в действие в 1846 году. уложение представляло собой кодифицированный нормативный акт, содержавший как нормы, регулировавшие общие вопросы уголовного права, так и устанавливающие ответственность за совершение конкретных преступных посягательств. понятие преступления: уложение делило правонарушения на преступления и проступки , хотя граница была проведена не слишком четко. так, по уложению преступлением или проступком признавалось нарушение или неисполнение установленных законом предписаний. разграничение преступлений и проступков проводилось по объекту посягательства, хотя и не очень четко. форма вины- действие или бездействие состав преступления- формальный и материальный (предполагает не только совершение деяния, а также последствия и причинно-следственные связи между ними). уложение 1845 года достаточно определенно формулировало стадии совершения преступления (в современном праве – институт неоконченного преступления). различались 4 стадии совершения преступления: обнаружение умысла, приготовление к преступлению, покушение на преступление и «совершившееся» преступление (ст. 8-11). так называемый «голый» умысел , наказывался только в случаях, прямо предусмотренных в законе (это были наиболее тяжкие государственные преступления), (ст. 9). уложение 1845 года было последним российским уголовным кодексом, устанавливающим ответственность за обнаружение умысла на совершение преступления (ст. 10). наказание за приготовление к преступлению следовало только в установленных законом случаях, при условии, если сам характер приготовительных действий не был противозаконным (ст. 118). (ст. 11) уложение же знало виды покушения. ответственность за покушение на преступление определялась «по большей или меньшей близости сего покушения к совершению преступления, одною или двумя степенями ниже против наказания, постановленного за самое совершение преступления» (ст. 120). в уложении 1845 года очень четко для того времени был сформулирован институт добровольного отказа от совершения преступления (правда, без сформулированного термина), причем по существу он вполне совпадал с аналогичным институтом, содержащемся в уголовном кодексе россии (ст. 16). (ст. 119). изложенное достаточно очевидно свидетельствует о том, что основные понятия института неоконченного преступления в уложении 1845 года были разработаны на весьма высоком уровне. уложение делило преступления и проступки на умышленные и неумышленные , различало умысел двух степеней: заранее обдуманный и «по внезапному побуждению». неосторожность как форма вины не была отражена в виде общего определения, однако в целом неосторожная вина влекла применение значительно более мягкого наказания. подробно регламентировался институт соучастия, именовавшийся «участием в преступлении» . выделялись 2 формы соучастия – без предварительного согласия и по предварительному согласию, при этом виды соучастников разграничивались в зависимости от формы соучастия. регламентировались также пределы ответственности соучастников. уложение устанавливало определенные обстоятельства, «по коим содеянное не должно быть вменяемо в вину». к таковым относились: невинность деяния; малолетство; безумие, сумасшествие и припадки болезни; добросовестное заблуждение; принуждение; необходимая оборона. основаниями уголовной ответственности уложение признавало «несомненную доказанность преступного деяния и виновность». в системе преступлений на первом месте стояли преступления и проступки против религии, государства, порядка управления, должностные преступления. при этом формулировки отличались громоздкостью и казуистичностью, поскольку законодатель стремился предусмотреть все возможные виды преступлений. так, наказание за убийство предусматривалось 24 статьями уложения. лестница наказаний: система наказаний по уложению 1845 года была чрезвычайно сложной и громоздкой. она представляла собой так называемую лестницу наказаний, в которой все наказания подразделялись на рода, виды и степени по сравнительной их тяжести и располагались в последовательном порядке ступеней. было установлено 12 родов наказаний, разделенных на 38 степеней, которые образовывали убывающую прогрессию, начиная от смертной казни и кончая внушением. при этом отдельно предусматривались наказания для лиц, изъятых от тяжелых наказаний, и для лиц, не изъятых от этих наказаний. все меры ответственности подразделялись на общие (могли назначаться за любые преступления), особенные (назначались за преступления и проступки по службе) и исключительные (за определенные, указанные в законе преступления). общие наказания, кроме того, делились на главные, дополнительные и заменяющие. главные же в свою очередь могли быть уголовными или исправительными. н.с. таганцев писал в конце xix века: «ожидания составителей уложения не оправдались. лестница, созданная ими, оказалась тяжела и непригодна. жизнь почти вслед за введением уложения так расшатала ее, выстроила из нее так много ступеней, что в ее позднейшей обрисовке ... она сохранила мало сходства с первоначальной». "}, {"n": "Уложение о наказаниях уголовных и исправительных 1845 г.: основания для освобождения от наказания, смягчения или ужесточения наказания.", "h": "<p>Уголовная ответственность наступала с 7 лет и только после того, как\nвиновность лица и преступность совершенного им деяния были полностью\nдоказаны. Незнание закона не освобождало от наказания.<\/p>\n<ul>\n<li><p>Впервые в «Уложении» давался перечень обстоятельств, устранявших\nнаступление уголовной ответственности (ст. 98):<\/p><\/li>\n<li><p>случайность деяния,<\/p><\/li>\n<li><p>малолетство (до 7 лет) - уголовная ответственность наступала с 7\nлет,<\/p><\/li>\n<li><p>невменяемость (безумие, сумасшествие и припадки болезни,\nприводящие в умоисступление или совершенное беспамятство),<\/p><\/li>\n<li><p>ошибка (случайная или вследствие обмана),<\/p><\/li>\n<li><p>совершение преступленного действия под принуждением (от\nпревосходящей непреодолимой силы),<\/p><\/li>\n<li><p>необходимость обороны.<\/p><\/li>\n<\/ul>\n<p><em>Наказание отменялось в случаях:<\/em><\/p>\n<ul>\n<li><p>смерти преступника,<\/p><\/li>\n<li><p>примирения с обиженным (по частным делам)<\/p><\/li>\n<li><p>истечение давности (ст. 160) - сроки давности устанавливались\nтолько для преступлений<\/p><\/li>\n<li><p>Смягчающие и отягчающие вину обстоятельства.<\/p><\/li>\n<\/ul>\n<p>Уложение устанавливало перечни обстоятельств,\n<strong>уменьшавших<\/strong> и <strong>увеличивающих<\/strong> вину и\nнаказание. <em>К уменьшавшим вину и наказание обстоятельствам\nотносились<\/em>, именуемые в нынешнем законодательстве «явкой с\nповинной», чистосердечным признанием и раскаянием, «деятельным\nраскаянием», «содействием раскрытию преступления».<\/p>\n<p><em>Смягчающими обстоятельствами при совершении преступления являлись\nтакже: <\/em>преступления «по крайней нужде»; «по легкомыслию или же\nслабоумию, глупости и крайнему невежеству»; «вследствие сильного\nраздражения, произведенного обидами, оскорблениями и иными поступками»\nпотерпевшего; вовлечение в преступление «убеждениями, приказаниями или\nдурным примером людей», имевших над виновным «по природе или по закону\nвысшую сильную власть»; а равно «малолетство и несовершеннолетие\nвиновного» (ст. 140, 142).<\/p>\n<p><em>На «увеличение вины и меры наказания» влияли:<\/em> степень умысла\nи «обдуманности в действиях преступника»; противозаконность и\nбезнравственность побуждений к совершению преступления; жестокость,\n«гнусность или безнравственность», а также опасность способа совершения\nпреступления; тяжесть преступления; особая активность при совершении\nпреступления и число привлеченных сообщников; «неискренность и упорство\nв запирательстве» при расследовании преступления (ст. 135).<\/p>\n<p><em>К отягчающим обстоятельствам относились <\/em>также повторность и\nрецидив преступлений («повторение того же преступления или учинение\nдругого после суда и наказания за первое – ст. 137). Примечательно, что\nнаказание увеличивалось и «по мере того, чем выше было состояние, звание\nи степень образованности преступника» (ст. 135). Состояние опьянения\nучитывалось в качестве отягчающего ответственность обстоятельства лишь в\nтом случае, «когда доказано, что виновный привел себя в сие состояние\nименно с намерением совершить сие преступление» (ст. 112).<\/p>\n<p>Уложению 1845 года было известно понятие совокупности преступлений:\nнаказание при этом назначалось по принципу поглощения («суд, упомянув в\nсвоем определении о всех наказаниях, следующих за каждое из тех\nпреступлений, приговаривает виновного к тягчайшему из сих наказаний и в\nсамой высшей оного мере» – ст. 156). Уложение прямо допускало аналогию\nзакона, однако суду предписывалось в данном случае, «не приводя сего\nприговора в действие, представлять о том без замедления на рассмотрение\nПравительствующего Сената» (ст. 155).<\/p>\n", "t": " уголовная ответственность наступала с 7 лет и только после того, как виновность лица и преступность совершенного им деяния были полностью доказаны. незнание закона не освобождало от наказания. впервые в «уложении» давался перечень обстоятельств, устранявших наступление уголовной ответственности (ст. 98): случайность деяния, малолетство (до 7 лет) - уголовная ответственность наступала с 7 лет, невменяемость (безумие, сумасшествие и припадки болезни, приводящие в умоисступление или совершенное беспамятство), ошибка (случайная или вследствие обмана), совершение преступленного действия под принуждением (от превосходящей непреодолимой силы), необходимость обороны. наказание отменялось в случаях: смерти преступника, примирения с обиженным (по частным делам) истечение давности (ст. 160) - сроки давности устанавливались только для преступлений смягчающие и отягчающие вину обстоятельства. уложение устанавливало перечни обстоятельств, уменьшавших и увеличивающих вину и наказание. к уменьшавшим вину и наказание обстоятельствам относились , именуемые в нынешнем законодательстве «явкой с повинной», чистосердечным признанием и раскаянием, «деятельным раскаянием», «содействием раскрытию преступления». смягчающими обстоятельствами при совершении преступления являлись также: преступления «по крайней нужде»; «по легкомыслию или же слабоумию, глупости и крайнему невежеству»; «вследствие сильного раздражения, произведенного обидами, оскорблениями и иными поступками» потерпевшего; вовлечение в преступление «убеждениями, приказаниями или дурным примером людей», имевших над виновным «по природе или по закону высшую сильную власть»; а равно «малолетство и несовершеннолетие виновного» (ст. 140, 142). на «увеличение вины и меры наказания» влияли: степень умысла и «обдуманности в действиях преступника»; противозаконность и безнравственность побуждений к совершению преступления; жестокость, «гнусность или безнравственность», а также опасность способа совершения преступления; тяжесть преступления; особая активность при совершении преступления и число привлеченных сообщников; «неискренность и упорство в запирательстве» при расследовании преступления (ст. 135). к отягчающим обстоятельствам относились также повторность и рецидив преступлений («повторение того же преступления или учинение другого после суда и наказания за первое – ст. 137). примечательно, что наказание увеличивалось и «по мере того, чем выше было состояние, звание и степень образованности преступника» (ст. 135). состояние опьянения учитывалось в качестве отягчающего ответственность обстоятельства лишь в том случае, «когда доказано, что виновный привел себя в сие состояние именно с намерением совершить сие преступление» (ст. 112). уложению 1845 года было известно понятие совокупности преступлений: наказание при этом назначалось по принципу поглощения («суд, упомянув в своем определении о всех наказаниях, следующих за каждое из тех преступлений, приговаривает виновного к тягчайшему из сих наказаний и в самой высшей оного мере» – ст. 156). уложение прямо допускало аналогию закона, однако суду предписывалось в данном случае, «не приводя сего приговора в действие, представлять о том без замедления на рассмотрение правительствующего сената» (ст. 155). "}, {"n": "Органы центрального и местного управления по Судебнику 1497 г.", "h": "<p>Период правления Ивана IV связывается с его реформами в системе\nгосударственного и местного управления.<\/p>\n<p>В 1547 г. Иван Грозный был венчан на царство. С этого момента Россия\nофициально стала монархией. Верховным правителем являлся\n<strong>царь<\/strong>. Также высшим органом являлись удельные\nкнязья.<\/p>\n<p>Одновременно власть царя все же ограничивается <strong>Боярской\nдумой<\/strong>.<\/p>\n<p>Иван IV ввел особую систему террора – <strong>опричнину<\/strong>.<\/p>\n<p>Появился новый высший орган власти (1549 г.) – <strong>Земский\nсобор<\/strong>. <em>Это были представительные органы, в которые\nвходила:<\/em><\/p>\n<ol type=\"1\">\n<li><p>верхняя палата: царь, Боярская дума, духовенство;<\/p><\/li>\n<li><p>нижняя палата: представители от дворянства и верхов посадских\nлюдей.<\/p><\/li>\n<\/ol>\n<p>Земские соборы работали не постоянно, они созывались по указу царя.\nПродолжительность их работы зависела от существа обсуждаемых\nвопросов.<\/p>\n<p>Инициатива созыва Земского собора могла принадлежать как собственно\nцарю, так и сословиям. Компетенция земских вопросов не была четко\nустановлена. Знаменательны соборы, на которых выбирался царь (16-летний\nМихаил Романов).<\/p>\n<p>Значительному реформированию подвергся весь государственный аппарат.\nБыла сформирована <strong>воеводско-приказная система\nуправления<\/strong>.<\/p>\n<p><strong>Приказы<\/strong> формировались из ранее существовавших\nдворцовых управлений (<strong>конюшенный<\/strong>). Компетенция этих\nприказов была аналогичной управлениям.<\/p>\n<p>Поместный приказ занимался поместьями служилых дворян, именно с\nвведением этого органа связано формирование новой системы землевладения\n(<strong>поместьев<\/strong>), их правовое положение все более\nуравнивалось с вотчинами.<\/p>\n<p>Особую группу составляли <strong>территориальные приказы<\/strong>\n(Казанский, Сибирский), введение которых связано с еще одной заслугой\nИвана IV – присоединением Казани и Сибири. Особое место в системе\nприказов занимали военно-административные приказы.<\/p>\n<p>Важное место среди реформ Ивана IV занимает реорганизация армии.\nТеперь основными войсками были дворянская конница и стрельцы (войска,\nиспользующие огнестрельное оружие). Для управления стрельцами был создан\nспециальный <strong>Стрелецкий приказ<\/strong>. Военными формированиями\n(личным составом боярской и дворянской конницы) также ведал Разрядный\nприказ. Казачьи войска управлялись Казачьим приказом.<\/p>\n<p>В годы правления Ивана Грозного все еще сохранялась система замещения\nдолжностей органов власти по принципу местничества, т. е. по\nродовитости, знатности.<\/p>\n<p>Реформы государственной власти Ивана Грозного затронули и систему\nсуда и следствия. Был сформирован центральный полицейский орган –\n<strong>Разбойный приказ<\/strong>. В его компетенцию входили разработка\nдля местных органов рекомендаций по вопросам борьбы с\nпреступлениями.<\/p>\n<p>Иван IV изменил и систему местного управления (Мало-Пинежская земская\nуставная грамота). Были введены <strong>земские<\/strong> и\n<strong>губные избы<\/strong>, занимавшиеся: первые – вопросами\nуправления уезда, последние – вопросами суда и следствия, за исключением\nособо тяжких преступлений (разбоя).<\/p>\n<p>Земские и губные учреждения были выборными. Их члены избирались из\nчисла населения, проживающего в уезде (по сословному признаку), а не как\nэто было ранее назначались из центра. Начала зарождаться система\nместного самоуправления.<\/p>\n<p>Сохранялась центральная власть на местах. В городах были воеводы,\nкоторые должны были обеспечить финансовый контроль государства на\nместах.<\/p>\n", "t": " период правления ивана iv связывается с его реформами в системе государственного и местного управления. в 1547 г. иван грозный был венчан на царство. с этого момента россия официально стала монархией. верховным правителем являлся царь . также высшим органом являлись удельные князья. одновременно власть царя все же ограничивается боярской думой . иван iv ввел особую систему террора – опричнину . появился новый высший орган власти (1549 г.) – земский собор . это были представительные органы, в которые входила: верхняя палата: царь, боярская дума, духовенство; нижняя палата: представители от дворянства и верхов посадских людей. земские соборы работали не постоянно, они созывались по указу царя. продолжительность их работы зависела от существа обсуждаемых вопросов. инициатива созыва земского собора могла принадлежать как собственно царю, так и сословиям. компетенция земских вопросов не была четко установлена. знаменательны соборы, на которых выбирался царь (16-летний михаил романов). значительному реформированию подвергся весь государственный аппарат. была сформирована воеводско-приказная система управления . приказы формировались из ранее существовавших дворцовых управлений ( конюшенный ). компетенция этих приказов была аналогичной управлениям. поместный приказ занимался поместьями служилых дворян, им
